name: ampere-fac-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ampere-fac:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view zenodo.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ampere_fac.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ampere_fac.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ampere_fac.bin missing — compiling and manifesting"
          fi
      - name: Ensure the zenodo.org release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view zenodo.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create zenodo.org --repo omegaflow/sources \
              --title "zenodo.org" \
              --notes "AMPERE Iridium Birkeland (field-aligned) current from the Zenodo CC0 record 22345897 (GRD NetCDF-4 member inside the Zenodo zip) compiled to omegaflow AMPF binary assets (CDN tag = netloc)"
          fi
      - name: Fetch the AMPERE GRD member from Zenodo and manifest the AMPF bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin ampere_fac_compiler -- \
            --url 'https://zenodo.org/api/records/22345897/files/ampere.202309.v2.k060_m08.north.grd.zip/content' \
            --out ampere_fac.bin \
            --ci-mode
