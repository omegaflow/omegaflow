name: antares-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  antares:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the ANTARES 2007-2017 point-source neutrino events once and upload to CDN
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern antares_events_2007_2017.s2e1 --clobber 2>/dev/null && \
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern antares_events_2007_2017.sky1 --clobber 2>/dev/null || \
          ( cargo run -p omegaflow-harvest --release --bin antares_vo_compiler -- \
              --out antares_events_2007_2017.s2e1 \
              --out-map antares_events_2007_2017.sky1 --ci-mode )
