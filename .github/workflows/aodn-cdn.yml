# auto-dispatch: manual — the OPeNDAP dataset URL is a required per-act input; auto-dispatch cannot supply it
name: aodn-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      var:
        description: AODN variable (TEMP|PSAL|UCUR|VCUR|WSSH)
        required: true
        type: string
        default: "TEMP"
      url:
        description: OPeNDAP dataset URL (thredds.aodn.org.au/thredds/dodsC/...; a .dds/.das/.ascii suffix is stripped)
        required: true
        type: string
      start:
        description: first observation index (default 0)
        required: false
        type: string
        default: "0"
      count:
        description: number of observations (default 256)
        required: false
        type: string
        default: "256"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  aodn:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the thredds.aodn.org.au release exists on the CDN
        run: |
          if ! gh release view thredds.aodn.org.au --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create thredds.aodn.org.au --repo omegaflow/sources \
              --title "thredds.aodn.org.au" \
              --notes "IMOS/AODN THREDDS OPeNDAP observations compiled to ICRS records; magic AODN, 8-byte header then n x 26 f64, cadence measured from the observation window."
          fi
      - name: Compile the AODN window and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin aodn_compiler -- \
            --var "${{ inputs.var }}" \
            --body earth \
            --url "${{ inputs.url }}" \
            --start "${{ inputs.start }}" \
            --count "${{ inputs.count }}" \
            --out out \
            --ci-mode
  series-manifest:
    needs: [aodn]
    if: always() && needs.aodn.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fold every aodn shard on the CDN into the year-less series manifest
        run: |
          set -euo pipefail
          FAMILY="thredds.aodn.org.au"
          PREFIX="aodn_"
          MANIFEST="aodn.manifest"
          REPO="omegaflow/sources"
          tmp="$(mktemp -d)"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            | jq -r '.[].tag_name' > "$tmp/tags"
          : > "$tmp/$MANIFEST"
          while IFS= read -r tag; do
            case "$tag" in
              "$FAMILY"|"$FAMILY"-*) ;;
              *) continue ;;
            esac
            gh release view "$tag" --repo "$REPO" \
              --json assets \
              --jq ".assets[] | select(.name|startswith(\"$PREFIX\")) | select(.name|endswith(\".bin\")) | \"\(.name) \(.digest)\"" \
              >> "$tmp/$MANIFEST"
          done < "$tmp/tags"
          sort -u -o "$tmp/$MANIFEST" "$tmp/$MANIFEST"
          if [ ! -s "$tmp/$MANIFEST" ]; then
            echo "no aodn shards on the CDN — the series manifest stays unwritten (0 honored)"
            exit 0
          fi
          echo "$MANIFEST lists $(wc -l < "$tmp/$MANIFEST") shards"
          gh release upload "$FAMILY" "$tmp/$MANIFEST" --clobber --repo "$REPO"
