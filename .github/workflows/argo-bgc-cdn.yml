name: argo-bgc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  argo-bgc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view data-argo.ifremer.fr --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "argo_bgc.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset argo_bgc.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset argo_bgc.bin missing — compiling and manifesting"
          fi
      - name: Compile BGC-Argo profile rows and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin argo_bgc_profile_compiler -- \
            --out-bin argo_bgc.bin --lsk kernels/naif0012.tls \
            --max-profiles 1500 --ci-mode
