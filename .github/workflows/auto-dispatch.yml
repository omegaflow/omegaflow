name: auto-dispatch

concurrency:
  group: auto-dispatch
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - 'tools/harvest/src/bin/**'
permissions:
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Dispatch the workflow(s) whose harvest compiler changed
        env:
          GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
        run: |
          before='${{ github.event.before }}'
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before='${{ github.sha }}^'
          fi
          changed=$(git diff --name-only "$before" '${{ github.sha }}' -- 'tools/harvest/src/bin/*.rs' || true)
          fail=0
          for path in $changed; do
            stem=$(basename "$path" .rs)
            mapfile -t wfs < <(grep -rl -- "--bin $stem" .github/workflows --include='*.yml' | sed 's#^\.github/workflows/##' || true)
            if [ "${#wfs[@]}" = "0" ]; then
              echo "compiler $stem changed — no workflow invokes it, nothing to dispatch"
              continue
            fi
            for wf in "${wfs[@]}"; do
              echo "compiler $stem changed — dispatch $wf"
              gh workflow run "$wf" --repo '${{ github.repository }}' || { echo "DISPATCH FAILED $wf"; fail=1; }
            done
          done
          exit "$fail"
