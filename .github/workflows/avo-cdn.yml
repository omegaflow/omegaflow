name: avo-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  avo:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile AVO radio catalog and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/avo.rad/catalog" \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:Vflux' \
            --skip-null z \
            --out avo_rad.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: avo_rad returned void" \
                 "avo_rad compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
