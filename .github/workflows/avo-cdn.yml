name: avo-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  avo:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"tap_compiler","netloc":"tapvizier.cds.unistra.fr","asset":"avo_rad.json","args":"--root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync --table \"B/avo.rad/catalog\" --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:Vflux' --skip-null z --out avo_rad.json"}
        ]
