name: babamul-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  babamul:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view babamul.caltech.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "babamul_alerts.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset babamul_alerts.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset babamul_alerts.bin missing — compiling and manifesting"
          fi
      - name: Ensure the babamul.caltech.edu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view babamul.caltech.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create babamul.caltech.edu --repo omegaflow/sources \
              --title "babamul.caltech.edu" \
              --notes "Babamul (Caltech) ZTF alert stream candidates packaged to omegaflow sky1 binary assets (CDN tag = netloc)"
          fi
      - name: Compile the Babamul alert stream and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin babamul_compiler -- --ci-mode
