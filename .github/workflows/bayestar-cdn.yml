name: bayestar-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  bayestar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the Bayestar2019 dust column map once and upload to CDN
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern bayestar2019.be19 --clobber 2>/dev/null || \
          ( mkdir -p dust && \
            curl -sSfL --retry 3 --max-time 1800 -o dust/bayestar2019.fits.gz \
              https://dataverse.harvard.edu/api/access/datafile/3424708 && \
            cargo run -p omegaflow-harvest --release --bin bayestar_compiler -- \
              --input dust/bayestar2019.fits.gz --out bayestar2019.be19 --ci-mode )
