name: bgr-infrasound-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  bgr-infrasound:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view download.bgr.de --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "bgr_infrasound.bin"; then
            echo "asset bgr_infrasound.bin already present — manifest skipped"
            exit 0
          fi
          echo "asset bgr_infrasound.bin missing — compiling and manifesting"
      - name: Compile BGR infrasound detection rows and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin bgr_infrasound_compiler -- \
            --out-bin bgr_infrasound.bin --lsk kernels/naif0012.tls \
            --station IS52 --year 2024 --ci-mode
