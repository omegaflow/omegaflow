name: bl-narrowband-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'CSV measurement table URL (the Berkeley L-band narrowband table) — required'
        required: true
        type: string
      limit:
        description: 'row cap (empty = no cap)'
        required: false
        type: string
        default: ''
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  bl-narrowband:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the leap-second table
        run: |
          set -euo pipefail
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Compile the Berkeley L-band narrowband series and upload to CDN
        run: |
          set -euo pipefail
          LIMIT="${{ inputs.limit }}"
          if [ -n "$LIMIT" ]; then
            cargo run -p omegaflow-harvest --release --bin bl_narrowband_compiler -- \
              --url "${{ inputs.url }}" \
              --lsk kernels/naif0012.tls \
              --out data/blpd0.ssl.berkeley.edu/bl_narrowband_lband2017.bin \
              --limit "$LIMIT" \
              --ci-mode
          else
            cargo run -p omegaflow-harvest --release --bin bl_narrowband_compiler -- \
              --url "${{ inputs.url }}" \
              --lsk kernels/naif0012.tls \
              --out data/blpd0.ssl.berkeley.edu/bl_narrowband_lband2017.bin \
              --ci-mode
          fi
