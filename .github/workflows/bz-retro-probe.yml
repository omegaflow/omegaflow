name: bz-retro-probe

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  minute:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the GIC Bz-to-dBdt minute measurement
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT minute"
            cargo run --release -p omegaflow-measure --bin bz_blatt_probe
          } > "bz-blatt-minute.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bz-blatt-minute
          path: bz-blatt-minute.txt
  hourly:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    strategy:
      fail-fast: false
      matrix:
        include:
          - point: abk-2024
            args: --hourly --station ABK
          - point: abk-2025
            args: --hourly --station ABK --hour-start 2025-01-01 --hour-end 2025-12-31
          - point: sod-2024
            args: --hourly --station SOD
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the GIC Bz-to-dBdt hourly measurement
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT ${{ matrix.point }}"
            cargo run --release -p omegaflow-measure --bin bz_retro_probe -- ${{ matrix.args }}
          } > "bz-retro-${{ matrix.point }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bz-retro-${{ matrix.point }}
          path: bz-retro-${{ matrix.point }}.txt
