name: bz-yearly-maxt

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  yearly-maxt:
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      fail-fast: false
      matrix:
        include:
          - point: abk-2024
            args: --hourly --yearly-round --null max-t --alpha 0.01 --n-perm 10000 --station ABK
          - point: abk-2025
            args: --hourly --yearly-round --null max-t --alpha 0.01 --n-perm 10000 --station ABK --hour-start 2025-01-01 --hour-end 2025-12-31
          - point: sod-2024
            args: --hourly --yearly-round --null max-t --alpha 0.01 --n-perm 10000 --station SOD
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the yearly round under the Westfall-Young max-T null (six statistics, lag 0/1 h, B=10000, alpha=0.01, 4 threads)
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT ${{ matrix.point }}"
            cargo run --release -p omegaflow-measure --bin bz_retro_probe -- ${{ matrix.args }} --threads 4
          } > "bz-yearly-maxt-${{ matrix.point }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bz-yearly-maxt-${{ matrix.point }}
          path: bz-yearly-maxt-${{ matrix.point }}.txt
