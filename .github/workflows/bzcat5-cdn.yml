name: bzcat5-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  bzcat5:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"tap_compiler","netloc":"tapvizier.cds.unistra.fr","asset":"bzcat5.json","args":"--root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync --table \"VII/274/bzcat5\" --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:FR;typ:Class' --skip-null z --out bzcat5.json"}
        ]
