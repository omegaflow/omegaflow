name: camargo-uranus-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  camargo-uranus:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the vizier.cfa.harvard.edu release exists on the CDN
        run: |
          if ! gh release view vizier.cfa.harvard.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create vizier.cfa.harvard.edu --repo omegaflow/sources \
              --title "vizier.cfa.harvard.edu" \
              --notes "raw VizieR catalog exports mirrored for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Ensure the naif.jpl.nasa.gov release exists on the CDN
        run: |
          if ! gh release view naif.jpl.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create naif.jpl.nasa.gov --repo omegaflow/sources \
              --title "naif.jpl.nasa.gov" \
              --notes "raw NAIF SPICE reference kernels mirrored for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Manifest the Camargo+2015 Uranus astrometry (6 VizieR asu-tsv), ura111 and ura184_part-3 SPKs to the CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin camargo_uranus_manifestor -- --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "camargo-uranus manifestor returned void" \
                 "the manifestor did not reach the CDN. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
