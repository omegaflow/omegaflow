name: camargo-uranus-cdn
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  camargo-uranus:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Manifest the Camargo+2015 Uranus astrometry (6 VizieR asu-tsv) and the ura111 SPK to the CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin camargo_uranus_manifestor -- --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "camargo-uranus manifestor returned void" \
                 "the manifestor did not reach the CDN. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
