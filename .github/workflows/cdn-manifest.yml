name: cdn-manifest

# The one canonical harvester — every *-cdn.yml caller hands it the measured list
# of {bin, netloc, asset, crate?, args?, sharded?, prefix?, timeout?, refresh?}. The setup
# steps are byte-identical across the family; the parser/compiler stays distinct per
# source (A = A). A caller is a thin `on: workflow_dispatch` + `uses: ./.github/workflows/cdn-manifest.yml`.
# `crate` names the functional crate the bin lives in (default `omegaflow-harvest`);
# a compiler in `omegaflow-measure`/`omegaflow-science` carries its crate explicitly.
# `refresh: true` bypasses the idempotence skip — a source with a ttl or a schedule
# (a live snapshot, a series) must re-harvest although its asset name is present.
on:
  workflow_call:
    inputs:
      harvests:
        description: 'JSON array of {bin, netloc, asset, crate?, args?, sharded?, prefix?, timeout?, refresh?}'
        required: true
        type: string
    secrets:
      OMEGAFLOW_TOKEN:
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 240 }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.harvests) }}
    concurrency:
      group: cdn-manifest-${{ matrix.netloc }}-${{ matrix.asset }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
      RUSTFLAGS: -D warnings
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      OMEGAFLOW_R2_MIRROR: ${{ vars.OMEGAFLOW_R2_MIRROR }}
      OMEGAFLOW_R2_WORKER: ${{ vars.OMEGAFLOW_R2_WORKER }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the ${{ matrix.asset }} and manifest it to the CDN
        run: |
          if [ "${{ matrix.sharded }}" = "true" ]; then
            expected=$(grep -oE "releases/download/${{ matrix.netloc }}/${{ matrix.prefix }}(_t[0-9]+_[0-9]+(_[0-9]+)?)?\.bin" phi/sources.φ \
              | xargs -r -n1 basename | sort -u)
            if [ -z "$expected" ]; then
              echo "no ${{ matrix.prefix }} shards registered — harvest runs (an unharvested volume is pending, not zero)"
            else
              present=$(gh release view ${{ matrix.netloc }} --repo omegaflow/sources \
                --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
              missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
              if [ -z "$missing" ]; then
                echo "$(printf '%s\n' "$expected" | wc -l) registered ${{ matrix.prefix }} shards, all present in release — manifest complete"
                exit 0
              fi
              echo "missing from release: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            fi
          elif [ "${{ matrix.refresh }}" != "true" ] && gh release view ${{ matrix.netloc }} --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ matrix.asset }}"; then
            echo "${{ matrix.asset }} already present — harvest skipped"
            exit 0
          fi
          cargo run --release -p ${{ matrix.crate || 'omegaflow-harvest' }} --bin ${{ matrix.bin }} -- --ci-mode ${{ matrix.args }}
      - name: Open one health issue when the harvest returns void
        if: failure()
        run: |
          bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
            "cdn-manifest: ${{ matrix.bin }} returned void" \
            "${{ matrix.bin }} → ${{ matrix.netloc }}/${{ matrix.asset }} returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            health
