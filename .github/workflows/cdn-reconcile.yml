name: cdn-reconcile

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the registry-to-CDN reconciliation
        run: |
          cargo run -p omegaflow-register --release --bin cdn_reconcile
      - name: Commit the reconciliation table
        continue-on-error: true
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add docs/specs/cdn_reconciliation.json
          git diff --staged --quiet || git commit -m "cdn reconciliation $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            sleep 20
            git pull --rebase --autostash origin main
          done
          exit 1
