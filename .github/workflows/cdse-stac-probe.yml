name: cdse-stac-probe

on:
  workflow_dispatch:

concurrency:
  group: cdse-stac-probe
  cancel-in-progress: false

permissions:
  contents: read

env:
  CDSE_TOKEN: ${{ secrets.CDSE_TOKEN }}
  CDSE_USER: ${{ secrets.CDSE_USER }}
  CDSE_PASS: ${{ secrets.CDSE_PASS }}
  RUSTFLAGS: -D warnings

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build the STAC asset fetcher
        run: cargo build --release -p omegaflow-harvest --bin stac_asset_fetch
      - name: List the CCM collections and the ccm-optical items
        run: |
          target/release/stac_asset_fetch --collections https://catalogue.dataspace.copernicus.eu/stac/collections
          target/release/stac_asset_fetch --items https://catalogue.dataspace.copernicus.eu/stac/collections/ccm-optical/items --prefer geotiff,netcdf
      - name: Fetch one CCM asset (size + sha256) — the token-authenticated edge step
        continue-on-error: true
        run: |
          HREF=$(target/release/stac_asset_fetch --items https://catalogue.dataspace.copernicus.eu/stac/collections/ccm-optical/items --prefer geotiff,netcdf | head -1 | awk '{print $NF}')
          echo "asset: $HREF"
          target/release/stac_asset_fetch --asset "$HREF" --token-env CDSE_TOKEN
