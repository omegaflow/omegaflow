name: ceein-infrasound-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ceein-infrasound:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the leap-second kernel
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ceein.infp.ro --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ceein_infrasound.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ceein_infrasound.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ceein_infrasound.bin missing — compiling and manifesting"
          fi
      - name: Compile C9/CEEIN BDF pressure samples and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin ceein_infrasound_compiler -- \
            --start 2023-10-01T00:00:00 --end 2023-10-01T01:00:00 \
            --out-bin ceein_infrasound.bin --lsk kernels/naif0012.tls --ci-mode
