name: cepheid-parallax-weigh

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  weigh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the DCEP parallax weighing against the Gaia TAP sync host
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin cepheid_parallax_weigh
          } > cepheid-parallax-weigh.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepheid-parallax-weigh
          path: cepheid-parallax-weigh.txt
