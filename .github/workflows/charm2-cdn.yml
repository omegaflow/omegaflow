name: charm2-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  charm2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip only if the asset carries the current arm's size
        id: idempotence
        run: |
          expected_size=14891
          size=$(gh release view tapvizier.cds.unistra.fr --repo omegaflow/sources \
             --json assets --jq '.assets[]?|select(.name=="charm2_gaia.bin")|.size' 2>/dev/null)
          if [ "$size" = "$expected_size" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset charm2_gaia.bin present at $size B — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset charm2_gaia.bin absent or stale (${size:-none} B != $expected_size B) — compiling and manifesting"
          fi
      - name: Compile the CHARM2 x Gaia DR3 cross-match and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin charm2_compiler -- \
            --out charm2_gaia.bin --ci-mode
