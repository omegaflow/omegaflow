name: ci-check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    paths:
      - 'src/**'
      - 'static/**'
      - 'phi/**'
      - 'tools/harvest/**'
      - 'tools/register/**'
      - 'tools/utils/**'
      - 'docs/**'
      - 'Cargo.toml'

permissions:
  issues: write

# The heavy measurement. cancel-in-progress: false — a started run is never cut
# mid-flight, so a per-SHA verdict forms. The fast per-push gates live in
# `ci-gate.yml` (workflow-level concurrency, cancel-in-progress on) so the HEAD
# is gated in minutes even while this long run is queued; the nightly schedule
# guarantees one complete run per day regardless of push cadence.
concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
    - run: cargo test --release --features browser_relay
    - run: cargo test --release -p omegaflow-register
    - run: cargo test --release -p omegaflow-utils
    - run: cargo test --release -p omegaflow-harvest --bin skydirection_compiler
    - run: cargo test --release -p omegaflow-harvest --bin kcdc_compiler
    - run: cargo test --release -p omegaflow-harvest --bin openneuro_compiler
    - run: cargo test --release -p omegaflow-harvest --bin brainvision_compiler
    - run: cargo test --release -p omegaflow-harvest --bin snirf_compiler
    - run: cargo run -q -p omegaflow-utils --bin register_sort -- phi/sources.φ
    - run: node --test static/presence_frame.test.mjs static/sensorium.test.mjs static/radiator.test.mjs static/verdicts.test.mjs static/constants.test.mjs static/color_lut.test.mjs
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo test returned void" \
          "Test job failed on ${{ github.sha }}" \
          health
