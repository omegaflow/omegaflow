name: ci-check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'static/**'
      - 'phi/**'
      - 'tools/harvest/**'
      - 'tools/register/**'
      - 'tools/utils/**'
      - 'docs/**'
      - 'Cargo.toml'
permissions:
  issues: write
concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - run: cargo check --features browser_relay
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo check returned void" \
          "Build job failed on ${{ github.sha }}" \
          health

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test --release --features browser_relay
    - run: cargo test --release -p omegaflow-register
    - run: cargo test --release -p omegaflow-utils
    - run: cargo test --release -p omegaflow-harvest --bin skydirection_compiler
    - run: cargo test --release -p omegaflow-harvest --bin kcdc_compiler
    - run: cargo test --release -p omegaflow-harvest --bin openneuro_compiler
    - run: cargo test --release -p omegaflow-harvest --bin brainvision_compiler
    - run: cargo test --release -p omegaflow-harvest --bin snirf_compiler
    - run: cargo run -q -p omegaflow-utils --bin register_sort -- phi/sources.φ
    - run: node --test static/presence_frame.test.mjs static/sensorium.test.mjs static/radiator.test.mjs static/verdicts.test.mjs static/constants.test.mjs static/color_lut.test.mjs
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo test returned void" \
          "Test job failed on ${{ github.sha }}" \
          health

  dropped-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --release -p omegaflow-register --bin register_lookup
    - name: Delta-Gate — dropped baseline
      run: |
        baseline=$(awk '/^dropped-baseline /{print $2}' docs/zustand/dropped-baseline.md)
        if [ -z "$baseline" ]; then
          echo "dropped-gate: baseline pending — docs/zustand/dropped-baseline.md carries no dropped-baseline line; register the measured baseline" >&2
          exit 1
        fi
        current=$(target/release/register_lookup --dropped --count)
        echo "dropped-gate: baseline ${baseline} | current ${current} | delta $((current - baseline))"
        if [ "$current" -gt "$baseline" ]; then
          echo "dropped-gate: delta $((current - baseline)) > 0 — open points dropped without a resolving commit; carry them forward or bump the baseline in the accepting commit" >&2
          exit 1
        fi
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: dropped-gate returned void" \
          "dropped-gate failed on ${{ github.sha }}" \
          health

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo clippy --all-targets -- -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo clippy returned void" \
          "Clippy job failed on ${{ github.sha }}" \
          health
