name: ci-check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  issues: write

# The heavy nightly/on-demand measurement of the whole tree. It is NOT the per-SHA
# gate — that is `ci-gate.yml` (fast, cancel-in-progress on). Under the old push
# trigger every pushed run took the single pending slot and each newer push replaced
# it before a runner got a job (measured 2026-10-07: 15 of 17 ci-check runs cancelled
# with 0 jobs, 0 success — `cancel-in-progress: false` protects only a running run,
# never a waiting one). One serialized heavy run per night and on dispatch; the
# single heavy runner is shared, so a dispatch waits behind the nightly run.
concurrency:
  group: ci-check
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
    - run: cargo test --release --features browser_relay
    - run: cargo test --release -p omegaflow-register
    - run: cargo test --release -p omegaflow-utils
    - run: cargo test --release -p omegaflow-harvest --bin skydirection_compiler
    - run: cargo test --release -p omegaflow-harvest --bin kcdc_compiler
    - run: cargo test --release -p omegaflow-harvest --bin openneuro_compiler
    - run: cargo test --release -p omegaflow-harvest --bin brainvision_compiler
    - run: cargo test --release -p omegaflow-harvest --bin snirf_compiler
    - run: cargo run -q -p omegaflow-utils --bin register_sort -- phi/sources.φ
    - run: cargo run -q -p omegaflow-register --release --bin cdn_reconcile -- --fail
    - run: node --test static/presence_frame.test.mjs static/sensorium.test.mjs static/radiator.test.mjs static/verdicts.test.mjs static/constants.test.mjs static/color_lut.test.mjs
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo test returned void" \
          "Test job failed on ${{ github.sha }}" \
          health
