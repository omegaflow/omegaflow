name: ci-check
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'static/**'
      - 'phi/**'
      - 'tools/harvest/**'
      - 'tools/register/**'
      - 'tools/utils/**'
      - 'docs/**'
      - 'Cargo.toml'
permissions:
  issues: write
concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - run: cargo check --features browser_relay
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo check returned void" \
          "Build job failed on ${{ github.sha }}" \
          health

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test --release
    - run: cargo test --release -p omegaflow-register
    - run: cargo test --release -p omegaflow-utils
    - run: cargo test --release -p omegaflow-harvest --bin skydirection_compiler
    - run: cargo test --release -p omegaflow-harvest --bin kcdc_compiler
    - run: cargo test --release -p omegaflow-harvest --bin openneuro_compiler
    - run: cargo test --release -p omegaflow-harvest --bin brainvision_compiler
    - run: cargo test --release -p omegaflow-harvest --bin snirf_compiler
    - run: cargo run -q -p omegaflow-utils --bin register_sort -- phi/sources.φ
    - run: node --test static/presence_frame.test.mjs static/sensorium.test.mjs static/radiator.test.mjs static/verdicts.test.mjs
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo test returned void" \
          "Test job failed on ${{ github.sha }}" \
          health

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo clippy --all-targets -- -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo clippy returned void" \
          "Clippy job failed on ${{ github.sha }}" \
          health
