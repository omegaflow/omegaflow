name: ci-check
on:
  push:
    paths:
      - 'src/**'
      - 'phi/**'
      - 'tools/register/**'
      - 'docs/**'
      - 'Cargo.toml'
permissions:
  issues: write
concurrency:
  group: ci-check-${{ github.ref }}
  cancel-in-progress: true
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo check returned void" \
          "Build job failed on ${{ github.sha }}" \
          health

  format:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test --release
    - run: cargo test --release -p omegaflow-register
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo test returned void" \
          "Test job failed on ${{ github.sha }}" \
          health

  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo clippy --all-targets -- -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo clippy returned void" \
          "Clippy job failed on ${{ github.sha }}" \
          health
