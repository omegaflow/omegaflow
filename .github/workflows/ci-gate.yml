name: ci-gate

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'static/**'
      - 'phi/**'
      - 'tools/harvest/**'
      - 'tools/register/**'
      - 'tools/utils/**'
      - 'docs/**'
      - 'Cargo.toml'

permissions:
  issues: write

# The fast per-push gate for the HEAD. A superseded push may cut this run
# mid-flight — that is the point: the newest HEAD must be gated within minutes.
# The heavy measurement (`ci-check`, the long `test` job) stays
# cancel-in-progress: false and is scheduled nightly as well.
concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - run: cargo check --features browser_relay
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo check returned void" \
          "Build job failed on ${{ github.sha }}" \
          health

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo clippy --all-targets -- -D clippy::unreachable -D clippy::todo -D clippy::unimplemented
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: cargo clippy returned void" \
          "Clippy job failed on ${{ github.sha }}" \
          health

  dropped-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --release -p omegaflow-register --bin register_lookup
    - name: Key-Set-Gate — no open point dropped beyond the frozen list
      run: |
        pin=docs/zustand/dropped-legacy-baseline.txt
        if [ ! -f "$pin" ]; then
          echo "dropped-set-gate: pending — $pin absent; seed it from the register-dropped sweep artifact" >&2
          exit 0
        fi
        target/release/register_lookup --dropped-keys | sort -u > current.txt
        awk '!/^#/ && NF' "$pin" | sort -u > pin.txt
        comm -23 current.txt pin.txt > new-drops.txt
        echo "dropped-set-gate: current $(wc -l < current.txt) | pinned $(wc -l < pin.txt) | new $(wc -l < new-drops.txt)"
        if [ -s new-drops.txt ]; then
          echo "dropped-set-gate: new drops not in the frozen list:" >&2
          cat new-drops.txt >&2
          exit 1
        fi
    - name: Gate self-test — shadow null-control is sharp
      run: |
        cargo build --release -p omegaflow-register --bin dropped_gate
        target/release/dropped_gate --shadow
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "health: dropped-gate returned void" \
          "dropped-gate failed on ${{ github.sha }}" \
          health

  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo run -q -p omegaflow-utils --bin register_sort -- phi/sources.φ
    - run: cargo run -q -p omegaflow-register --bin cdn_reconcile -- --fail
    - name: License vocabulary gate — every terms value lies in the closed SPDX set
      run: cargo run -q -p omegaflow-register --bin license_census -- --fail
    - name: clean-tree acceptance — no privileged body name or constant in non-test src/
      run: cargo run -q -p omegaflow-register --bin clean_tree -- --fail
    - run: cargo run -q -p omegaflow-register --bin path_reference_scan -- .
