# fold: arm=block_commit register=tools/measure/data/ci_measurements.φ idempotent=true tag=ci-measurements
# One writer for the CI measurement series: triggered by a completed measuring
# workflow, it downloads that run's artifacts and folds their raw lines into
# tools/measure/data/ci_measurements.φ via block_commit (private index + CAS) —
# never a verdict word, the raw observation only. The pilot arm is field-te-query.

name: ci-measurements-fold

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_run:
    workflows: ["field-te-query"]
    types: [completed]

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  fold:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Download the completed run's measurement artifacts
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.OMEGAFLOW_TOKEN }}
          path: ci-artifacts
          merge-multiple: true
      - name: Fold the raw observations into the tool register
        run: |
          set -euo pipefail
          reg=tools/measure/data/ci_measurements.φ
          run="${{ github.event.workflow_run.id }}"
          head_sha="${{ github.event.workflow_run.head_sha }}"
          folded=0
          for f in ci-artifacts/*; do
            [ -f "$f" ] || continue
            name="$(basename "$f")"
            case "$name" in
              *.txt) ;;
              *) continue ;;
            esac
            {
              echo "run $run head $head_sha artifact $name"
              head -c 6000 "$f" | sed 's/^/note /'
              echo
            } >> "$reg"
            folded=$((folded + 1))
          done
          if [ "$folded" -eq 0 ]; then
            echo "ci-measurements-fold: run $run carried no measurement artifact — the register stays unwritten (0 honored)"
            exit 0
          fi
          cargo run --release -p omegaflow-register --bin block_commit -- \
            --path "$reg" \
            --key "run $run" \
            -m "ci measurements: fold run $run (${{ github.event.workflow_run.name }}) head $head_sha — $folded artifact block(s), raw only"
