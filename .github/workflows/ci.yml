name: CI
on:
  push:
    paths:
      - 'src/**'
      - 'phi/**'
      - 'Cargo.toml'
permissions:
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: cargo check returned void" \
          --body "Build job failed on ${{ github.sha }}" \
          --label health

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: cargo test returned void" \
          --body "Test job failed on ${{ github.sha }}" \
          --label health
