name: cmb-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  cmb:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the Planck SMICA CMB map once and upload to CDN
        run: |
          mkdir -p kernels
          gh release download irsa.ipac.caltech.edu --repo omegaflow/sources \
            --pattern cmb_planck_smica_n64.json --clobber 2>/dev/null && exit 0
          curl -sSfL --retry 3 --max-time 5400 -o kernels/smica.fits \
            https://irsa.ipac.caltech.edu/data/Planck/release_3/all-sky-maps/maps/component-maps/cmb/COM_CMB_IQU-smica_2048_R3.00_full.fits
          cargo run -p omegaflow-harvest --release --bin cmb_planck_compiler -- \
            --input kernels/smica.fits --nside 64 \
            --out cmb_planck_smica_n64.json --ci-mode
      - name: Compile the SPT-3G D1 CMB map once and upload to CDN
        run: |
          set -euo pipefail
          gh release download lambda.gsfc.nasa.gov --repo omegaflow/sources \
            --pattern cmb_spt_d1_n64.json --clobber 2>/dev/null && exit 0
          mkdir -p "$HOME/.cache/omegaflow"
          curl -sSfL -C - --retry 3 --max-time 21600 \
            -o "$HOME/.cache/omegaflow/full_maps_d1.tar.bz2" \
            "https://lambda.gsfc.nasa.gov/data/suborbital/SPT/spt_3g_d1/d1_midell_tqu_healpix/real_data_maps/full_maps_d1.tar.bz2"
          cargo run -p omegaflow-harvest --release --bin cmb_planck_compiler -- \
            --tar "$HOME/.cache/omegaflow/full_maps_d1.tar.bz2" \
            --nside 64 --out cmb_spt_d1_n64.json --ci-mode
