# harvest: format=tar_zst asset=present arm=tar_zst_compiler pattern=^conicus3d_wl_lightcone\.tar\.zst$ idempotent=true timeout=360 tag=zenodo.org

name: conicus-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
      limit:
        description: Stop after N members (empty = the whole archive)
        required: false
        type: string
        default: ''
  schedule:
    - cron: "41 6 * * 5"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  conicus:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the manifest already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view zenodo.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^conicus3d_wl_lightcone.tar.zst$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset conicus3d_wl_lightcone.tar.zst already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset conicus3d_wl_lightcone.tar.zst missing — compiling and manifesting"
          fi
      - name: Compile the Conicus3D member manifest to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          limit="${{ inputs.limit }}"
          args=""
          if [ -n "$limit" ]; then
            args="--limit $limit"
          fi
          cargo run --release -p omegaflow-harvest --bin tar_zst_compiler -- \
            --url https://zenodo.org/api/records/18776222/files/lp_dataset_patched_c000_phase_metadata.tar.zst/content \
            --out conicus3d_wl_lightcone.tar.zst $args
          gh release upload zenodo.org conicus3d_wl_lightcone.tar.zst \
            --repo omegaflow/sources --clobber
