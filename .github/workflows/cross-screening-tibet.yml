name: cross-screening-tibet

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  cross-screening-tibet:
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build the cross-screening probe (one crate)
        run: cargo build --release -p omegaflow-measure --bin cross_te_screen
      - name: Fetch the co-located Open-Meteo series (gyirong/kollab/rasuwa; precip + temperature)
        run: |
          mkdir -p series
          fetch () {
            name="$1"; lat="$2"; lon="$3"; var="$4"
            for attempt in 1 2 3; do
              curl -sSfL --retry 3 --max-time 120 \
                -o "series/${name}_raw.csv" \
                "https://archive-api.open-meteo.com/v1/archive?latitude=${lat}&longitude=${lon}&start_date=2026-08-18&end_date=2026-08-27&hourly=${var}&timezone=UTC&format=csv" \
                && break
              echo "fetch ${name} attempt ${attempt} void — retrying"
              sleep 60
            done
            test -s "series/${name}_raw.csv"
            awk -F, 'NR>1 && $2 != "" {print $2}' "series/${name}_raw.csv" > "series/${name}.csv"
            rm -f "series/${name}_raw.csv"
            test -s "series/${name}.csv"
          }
          fetch gyirong_open-meteo_precipitation  28.8559 85.2950 precipitation
          fetch kollab_open-meteo_precipitation   28.2710 85.5150 precipitation
          fetch rasuwa_open-meteo_precipitation   28.2500 85.1000 precipitation
          fetch gyirong_open-meteo_temperature_2m 28.8559 85.2950 temperature_2m
          fetch kollab_open-meteo_temperature_2m  28.2710 85.5150 temperature_2m
          fetch rasuwa_open-meteo_temperature_2m  28.2500 85.1000 temperature_2m
      - name: Run the cross-screening (conditioned on the gyirong diurnal driver)
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "protocol: cross-screening-tibet.md — gyirong/kollab/rasuwa precip+temperature, cond gyirong temperature_2m"
            cargo run --release -p omegaflow-measure --bin cross_te_screen -- \
              --dir series --cond gyirong_open-meteo_temperature_2m --lags 1,6,12,24 --surrogate 20
          } > cross-screening-tibet.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-screening-tibet
          path: cross-screening-tibet.txt
