name: cses-lap-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  cses-lap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view scidb.cn --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "cses_lap.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset cses_lap.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset cses_lap.bin missing — compiling and manifesting"
          fi
      - name: Ensure the scidb.cn release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view scidb.cn --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create scidb.cn --repo omegaflow/sources \
              --title "scidb.cn" \
              --notes "CSES LAP HDF5 (ScienceDB 10.57760/sciencedb.06921) compiled to omegaflow geo bins (CDN tag = netloc)"
          fi
      - name: Compile the CSES LAP HDF5 and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin cses_lap_compiler -- \
            --file-id 6398427cbae2f1393c118b50 \
            --out cses_lap.bin \
            --ci-mode
