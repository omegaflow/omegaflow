name: d20-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  d20:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view data.pmel.noaa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "d20_thermocline.csv"; then
            echo "asset d20_thermocline.csv already present — manifest skipped"
            exit 0
          fi
          echo "asset d20_thermocline.csv missing — compiling and manifesting"
      - name: Cascade-harvest the d20 source from the runner (curl → r.jina.ai reader)
        run: |
          d_end=$(date -u -d '7 days ago' +%Y-%m-%dT00:00:00Z)
          d_start=$(date -u -d '127 days ago' +%Y-%m-%dT00:00:00Z)
          direct="https://data.pmel.noaa.gov/pmel/erddap/tabledap/pmelTaoDyIso.csv?time,longitude,latitude,station,ISO_6,QI_5006&latitude>=-2&latitude<=2&longitude>=200&longitude<=280&time>=${d_start}&time<=${d_end}"
          mirror="https://coastwatch.pfeg.noaa.gov/erddap/tabledap/pmelTaoDyIso.csv?time%2Clongitude%2Clatitude%2Cstation%2CISO_6%2CQI_5006&latitude%3E=-2&latitude%3C=2&longitude%3E=200&longitude%3C=280&time%3E=${d_start}&time%3C=${d_end}"
          curl -sSL -m 30 -o /dev/null -w 'direct_route_http=%{http_code}\n' "$direct" || \
            echo "direct route refused from the runner — cascade via the r.jina.ai reader"
          if ! curl -sSL -m 180 -H 'X-Return-Format: text' -o d20_thermocline_raw.csv "https://r.jina.ai/${mirror}"; then
            echo "cascade fetch returned void from the runner (r.jina.ai or coastwatch refused)"
            exit 1
          fi
          test "$(wc -c < d20_thermocline_raw.csv)" -gt 50000
          head -1 d20_thermocline_raw.csv | grep -qx 'time,longitude,latitude,station,ISO_6,QI_5006'
          echo "cascade harvest measured: $(wc -c < d20_thermocline_raw.csv) bytes from the runner route"
      - name: Ensure the data.pmel.noaa.gov release exists on the CDN
        run: |
          if ! gh release view data.pmel.noaa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create data.pmel.noaa.gov --repo omegaflow/sources \
              --title "data.pmel.noaa.gov" \
              --notes "PMEL ERDDAP TAO/TRITON d20 isotherm-depth series compiled to CSV assets (CDN tag = netloc)"
          fi
      - name: Compile and manifest the d20 thermocline depth series to the CDN
        run: |
          cargo run --release -p omegaflow-harvest --bin d20_compiler -- \
            --input d20_thermocline_raw.csv \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "d20-cdn: d20_thermocline compile returned void" \
                 "d20 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
