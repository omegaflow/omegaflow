name: dart-tnf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  dart-tnf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the DART TRK-2-34 TNF uplink-carrier-phase series and manifest it to the CDN
        run: |
          if gh release view pdssbn.astro.umd.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "dart_tnf.bin"; then
            echo "dart_tnf.bin already present — harvest skipped"
            exit 0
          fi
          cargo run --release -p omegaflow-harvest --bin dart_tnf_compiler -- --ci-mode
