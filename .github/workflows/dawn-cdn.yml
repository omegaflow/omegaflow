name: dawn-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  dawn:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the Dawn RSS ODF volumes (Ceres/Vesta) and manifest dawn_odf.bin to the CDN
        run: |
          if gh release view sbnarchive.psi.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "dawn_odf.bin"; then
            echo "dawn_odf.bin already present — harvest skipped"
            exit 0
          fi
          cargo run --release -p omegaflow-harvest --bin dawn_odf_compiler -- --ci-mode
