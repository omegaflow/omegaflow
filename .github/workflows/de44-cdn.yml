name: de44-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 2 * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  de44:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the ssd.jpl.nasa.gov release exists on the CDN
        run: |
          if ! gh release view ssd.jpl.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ssd.jpl.nasa.gov --repo omegaflow/sources \
              --title "ssd.jpl.nasa.gov" \
              --notes "raw JPL ephemeris bins compiled for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Compile the DE440 sun/moon/earth line and upload
        run: |
          curl -sfL -o de440.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the de440 bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the bsp. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin de_compiler -- de440.bsp --label de440 --ci-mode
      - name: Compile the DE442 sun/moon/earth line and upload
        run: |
          curl -sfL -o de442.bsp https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de442.bsp \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the de442 bsp returned void" \
                 "curl on ssd.jpl.nasa.gov did not reach the bsp. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin de_compiler -- de442.bsp --label de442 --ci-mode
