name: de44-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 2 * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  de44:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the ssd.jpl.nasa.gov-de release exists on the CDN
        run: |
          if ! gh release view ssd.jpl.nasa.gov-de --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ssd.jpl.nasa.gov-de --repo omegaflow/sources \
              --title "ssd.jpl.nasa.gov-de" \
              --notes "raw JPL ephemeris bins compiled for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Fetch the DE440 lunar orientation kernel and its frame kernel
        run: |
          curl -sfL -o moon_pa_de440.bpc https://naif.jpl.nasa.gov/pub/naif/generic_kernels/pck/moon_pa_de440_200625.bpc \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the moon_pa_de440 bpc returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the lunar orientation kernel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          curl -sfL -o moon_de440.tf https://naif.jpl.nasa.gov/pub/naif/generic_kernels/fk/satellites/moon_de440_250416.tf \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the moon_de440 frame kernel returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the lunar frame kernel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the DE440 sun/moon/earth line and upload
        run: |
          curl -sfL -o de440.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the de440 bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the bsp. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          cargo run -p omegaflow-harvest --release --bin de_compiler -- de440.bsp --label de440 --bodies sun,moon,earth --bpc moon_pa_de440.bpc --fk moon_de440.tf --ci-mode
      - name: Compile the DE442 sun/moon/earth line and upload
        run: |
          curl -sfL -o de442.bsp https://ssd.jpl.nasa.gov/ftp/eph/planets/bsp/de442.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: the de442 bsp returned void" \
                 "curl on ssd.jpl.nasa.gov did not reach the bsp. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          cargo run -p omegaflow-harvest --release --bin de_compiler -- de442.bsp --label de442 --bodies sun,moon,earth --bpc moon_pa_de440.bpc --fk moon_de440.tf --ci-mode
      - name: Compile the DE441 sun/moon/earth line and upload
        run: |
          curl -sfL -o de441_part-1.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp \
            && curl -sfL -o de441_part-2.bsp https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "de44-cdn: a de441 part returned void" \
                 "curl on naif.jpl.nasa.gov did not reach a de441 kernel part. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          cargo run -p omegaflow-harvest --release --bin de_compiler -- de441_part-1.bsp de441_part-2.bsp --label de441 --bodies sun,moon,earth --bpc moon_pa_de440.bpc --fk moon_de440.tf --ci-mode
      - name: Verify every compiled ssd.jpl.nasa.gov-de asset is manifested
        run: |
          set -euo pipefail
          # phi/sources.φ does not carry this netloc: the register lists the
          # handwritten ssd.jpl.nasa.gov release, not the -de line this
          # workflow writes. The expected set is therefore what the three
          # compile steps actually produced in this job — an asset that was
          # compiled but not uploaded still fails here.
          mapfile -t expected < <(find data/ssd.jpl.nasa.gov-de -name '*.bin' -printf '%f\n' | sort -u)
          if [ ${#expected[@]} -eq 0 ]; then
            echo "the compile steps wrote no bin — nothing to verify"
            exit 1
          fi
          present=$(gh release view ssd.jpl.nasa.gov-de --repo omegaflow/sources \
            --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
          missing=$(comm -23 <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "$present"))
          if [ -n "$missing" ]; then
            echo "compiled but not manifested: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "${#expected[@]} compiled ssd.jpl.nasa.gov-de assets all present"
