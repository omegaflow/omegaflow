name: de441-cdn-watch
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Watch the full-de441 bins (size is the measurement)
        run: |
          # S14-Entblock: die CDN-Bins tragen die metergenaue Generation —
          # das volle de441.bsp kompiliert zu ~183 MB (die trunkierte
          # Generation war 13,8 MB). Die Größe ist die Messung (0 honored):
          # ein bloßes 200 genügt nicht, und der manuelle Upload ist genauso
          # gültig wie ein grüner CI-Lauf.
          base=https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov
          ok=1
          for b in sun earth; do
            len=$(curl -sIL "$base/ephemeris_$b.bin" | awk 'tolower($1)=="content-length:" {print $2}' | tr -d '\r' | tail -1)
            echo "ephemeris_$b.bin: $len bytes"
            [ "${len:-0}" -ge 183000000 ] || ok=0
          done
          if [ "$ok" = "1" ]; then
            bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
              "de441-cdn: die vollen Bins liegen — S14 entblockt" \
              "ephemeris_sun.bin + ephemeris_earth.bin tragen die metergenaue 183-MB-Generation (volles de441.bsp) auf dem CDN. Fortsetzung: den TODO-Posten „metergenaue CDN-Bins“ abtragen; die Leitstelle räumt die S14-Zeile." \
              health
          else
            echo "die Bins tragen die metergenaue Generation noch nicht — still"
          fi
