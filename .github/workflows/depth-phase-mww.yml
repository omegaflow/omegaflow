name: depth-phase-mww

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  RUSTFLAGS: -D warnings
jobs:
  mww-feldlauf:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the depth-phase fleet with the USGS mww moment-tensor source term
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin depth_phase_fleet_probe -- --region 34,38,68,74 --mindepth 200 --max-events 1 --mww
          } > depth-phase-mww.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth-phase-mww
          path: depth-phase-mww.txt
