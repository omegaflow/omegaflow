name: des-coverage-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  des-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the DES DR2 survey-footprint coverage asset once and upload to CDN
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern des_dr2_coverage.fp01 --clobber 2>/dev/null || \
          cargo run -p omegaflow-harvest --release --bin des_coverage_compiler -- \
            --out des_dr2_coverage.fp01 --ci-mode
