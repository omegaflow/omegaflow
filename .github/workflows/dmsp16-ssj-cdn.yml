name: dmsp16-ssj-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  dmsp16-ssj:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view cdaweb.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "dmsp16_ssj.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset dmsp16_ssj.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset dmsp16_ssj.bin missing — compiling and manifesting"
          fi
      - name: Ensure the cdaweb.gsfc.nasa.gov release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view cdaweb.gsfc.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create cdaweb.gsfc.nasa.gov --repo omegaflow/sources \
              --title "cdaweb.gsfc.nasa.gov" \
              --notes "CDAWeb anonymous channels compiled to omegaflow typed bins (CDN tag = netloc)"
          fi
      - name: Fetch the DMSP-16 SSJ daily CDF and manifest the DS16 bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin dmsp16_ssj_compiler -- \
            --url 'https://cdaweb.gsfc.nasa.gov/pub/data/dmsp/dmspf16/ssj/precipitating-electrons-ions/2010/dmsp-f16_ssj_precipitating-electrons-ions_20100924_v1.1.2.cdf' \
            --out dmsp16_ssj.bin \
            --ci-mode
