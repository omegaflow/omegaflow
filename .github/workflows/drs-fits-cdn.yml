name: drs-fits-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      url:
        description: LISA Pathfinder DRS FITS granule URL
        required: true
        type: string
        default: https://heasarc.gsfc.nasa.gov/FTP/lpf/data/fits/drs_20160102_093513__20160103_165224.fits
      asset:
        description: output asset name on the CDN (netloc heasarc.gsfc.nasa.gov)
        required: true
        type: string
        default: drs_20160102_093513__20160103_165224.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  drs-fits:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view heasarc.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
          fi
      - name: Compile the DRS differential acceleration and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin drs_fits_compiler -- \
            --url "${{ inputs.url }}" --out "${{ inputs.asset }}" \
            --ci-mode
