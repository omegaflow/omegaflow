name: dsn-cdn

# Der DSN-Zustands-Compiler (`dsn_compiler`) als CDN-Manifestator.
# Ohne diesen Workflow bleibt der `url`-Zeiger
# `…/eyes.nasa.gov/dsn_snapshot.bin` unmanifestiert.
# Quelle ist der Live-DSN-Status `https://eyes.nasa.gov/dsn/data/dsn.xml`;
# der Release-Tag folgt der Quellen-Herkunft. Das Register führt `ttl 60`,
# darum läuft der Manifestator häufiger als die Tages-Kadenz.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  dsn:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"dsn_compiler","netloc":"eyes.nasa.gov","asset":"dsn_snapshot.bin","args":"--out dsn_snapshot.bin","refresh":true}
        ]
