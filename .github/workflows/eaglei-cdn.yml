# harvest: asset=eaglei_<year>.bin arm=eaglei_compiler idempotent=true timeout=240 tag=figshare.com

name: eaglei-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
      year:
        description: EAGLE-I year to manifest
        type: string
        default: "2014"
  schedule:
    # annual product — EAGLE-I carries one release per year; the compiler
    # manifests one year per run and defaults to 2014
    - cron: "0 6 1 4 *"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  eaglei:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          YEAR="${{ inputs.year }}"
          YEAR="${YEAR:-2014}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view figshare.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^eaglei_${YEAR}.bin$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset eaglei_${YEAR}.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset eaglei_${YEAR}.bin missing — compiling and manifesting"
          fi
      - name: Manifest the EAGLE-I county outage series to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          YEAR="${{ inputs.year }}"
          YEAR="${YEAR:-2014}"
          cargo run --release -p omegaflow-harvest --bin eaglei_compiler -- --year "$YEAR" --ci-mode
