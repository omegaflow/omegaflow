name: eht-uvfits-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  eht-uvfits:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Download the EHT 2017 full-array uvfits module and verify its sha256sums
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 5400 -o kernels/e17a10-7-hi-na-1921-293-fits.tgz \
            https://almascience.org/almadata/ec/eht/2016.1.01404.V/e17a10-7-hi-na-1921-293-fits.tgz
          cargo run -p omegaflow-harvest --release --bin eht_uvfits_compiler -- \
            --verify kernels/e17a10-7-hi-na-1921-293-fits.tgz
      - name: Select the ALMA–APEX baseline member, write eht_uvfits.bin, and manifest it to the CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin eht_uvfits_compiler -- \
            --run kernels/e17a10-7-hi-na-1921-293-fits.tgz \
            --pair AA AP --out eht_uvfits.bin --ci-mode
