name: eikonal-tohoku

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the ETOPO1 grid
        run: curl -sSfL --retry 3 --max-time 7200 -o etopo1.grd.gz https://www.ngdc.noaa.gov/mgg/global/relief/ETOPO1/data/ice_surface/grid_registered/netcdf/ETOPO1_Ice_g_gdal.grd.gz
      - name: Verify the grid sha256
        run: echo "98c62471284141f35e91c70f584ba13b2affd7f18b904a55005b453a6838f3a9  etopo1.grd.gz" | sha256sum -c -
      - name: Run the eikonal probe
        run: cargo run --release -p omegaflow-measure --bin tohoku_eikonal_probe -- --grid etopo1.grd.gz > report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eikonal-tohoku-report
          path: report.txt
