name: emm-sdc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EMM_COGNITO_REFRESH_TOKEN: ${{ secrets.EMM_COGNITO_REFRESH_TOKEN }}
  EMM_COGNITO_TOKEN: ${{ secrets.EMM_COGNITO_TOKEN }}
  EMM_COGNITO_CLIENT_ID: ${{ secrets.EMM_COGNITO_CLIENT_ID }}
  RUSTFLAGS: -D warnings
jobs:
  emm-sdc:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view sdc.emiratesmarsmission.ae --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^emm_exi_l2.tar$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset emm_exi_l2.tar already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset emm_exi_l2.tar missing — compiling and manifesting"
          fi
      - name: Compile and manifest the EMM SDC EXI L2 science archive to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin emm_sdc_compiler -- \
            --instrument exi --data-level l2 --ci-mode
