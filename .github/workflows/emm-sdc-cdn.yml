name: emm-sdc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EMM_COGNITO_REFRESH: ${{ secrets.EMM_COGNITO_REFRESH }}
  EMM_COGNITO_REFRESH_TOKEN: ${{ secrets.EMM_COGNITO_REFRESH_TOKEN }}
  EMM_COGNITO_TOKEN: ${{ secrets.EMM_COGNITO_TOKEN }}
  EMM_COGNITO_CLIENT_ID: ${{ secrets.EMM_COGNITO_CLIENT_ID }}
  RUSTFLAGS: -D warnings
jobs:
  emm-sdc:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view sdc.emiratesmarsmission.ae --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^emm_exi_l2a.tar$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset emm_exi_l2a.tar already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset emm_exi_l2a.tar missing — compiling and manifesting"
          fi
      - name: Egress via a non-Azure exit (wireproxy/Proton)
        if: steps.idempotence.outputs.present == 'false'
        env:
          WIREPROXY_CONF: ${{ secrets.PROTON_WG_CONF }}
        run: |
          curl -fsSL -o /tmp/wireproxy.tgz \
            https://github.com/pufferffish/wireproxy/releases/download/v1.1.3/wireproxy_linux_amd64.tar.gz
          tar -xzf /tmp/wireproxy.tgz -C /tmp wireproxy
          printf '%s\n' "$WIREPROXY_CONF" > /tmp/wireproxy.conf
          nohup /tmp/wireproxy -c /tmp/wireproxy.conf >/tmp/wireproxy.log 2>&1 &
          sleep 3
          echo "wireproxy up on socks5h://127.0.0.1:25344"
      - name: Compile and manifest the EMM SDC EXI L2 science archive to the CDN
        if: steps.idempotence.outputs.present == 'false'
        env:
          ALL_PROXY: socks5h://127.0.0.1:25344
          HTTPS_PROXY: socks5h://127.0.0.1:25344
          NO_PROXY: github.com,api.github.com,uploads.github.com,objects.githubusercontent.com
        run: |
          cargo run --release -p omegaflow-harvest --bin emm_sdc_compiler -- \
            --instrument exi --data-level l2a --ci-mode
