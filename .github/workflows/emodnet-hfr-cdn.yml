name: emodnet-hfr-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  emodnet-hfr:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view erddap.emodnet-physics.eu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "emodnet_hfr_nadr.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset emodnet_hfr_nadr.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset emodnet_hfr_nadr.bin missing — compiling and manifesting"
          fi
      - name: Ensure the erddap.emodnet-physics.eu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view erddap.emodnet-physics.eu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create erddap.emodnet-physics.eu --repo omegaflow/sources \
              --title "erddap.emodnet-physics.eu" \
              --notes "EMODnet Physics ERDDAP HFR-NAdr surface total current grids (EUHFR_NRTcurrent_HFR-NAdr-Total) packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the EMODnet HFR-NAdr grid and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin emodnet_hfr_compiler -- --ci-mode
      - name: Emit and upload the sha256 sidecar
        if: steps.idempotence.outputs.present == 'false'
        run: |
          sha256sum data/erddap.emodnet-physics.eu/emodnet_hfr_nadr.bin \
            | tee data/erddap.emodnet-physics.eu/emodnet_hfr_nadr.bin.sha256
          gh release upload erddap.emodnet-physics.eu \
            data/erddap.emodnet-physics.eu/emodnet_hfr_nadr.bin.sha256 \
            --repo omegaflow/sources --clobber
