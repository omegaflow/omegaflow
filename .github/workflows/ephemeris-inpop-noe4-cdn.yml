# harvest: format=ephemeris_inpop asset=present arm=inpop_compiler pattern=^ephemeris_inpop_.*\.bin$ idempotent=true timeout=120 tag=ftp.imcce.fr
# harvest: format=ephemeris_noe4 asset=present arm=noe4_compiler pattern=^ephemeris_noe4_.*\.bin$ idempotent=true timeout=120 tag=ftp.imcce.fr

name: ephemeris-inpop-noe4-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  inpop:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the INPOP asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ftp.imcce.fr --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ephemeris_inpop_earth.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_inpop_earth.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_inpop_earth.bin missing — compiling and manifesting"
          fi
      - name: Download the inpop19a spice tar
        if: steps.idempotence.outputs.present == 'false'
        run: |
          curl -sSfL --retry 3 --max-time 5400 -o inpop19a_spice.tar.gz \
            https://ftp.imcce.fr/pub/ephem/planets/inpop19a/inpop19a_TDB_m100_p100_spice.tar.gz \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "ephemeris-inpop-noe4-cdn: the inpop19a spice tar returned void" \
                 "curl on ftp.imcce.fr did not reach the tar. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the INPOP planet/moon ephemerides and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin inpop_compiler -- \
            inpop19a_spice.tar.gz --ci-mode
  noe4:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the NOE-4 asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ftp.imcce.fr --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ephemeris_noe4_phobos.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_noe4_phobos.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_noe4_phobos.bin missing — compiling and manifesting"
          fi
      - name: Download the NOE-4-2020 Mars-satellite kernel and the de440s SSB carrier
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 5400 -o kernels/NOE-4-2020.bsp \
            https://ftp.imcce.fr/pub/ephem/satel/NOE/MARS/2020/NOE-4-2020.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "ephemeris-inpop-noe4-cdn: the NOE-4-2020.bsp returned void" \
                 "curl on ftp.imcce.fr did not reach the kernel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          curl -sSfL --retry 3 --max-time 5400 -o kernels/de440s.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "ephemeris-inpop-noe4-cdn: de440s.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the de440s SSB carrier. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the NOE-4 Mars-satellite ephemerides and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin noe4_compiler -- \
            kernels/NOE-4-2020.bsp --chain kernels/de440s.bsp --ci-mode
