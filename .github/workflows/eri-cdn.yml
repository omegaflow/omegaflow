name: eri-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  eri:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the noaa-eri-pds.s3.amazonaws.com release exists on the CDN
        run: |
          if ! gh release view noaa-eri-pds.s3.amazonaws.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create noaa-eri-pds.s3.amazonaws.com --repo omegaflow/sources \
              --title "noaa-eri-pds.s3.amazonaws.com" \
              --notes "NOAA Emergency Response Imagery (ERI) GeoTIFF compiled to a per-pixel field. Record stride: lat (f64 LE, deg), lon (f64 LE, deg), value (f64 LE, first-band pixel). Magic ERI1."
          fi
      - name: Fetch an ERI JPEG-in-TIFF tile
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 600 -o kernels/eri_sample.tif \
            https://noaa-eri-pds.s3.amazonaws.com/2005_Hurricane_Katrina/aug30JpegTiles_GCS_NAD83/aug30C0883430w302530n.tif \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "eri-cdn: aug30C0883430w302530n.tif returned void" \
                 "curl on noaa-eri-pds.s3.amazonaws.com did not reach the tile. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile the ERI per-pixel field and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin eri_compiler -- \
            --input kernels/eri_sample.tif \
            --out eri_imagery.bin \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "eri-cdn: eri_imagery.bin returned void" \
                 "eri compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
