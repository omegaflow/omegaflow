name: eve-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      year:
        description: year (e.g. 2011)
        required: true
        type: string
        default: "2011"
      start_doy:
        description: start day of year
        required: false
        type: string
        default: "40"
      end_doy:
        description: end day of year
        required: false
        type: string
        default: "130"
      asset:
        description: output asset name on the CDN (netloc ssd.jpl.nasa.gov)
        required: true
        type: string
        default: eve_lines_2011.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  eve-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ssd.jpl.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
          fi
      - name: Compile and manifest the EVE line series to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin eve_compiler -- \
            --year "${{ inputs.year }}" --start-doy "${{ inputs.start_doy }}" \
            --end-doy "${{ inputs.end_doy }}" \
            --out "${{ inputs.asset }}" --ci-mode
