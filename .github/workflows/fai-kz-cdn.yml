name: fai-kz-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  fai-kz:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view dachs.fai.kz --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "fai_kz_obscore.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset fai_kz_obscore.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset fai_kz_obscore.bin missing — compiling and manifesting"
          fi
      - name: Ensure the dachs.fai.kz release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view dachs.fai.kz --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create dachs.fai.kz --repo omegaflow/sources \
              --title "dachs.fai.kz" \
              --notes "FAI KZ TAP obscore observations (ivo://fai.kz/tap, sync ADQL) packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the FAI KZ obscore table and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin fai_kz_compiler -- --ci-mode
