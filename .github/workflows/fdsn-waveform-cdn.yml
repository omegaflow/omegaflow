name: fdsn-waveform-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  fdsn-waveform:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view service.earthscope.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "fdsn_waveform.bin"; then
            echo "asset fdsn_waveform.bin already present — manifest skipped"
            exit 0
          fi
          echo "asset fdsn_waveform.bin missing — compiling and manifesting"
      - name: Compile IU.ANMO.BHZ ground-velocity samples and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin fdsn_station_compiler -- \
            --network IU --out stations_iu.txt
          cargo run -p omegaflow-harvest --release --bin fdsn_waveform_compiler -- \
            --stations stations_iu.txt --network IU --station ANMO --channel BHZ \
            --location 00 --start 2020-01-01T00:00:00 --end 2020-01-01T00:01:00 \
            --out anmo_bhz.txt --emit-bin fdsn_waveform.bin \
            --lsk kernels/naif0012.tls --ci-mode
