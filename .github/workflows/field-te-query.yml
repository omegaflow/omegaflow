name: field-te-query

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Parity bridge — the core against the recorded ENSO Blatt I verdict
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --parity | tee field-te-parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-parity
          path: field-te-parity.txt
  witness:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Witness arm — first point-event TE measurement (erbq × solar IMF Bz)
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --descriptor phi/pipeline/descriptors/erbq-solar.te | tee field-te-witness.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-witness
          path: field-te-witness.txt
  witness-count:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Count panel — point-event#1 x solar IMF Bz (exposure-weighted, empirical rank p)
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --descriptor phi/pipeline/descriptors/erbq-event-q2.te | tee field-te-count.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-count
          path: field-te-count.txt
  witness-jma:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Witness JMA arm — JMA point-event #2 TE measurement (erbq × solar F10.7)
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --parity-witness 'point-event#2' --driver solar_f107_flux_sfu | tee field-te-jma.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-jma
          path: field-te-jma.txt
  matrix-corona:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Corona confound matrix — conditional TE over the 9 AIA/XRS actors
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --descriptor phi/pipeline/descriptors/corona_confound_matrix.te | tee field-te-matrix-corona.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-matrix-corona
          path: field-te-matrix-corona.txt
  matrix-dispersion:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Dispersion solar matrix — conditional TE over the 7 AIA + XRS-A actors
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --descriptor phi/pipeline/descriptors/dispersion_solar.te | tee field-te-matrix-dispersion.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-matrix-dispersion
          path: field-te-matrix-dispersion.txt
  matrix-vlies:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Universelles Vlies — the 15-field TE matrix (Rats-Verdikt Schritt 2; Rat 2026-10-06)
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --descriptor phi/pipeline/descriptors/vlies_matrix.te | tee field-te-matrix-vlies.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-matrix-vlies
          path: field-te-matrix-vlies.txt
