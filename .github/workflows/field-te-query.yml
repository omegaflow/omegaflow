name: field-te-query

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Parity bridge — the core against the recorded ENSO Blatt I verdict
        shell: bash
        run: |
          set -o pipefail
          cargo run --release -p omegaflow-measure --bin field_te_query -- --parity | tee field-te-parity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: field-te-parity
          path: field-te-parity.txt
