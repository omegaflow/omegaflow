# auto-dispatch: manual — the cutout target dia_source_id/mjd_tai are per-act inputs; auto-dispatch cannot supply them
name: fink-cutout-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dia_source_id:
        description: Fink diaSourceId (e.g. 314002968168367863)
        required: true
        type: string
      mjd_tai:
        description: Observation epoch MJD (TAI) — the cutout FITS carries no MJD-OBS, the epoch comes from the alert metadata
        required: true
        type: string
      kind:
        description: cutout kind
        required: false
        default: Science
        type: choice
        options:
          - Science
          - Template
          - Difference
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  fink-cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the api.lsst.fink-portal.org release exists on the CDN
        run: |
          if ! gh release view api.lsst.fink-portal.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create api.lsst.fink-portal.org --repo omegaflow/sources \
              --title "api.lsst.fink-portal.org" \
              --notes "Fink/LSST difference-image cutouts compiled to a typed flux bin (CDN tag = netloc)"
          fi
      - name: Compile the Fink cutout and upload
        run: |
          cargo run --release -p omegaflow-harvest --bin fink_cutout_compiler -- \
            --dia-source-id "${{ inputs.dia_source_id }}" \
            --mjd-tai "${{ inputs.mjd_tai }}" \
            --kind "${{ inputs.kind }}" \
            --out data/api.lsst.fink-portal.org/fink_cutout.bin \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "fink-cutout-cdn: cutout compile returned void" \
                 "fink cutout compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Verify the registered api.lsst.fink-portal.org fink_cutout asset is manifested
        run: |
          set -euo pipefail
          expected=$(bash .github/workflows/scripts/register_release_set.sh api.lsst.fink-portal.org fink_cutout)
          if [ -z "$expected" ]; then
            echo "no fink_cutout asset registered — the register is the source of truth (pending, not zero)"
            exit 1
          fi
          present=$(gh release view api.lsst.fink-portal.org --repo omegaflow/sources \
            --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
          if [ -n "$missing" ]; then
            echo "registered but not manifested: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "$(printf '%s\n' "$expected" | wc -l) registered api.lsst.fink-portal.org fink_cutout assets all present"
