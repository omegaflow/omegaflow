name: frb-a279-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  frb-a279:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile FRB A279 via TAPVizieR and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/693/A279/frbs \
            --columns 'name:TNS;ra:RAJ2000;dec:DEJ2000;z:z;dm:DM;tausc:tausc' \
            --out frb_a279.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: frb_a279 returned void" \
                 "frb_a279 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
