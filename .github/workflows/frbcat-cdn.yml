name: frbcat-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  frbcat:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"tap_compiler","netloc":"tapvizier.cds.unistra.fr","asset":"frbcat_flat.json","args":"--root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync --table J/other/PASA/33.45/frbcat --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:zHost;dm:DM;speak:Speak' --async 3600 --out frbcat_flat.json"}
        ]
