name: fugin-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      url:
        description: FUGIN cube FITS URL (NAXIS=3 VRAD, e.g. 12CO)
        required: true
        type: string
        default: http://jvo.nao.ac.jp/skynode/do/download/nobeyama/fugin/fugin_meta/FGN00000000
      asset:
        description: output asset name on the CDN (netloc jvo.nao.ac.jp)
        required: true
        type: string
        default: fgn00000000.sky1
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  fugin:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view jvo.nao.ac.jp --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
          fi
      - name: Compile the FUGIN moment-0 map and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin fugin_skymap_compiler -- \
            --url "${{ inputs.url }}" --out "${{ inputs.asset }}" \
            --ci-mode
