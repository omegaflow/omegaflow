name: funken-probe

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      broker_position:
        description: 'broker_difference_probe --pos <ra>,<dec>'
        required: false
        default: '148.84,2.55'
      tdb_window_s:
        description: 'tdb_coincidence_probe coincidence window in seconds'
        required: false
        default: '60'
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  broker-difference:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the broker-difference probe (Funke 3 — Fink / Lasair / ALeRCE cone membership)
        run: |
          mkdir -p tmp
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin broker_difference_probe -- \
              --pos "${{ inputs.broker_position }}"
          } > funken-broker-difference.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funken-broker-difference
          path: |
            funken-broker-difference.txt
            tmp/broker_diff_*.json
  tdb-coincidence:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the TDB-Rømer coincidence probe (Funke 5 — calibration pair, equal arrival time at opposite sightlines)
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin tdb_coincidence_probe -- \
              --ra1 0 --dec1 0 --t1 60000 \
              --ra2 180 --dec2 0 --t2 60000 \
              --window-s "${{ inputs.tdb_window_s }}"
          } > funken-tdb-coincidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: funken-tdb-coincidence
          path: funken-tdb-coincidence.txt
