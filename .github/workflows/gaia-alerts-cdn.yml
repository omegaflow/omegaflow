name: gaia-alerts-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gaia_alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the gsaweb.ast.cam.ac.uk release exists on the CDN
        run: |
          if ! gh release view gsaweb.ast.cam.ac.uk --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create gsaweb.ast.cam.ac.uk --repo omegaflow/sources \
              --title "gsaweb.ast.cam.ac.uk" \
              --notes "Gaia Alerts index compiled to the SKD1 sky-direction bin. Magic SKD1 + u32 count; per direction: u32 name_len + name, f64 ra_deg, f64 dec_deg, sigma flag (u8, 0 absent else f64 arcsec), distance flag (u8, 0 absent else f64 m), redshift flag (u8, 0 absent else f64), u32 bands_len, then per band u32 band_name_len + band name (0 = unbanded), u32 samples_len, then per sample f64 tdb + f64 mag. Each alert carries one G-band series with its alertMag anchored to the observation epoch (UTC -> TDB)."
          fi
      - name: Fetch the Gaia Alerts index
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 600 -o kernels/alertsindex.html \
            https://gsaweb.ast.cam.ac.uk/alerts/alertsindex \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "gaia-alerts-cdn: alertsindex returned void" \
                 "curl on gsaweb.ast.cam.ac.uk did not reach /alerts/alertsindex. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the Gaia Alerts directions and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin gaia_alerts_compiler -- \
            --input kernels/alertsindex.html \
            --out gaia_alerts.bin \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "gaia-alerts-cdn: gaia_alerts.bin returned void" \
                 "gaia_alerts compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
