name: gaia-xp-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gaia-xp:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch Gaia DR3 XP spectra (sync, parallax>50) and compile to xp_spectra.bin
        run: |
          mkdir -p kernels
          # bounded sync harvest: the 2237 nearest stars (parallax > 50 mas, d < 20 pc) prove the
          # chain end-to-end; the full-survey harvest is the async follow-up (GAVO /tap/async).
          QUERY="SELECT s.source_id, w.ra, w.dec, w.parallax, s.flux FROM gdr3spec.spectra AS s JOIN gaia.dr3lite AS w ON s.source_id = w.source_id WHERE w.parallax > 50"
          curl -sSfL --retry 3 --max-time 3600 \
            --data-urlencode "REQUEST=doQuery" \
            --data-urlencode "LANG=ADQL" \
            --data-urlencode "FORMAT=csv" \
            --data-urlencode "QUERY=$QUERY" \
            https://dc.g-vo.org/tap/sync -o kernels/xp.csv
          # epoch_tdb 504921600 = J2016.0 (Gaia DR3 reference epoch), seconds since J2000
          cargo run -p omegaflow-harvest --release --bin gaia_xp_compiler -- \
            --input kernels/xp.csv --epoch-tdb 504921600 --out xp_spectra.bin --ci-mode
