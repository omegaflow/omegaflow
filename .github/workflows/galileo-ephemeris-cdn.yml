name: galileo-ephemeris-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  galileo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ephemeris_galileo.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_galileo.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_galileo.bin missing — compiling and manifesting"
          fi
      - name: Ensure the ssd.jpl.nasa.gov-ephemeris release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources \
              --title "ssd.jpl.nasa.gov-ephemeris" \
              --notes "flattened JPL ephemeris bins compiled for omegaflow (CDN tag = <netloc>-<family>)"
          fi
      - name: Download the Galileo cruise SPK and the de440s SSB carrier
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 5400 -o kernels/s970311a.bsp \
            https://naif.jpl.nasa.gov/pub/naif/GLL/kernels/spk/s970311a.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "galileo-ephemeris-cdn: s970311a.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the Galileo cruise SPK. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          curl -sSfL --retry 3 --max-time 5400 -o kernels/de440s.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "galileo-ephemeris-cdn: de440s.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the de440s SSB carrier. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the Galileo ephemeris and upload to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin spacecraft_ephemeris_compiler -- \
            --kernel kernels/s970311a.bsp \
            --kernel kernels/de440s.bsp \
            --naif -77 \
            --name galileo \
            --out ephemeris_galileo.bin \
            --ci-mode
