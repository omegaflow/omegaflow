name: galileo-odr-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  galileo-odr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "galileo_odr.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset galileo_odr.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset galileo_odr.bin missing — compiling and manifesting"
          fi
      - name: Ensure the pds-ppi.igpp.ucla.edu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
              --title "pds-ppi.igpp.ucla.edu" \
              --notes "Galileo GO-J/GO-JS ODR open-loop files packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile and manifest the Galileo ODR open-loop files to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin galileo_odr_compiler -- --ci-mode
