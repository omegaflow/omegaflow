# harvest: format=gbm_tgf asset=present arm=gbm_tgf_compiler pattern=^gbm_tgf_catalog_offline\.csv$ idempotent=true timeout=240 tag=fermi.gsfc.nasa.gov

name: gbm-tgf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-compile and re-manifest even when the asset is present
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gbm-tgf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view fermi.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^gbm_tgf_catalog_offline.csv"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset gbm_tgf_catalog_offline.csv already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset gbm_tgf_catalog_offline.csv missing — compiling and manifesting"
          fi
      - name: Compile and manifest the Fermi GBM TGF catalog (ISO epoch reader) to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin gbm_tgf_compiler -- --ci-mode
