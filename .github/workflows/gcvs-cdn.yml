name: gcvs-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gcvs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile GCVS variable-star catalog and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/gcvs/gcvs_cat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag:magMax;period:Period' \
            --skip-null mag \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out gcvs_cat.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: gcvs_cat returned void" \
                 "gcvs_cat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
