name: gebco-bathymetry-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gebco-bathymetry:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view opentopodata.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "gebco_bathymetry.gbco"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset gebco_bathymetry.gbco already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset gebco_bathymetry.gbco missing — compiling and manifesting"
          fi
      - name: Compile GEBCO2020 depth witnesses and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin gebco_bathymetry_compiler -- \
            --locations "72.49,-156.6;51.2,10.4" --out gebco_bathymetry.gbco --ci-mode
