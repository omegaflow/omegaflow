name: gedi-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      day:
        description: GEDI product day (YYYY.MM.DD; blank = 2 days ago UTC)
        required: false
        type: string
        default: ""
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gedi:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the data.lpdaac.earthdatacloud.nasa.gov release exists on the CDN
        run: |
          if ! gh release view data.lpdaac.earthdatacloud.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create data.lpdaac.earthdatacloud.nasa.gov --repo omegaflow/sources \
              --title "data.lpdaac.earthdatacloud.nasa.gov" \
              --notes "GEDI L2A (GEDI02_A.002) lowest-mode footprints compiled to a geo oscillator record (medium em). Header 8 B: magic GED1 (4), count (u32 LE). Record stride 64 B = 8 x f64 LE: delta_time (s), lat_lowestmode (deg), lon_lowestmode (deg), elev_lowestmode (m), rh98 (m), beam_index, quality_flag, anchor_tdb (TDB seconds since J2000)."
          fi
      - name: Compile the GEDI L2A day and upload to CDN
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then day=$(date -u -d '2 days ago' +%Y.%m.%d); fi
          cargo run -p omegaflow-harvest --release --bin gedi_l2a_compiler -- \
            --day "$day" --limit 2 --beams 8 \
            --out data/data.lpdaac.earthdatacloud.nasa.gov/gedi_l2a.bin --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "gedi-cdn: gedi_l2a.bin returned void" \
                 "gedi_l2a_compiler returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
