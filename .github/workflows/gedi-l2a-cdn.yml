name: gedi-l2a-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'granule civil day (YYYY.MM.DD); empty = UTC yesterday'
        required: false
        type: string
        default: ''
      version:
        description: 'GEDI L2A version'
        required: false
        type: string
        default: '002'
      limit:
        description: 'granules to harvest (1..8)'
        required: false
        type: string
        default: '2'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gedi-l2a:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the GEDI L2A elevation series and upload to CDN
        run: |
          set -euo pipefail
          DAY="${{ inputs.day }}"; [ -n "$DAY" ] || DAY="$(date -u -d 'yesterday' +%Y.%m.%d)"
          LIMIT="${{ inputs.limit }}"; [ -n "$LIMIT" ] || LIMIT="2"
          cargo run -p omegaflow-harvest --release --bin gedi_l2a_compiler -- \
            --cmr --day "$DAY" --version "${{ inputs.version }}" --limit "$LIMIT" \
            --out data/data.lpdaac.earthdatacloud.nasa.gov/gedi_l2a.bin \
            --ci-mode
