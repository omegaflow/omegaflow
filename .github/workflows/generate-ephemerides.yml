name: Generate Ephemerides

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ephemerides:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Delete old ephemeris assets from CDN
        run: |
          echo "Cleaning ssd.jpl.nasa.gov release..."
          gh release view ssd.jpl.nasa.gov --repo omegaflow/sources --json assets -q '.assets[].name' 2>/dev/null | \
            while read name; do
              echo "  delete $name"
              gh release delete-asset ssd.jpl.nasa.gov "$name" --repo omegaflow/sources -y 2>/dev/null || \
                echo "  (delete skipped: $name)"
            done || echo "  (no release or no assets)"

      - name: Download SPICE kernels
        run: |
          mkdir -p kernels
          declare -A KERNEL_URLS=(
            ["de440.bsp"]="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440.bsp"
            ["jup365.bsp"]="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/jup365.bsp"
            ["sat441.bsp"]="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/sat441.bsp"
            ["mar099s.bsp"]="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/mar099s.bsp"
            ["nep097.bsp"]="https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/nep097.bsp"
          )
          for fn in "${!KERNEL_URLS[@]}"; do
            url="${KERNEL_URLS[$fn]}"
            if [ -f "kernels/$fn" ] && [ "$(stat -c%s "kernels/$fn" 2>/dev/null || echo 0)" -gt 100000 ]; then
              echo "SKIP $fn (cached)"
            else
              echo "FETCH $fn from NAIF..."
              curl -sS -L --max-time 600 --retry 3 -o "kernels/$fn" "$url" || echo "::warning::kernel $fn download failed"
            fi
          done
          ls -lh kernels/

      - name: Compile ephemerides from SPK
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            kernels/de440.bsp \
            kernels/jup365.bsp \
            kernels/sat441.bsp \
            kernels/mar099s.bsp \
            kernels/nep097.bsp

      - name: Upload to CDN release
        run: |
          for f in ephemeris_*.bin; do
            echo "upload $f to ssd.jpl.nasa.gov..."
            gh release upload ssd.jpl.nasa.gov "$f" \
              --repo omegaflow/sources --clobber || \
              echo "::warning::upload failed for $f"
          done
