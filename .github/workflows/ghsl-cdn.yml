name: ghsl-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      stride:
        description: Sampling step over the 3 arc-second raster (300 -> 0.25 deg global grid)
        type: string
        default: '300'
  schedule:
    - cron: '47 6 3 1 *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ghsl:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile and upload the GHSL built-surface world grid
        run: |
          set -euo pipefail
          cargo run -p omegaflow-harvest --release --bin ghsl_compiler -- \
            --tiles --stride "${{ inputs.stride || '300' }}" --ci-mode
