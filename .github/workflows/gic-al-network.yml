name: gic-al-network

# The two compute modules on the harvested INTERMAGNET xyz series:
# al_network_proxy (the AL lower envelope over a station network) ->
# gic_onset_detector (bay onsets against the McPherron list, with the
# surrogate null). River builds the missing CI seam here (2026-10-14).
# The station network is the declared family partition
# (docs/zustand/gic-station-families.tsv), not a hand-typed list.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      family:
        description: which declared family forms the AL network
        type: choice
        options:
          - auroral
          - subauroral
          - midlat
          - all
        default: auroral
      surrogates:
        description: surrogate count for the onset null (0 = no null)
        required: false
        default: "200"
      baseline_block:
        description: block-median baseline length (samples at 1 min)
        required: false
        default: "60"

permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build the family station list from the partition artifact
        run: |
          set -euo pipefail
          fam="${{ inputs.family }}"
          grep -v '^#' docs/zustand/gic-station-families.tsv > /tmp/partition.tsv
          if [ "$fam" = "all" ]; then
            cut -f1 /tmp/partition.tsv > family.txt
          else
            awk -F'\t' -v f="$fam" '$2==f { print $1 }' /tmp/partition.tsv > family.txt
          fi
          echo "family $fam → $(wc -l < family.txt) stations"
      - name: Fetch the station xyz bins from the CDN
        run: |
          set -euo pipefail
          mkdir -p /tmp/xyz
          base=https://github.com/omegaflow/sources/releases/download/imag-data.bgs.ac.uk
          while read -r c; do
            [ -z "$c" ] && continue
            curl -fsSL -o "/tmp/xyz/${c}_xyz_1m.bin" "$base/${c}_xyz_1m.bin"
          done < family.txt
          ls -l /tmp/xyz
      - name: AL-network lower envelope
        run: |
          set -euo pipefail
          cargo run --release -p omegaflow-measure --bin al_network_proxy -- \
            --family family.txt --dir /tmp/xyz --decl auto \
            --baseline-block ${{ inputs.baseline_block }} --min-stations 2 \
            --out /tmp/al_envelope.bin 2>&1 | tee /tmp/al_network.txt
      - name: Fetch the McPherron onset list (Zenodo, CC BY 4.0)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/CorrOnsFiles.zip https://zenodo.org/api/records/22711679/files/CorrOnsFiles.zip/content
          unzip -q /tmp/CorrOnsFiles.zip -d /tmp/mcpherron
      - name: Bay-onset detector on the AL network, with the surrogate null
        run: |
          set -euo pipefail
          cargo run --release -p omegaflow-measure --bin gic_onset_detector -- \
            --series /tmp/al_envelope.bin \
            --station al-network \
            --mcpherron /tmp/mcpherron/CorrOnsFiles/ftims.txt \
            --null ${{ inputs.surrogates }} 2>&1 | tee /tmp/detect.txt
      - name: Fetch the ABK single-station series (the 1-station arm)
        run: |
          set -euo pipefail
          base=https://github.com/omegaflow/sources/releases/download/imag-data.bgs.ac.uk
          curl -fsSL -o /tmp/abk_dbdt_1h.bin "$base/abk_dbdt_1h.bin"
      - name: Threshold sweep with the surrogate null — 1 station and the family envelope
        run: |
          set -euo pipefail
          cargo run --release -p omegaflow-measure --bin gic_onset_detector -- \
            --series /tmp/abk_dbdt_1h.bin --station abk \
            --mcpherron /tmp/mcpherron/CorrOnsFiles/ftims.txt \
            --null ${{ inputs.surrogates }} --sweep-k 1,1.5,2,3,4,6,8,12 2>&1 | tee /tmp/sweep_abk.txt
          cargo run --release -p omegaflow-measure --bin gic_onset_detector -- \
            --series /tmp/al_envelope.bin --station al-network \
            --mcpherron /tmp/mcpherron/CorrOnsFiles/ftims.txt \
            --null ${{ inputs.surrogates }} --sweep-k 1,1.5,2,3,4,6,8,12 2>&1 | tee /tmp/sweep_network.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gic-al-network
          path: |
            /tmp/al_network.txt
            /tmp/detect.txt
            /tmp/al_envelope.bin
            /tmp/sweep_abk.txt
            /tmp/sweep_network.txt
            family.txt
