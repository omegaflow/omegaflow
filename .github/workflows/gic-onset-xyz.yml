name: gic-onset-xyz

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      station:
        description: station code (lowercase) whose xyz bin builds the series
        required: true
        default: "abk"
      quantity:
        description: per-station quantity (dh the signed H disturbance, dbdt the per-minute |dB/dt| magnitude)
        type: choice
        options:
          - dh
          - dbdt
        default: dbdt
      window:
        description: fixed comparison window as start,end (ISO YYYY-MM-DD); held equal to the station sweep
        required: false
        default: "2000-01-01,2024-12-31"
      target_yield:
        description: onsets per day for the equal-yield threshold
        required: false
        default: "2"
      surrogates:
        description: surrogate count for the onset null
        required: false
        default: "200"

permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the McPherron onset list (Zenodo, CC BY 4.0)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/CorrOnsFiles.zip https://zenodo.org/api/records/22711679/files/CorrOnsFiles.zip/content
          unzip -q /tmp/CorrOnsFiles.zip -d /tmp/mcpherron
      - name: Fetch the station xyz bin
        run: |
          set -euo pipefail
          st="${{ inputs.station }}"
          mkdir -p /tmp/xyz
          curl -fsSL -o "/tmp/xyz/${st}_xyz_1m.bin" \
            "https://github.com/omegaflow/sources/releases/download/imag-data.bgs.ac.uk/${st}_xyz_1m.bin"
          echo "$st" > /tmp/fam.txt
      - name: Build the dense single-station series and run the detector
        run: |
          set -euo pipefail
          win_args=""
          if [ -n "${{ inputs.window }}" ]; then
            wstart="$(echo "${{ inputs.window }}" | cut -d, -f1)"
            wend="$(echo "${{ inputs.window }}" | cut -d, -f2)"
            win_args="--window-start $wstart --window-end $wend"
          fi
          cargo run --release -p omegaflow-measure --bin al_network_proxy -- \
            --family /tmp/fam.txt --dir /tmp/xyz --decl auto \
            --baseline-block 60 --min-stations 1 \
            --fusion min --quantity ${{ inputs.quantity }} \
            --out /tmp/station.bin 2>&1 | tee /tmp/onset.txt
          cargo run --release -p omegaflow-measure --bin gic_onset_detector -- \
            --series /tmp/station.bin --station "${{ inputs.station }}_dense" \
            --mcpherron /tmp/mcpherron/CorrOnsFiles/ftims.txt \
            --null ${{ inputs.surrogates }} --target-yield "${{ inputs.target_yield }}" $win_args \
            2>&1 | tee -a /tmp/onset.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gic-onset-xyz
          path: /tmp/onset.txt
