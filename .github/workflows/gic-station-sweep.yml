name: gic-station-sweep

# The sharpness surface (operator word 2026-10-15): how does the onset detector's
# precision/recall move with (a) the number of stations in the AL network and
# (b) the matching tolerance? The stations of a declared family are ordered by
# |cgm_lat| (from phi/sources.φ) and grown cumulatively; at every count the
# lower-envelope + detector runs with the surrogate null. The detector prints the
# compare rows for 5/15/30 min, so one run per count yields the full tolerance row.
# The 420 MB xyz bins are fetched once, the envelopes are built on the same bins.
# River built the seam (river-214); the bins are heavy, so the run belongs in CI.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      family:
        description: which declared family to order and grow
        type: choice
        options:
          - auroral
          - subauroral
          - midlat
          - all
        default: auroral
      counts:
        description: comma list of cumulative station counts
        required: false
        default: "1,2,3,4,6,8,12,16,24,31"
      surrogates:
        description: surrogate count for the onset null
        required: false
        default: "200"
      baseline_block:
        description: block-median baseline length (samples at 1 min)
        required: false
        default: "60"

permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  stations:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Order the family by |cgm_lat| and fetch its xyz bins once
        run: |
          set -euo pipefail
          fam="${{ inputs.family }}"
          grep -v '^#' docs/zustand/gic-station-families.tsv > /tmp/part.tsv
          if [ "$fam" = "all" ]; then
            cut -f1 /tmp/part.tsv > /tmp/fam.txt
          else
            awk -F'\t' -v f="$fam" '$2==f { print $1 }' /tmp/part.tsv > /tmp/fam.txt
          fi
          awk '/^station /{s=tolower($2)} /^cgm_lat /{if (s != "") { print s "\t" $2; s="" }}' \
            phi/sources.φ > /tmp/lat.tsv
          awk 'NR==FNR { n[$1]=$2; next } { lat=n[$1]; if (lat=="") lat=-999; print $1 "\t" lat }' \
            /tmp/lat.tsv /tmp/fam.txt | sort -t$'\t' -k2,2gr > /tmp/order.tsv
          cut -f1 /tmp/order.tsv > /tmp/order.txt
          echo "family $fam ordered by |cgm_lat| (station	lat):"
          cat /tmp/order.tsv
          mkdir -p /tmp/xyz
          base=https://github.com/omegaflow/sources/releases/download/imag-data.bgs.ac.uk
          while read -r c; do
            [ -z "$c" ] && continue
            curl -fsSL -o "/tmp/xyz/${c}_xyz_1m.bin" "$base/${c}_xyz_1m.bin"
          done < /tmp/order.txt
      - name: Fetch the McPherron onset list (Zenodo, CC BY 4.0)
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/CorrOnsFiles.zip https://zenodo.org/api/records/22711679/files/CorrOnsFiles.zip/content
          unzip -q /tmp/CorrOnsFiles.zip -d /tmp/mcpherron
      - name: Cumulative envelope + detector per station count
        run: |
          set -euo pipefail
          : > /tmp/sweep.txt
          for n in $(echo "${{ inputs.counts }}" | tr ',' ' '); do
            head -n "$n" /tmp/order.txt > /tmp/prefix.txt
            ms=1
            [ "$n" -ge 2 ] && ms=2
            echo "=== stations $n (min_stations $ms) ===" >> /tmp/sweep.txt
            cargo run --release -p omegaflow-measure --bin al_network_proxy -- \
              --family /tmp/prefix.txt --dir /tmp/xyz --decl auto \
              --baseline-block ${{ inputs.baseline_block }} --min-stations "$ms" \
              --out /tmp/env.bin >> /tmp/sweep.txt 2>&1
            cargo run --release -p omegaflow-measure --bin gic_onset_detector -- \
              --series /tmp/env.bin --station "n$n" \
              --mcpherron /tmp/mcpherron/CorrOnsFiles/ftims.txt \
              --null ${{ inputs.surrogates }} >> /tmp/sweep.txt 2>&1
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gic-station-sweep
          path: /tmp/sweep.txt
