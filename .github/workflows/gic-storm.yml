name: gic-storm

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  storm:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - point: abk-2024
            args: --station ABK --hour-start 2024-01-01 --hour-end 2025-01-01 --kp-threshold 5 --n-surreps 100
          - point: abk-2025
            args: --station ABK --hour-start 2025-01-01 --hour-end 2026-01-01 --kp-threshold 5 --n-surreps 100
          - point: sod-2024
            args: --station SOD --hour-start 2024-01-01 --hour-end 2025-01-01 --kp-threshold 5 --n-surreps 100
          - point: sod-2025
            args: --station SOD --hour-start 2025-01-01 --hour-end 2026-01-01 --kp-threshold 5 --n-surreps 100
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the storm-only Bz-to-dBdt sub-analysis
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT ${{ matrix.point }}"
            cargo run --release -p omegaflow-measure --bin gic_storm_probe -- ${{ matrix.args }} --out "gic-storm-${{ matrix.point }}.txt"
          } > "gic-storm-${{ matrix.point }}.stdout.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gic-storm-${{ matrix.point }}
          path: |
            gic-storm-${{ matrix.point }}.txt
            gic-storm-${{ matrix.point }}.stdout.txt
