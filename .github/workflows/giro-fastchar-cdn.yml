name: giro-fastchar-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      station:
        description: GIRO DIDBase URSI code (e.g. JR055)
        required: false
        type: string
        default: JR055
      char:
        description: fastchar characteristic (foF2, ...)
        required: false
        type: string
        default: foF2
      start:
        description: 'window start (YYYY-MM-DDTHH:MM:SSZ); empty = UTC yesterday 00:00Z'
        required: false
        type: string
        default: ''
      stop:
        description: 'window stop (YYYY-MM-DDTHH:MM:SSZ); empty = UTC today 00:00Z'
        required: false
        type: string
        default: ''
      force:
        description: Re-manifest even when the station bin is already manifested
        required: false
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  giro:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the station bin is already manifested
        id: idempotence
        run: |
          STATION="${{ inputs.station }}"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view lgdc.uml.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^giro_fastchar_${STATION}\.bin$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset giro_fastchar_${STATION}.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset giro_fastchar_${STATION}.bin missing — compiling and manifesting"
          fi
      - name: Compile the GIRO DIDBase fastchar series and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          set -euo pipefail
          STATION="${{ inputs.station }}"
          CHAR="${{ inputs.char }}"
          START="${{ inputs.start }}"; [ -n "$START" ] || START="$(date -u -d 'yesterday' +%FT00:00:00Z)"
          STOP="${{ inputs.stop }}"; [ -n "$STOP" ] || STOP="$(date -u +%FT00:00:00Z)"
          mkdir -p data/lgdc.uml.edu
          cargo run --release -p omegaflow-harvest --bin giro_fastchar_compiler -- \
            --station "$STATION" --char "$CHAR" --start "$START" --stop "$STOP" \
            --out "data/lgdc.uml.edu/giro_fastchar_${STATION}.bin" \
            --ci-mode
