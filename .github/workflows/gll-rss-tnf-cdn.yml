name: gll-rss-tnf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gll-rss-tnf:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view pds-rings.seti.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "gll_rss_tnf.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset gll_rss_tnf.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset gll_rss_tnf.bin missing — compiling and manifesting"
          fi
      - name: Ensure the pds-rings.seti.org release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pds-rings.seti.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pds-rings.seti.org --repo omegaflow/sources \
              --title "pds-rings.seti.org" \
              --notes "Galileo gll.rss PDS4 TRK-2-34 TNF files packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile and manifest the Galileo TRK-2-34 TNF files to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin gll_rss_tnf_compiler -- --ci-mode
      - name: Verify the registered pds-rings.seti.org gll_rss_tnf assets are manifested
        run: |
          set -euo pipefail
          expected=$(bash .github/workflows/scripts/register_release_set.sh pds-rings.seti.org gll_rss_tnf)
          if [ -z "$expected" ]; then
            echo "no gll_rss_tnf asset registered — the register is the source of truth (pending, not zero)"
            exit 1
          fi
          present=$(gh release view pds-rings.seti.org --repo omegaflow/sources \
            --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
          if [ -n "$missing" ]; then
            echo "registered but not manifested: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "$(printf '%s\n' "$expected" | wc -l) registered pds-rings.seti.org gll_rss_tnf assets all present"
