name: glm-l1b-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  glm-l1b:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ghrc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "glm_l1b.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset glm_l1b.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset glm_l1b.bin missing — compiling and manifesting"
          fi
      - name: Compile the GLM-L1b Event granules and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin glm_l1b_compiler -- \
            --granule https://data.ghrc.earthdata.nasa.gov/ghrcw-protected/glml1bflash__1/OR_I_GLM-L1b-Event_G16_s20210750000000_e20210750000205_c20210750000225.nc \
            --out glm_l1b.bin --lsk kernels/naif0012.tls --ci-mode
