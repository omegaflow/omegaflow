name: glm-l2-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  glm-l2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view noaa-goes18 --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "glm_l2.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset glm_l2.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset glm_l2.bin missing — compiling and manifesting"
          fi
      - name: Compiler tests
        run: cargo test -p omegaflow-harvest --release --bin glm_l2_compiler
      - name: Compile one GLM-L2-LCFA hour and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          mapfile -t keys < <(curl -sSfL \
            "https://noaa-goes18.s3.amazonaws.com/?list-type=2&prefix=GLM-L2-LCFA/2026/001/00/&max-keys=1000" \
            | grep -oP '(?<=<Key>)[^<]+')
          args=()
          for k in "${keys[@]}"; do
            args+=(--granule "https://noaa-goes18.s3.amazonaws.com/$k")
          done
          cargo run -p omegaflow-harvest --release --bin glm_l2_compiler -- \
            "${args[@]}" --out glm_l2.bin --lsk kernels/naif0012.tls --ci-mode
