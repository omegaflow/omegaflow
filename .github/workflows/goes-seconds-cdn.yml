name: goes-seconds-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  goes-seconds:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the three year-tars already exist on the CDN
        id: idempotence
        run: |
          assets=$(gh release view ncei.noaa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null)
          if echo "$assets" | grep -qx "goes15_xrs_2s_2013.tar" && \
             echo "$assets" | grep -qx "goes15_xrs_2s_2014.tar" && \
             echo "$assets" | grep -qx "goes15_xrs_2s_2015.tar"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "goes 2-s corpus present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "goes 2-s corpus missing — harvesting and manifesting"
          fi
      - name: Harvest the GOES-15 2-s XRS corpus (origin verbatim) and manifest it
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin goes_seconds_manifest -- \
            --years 2013,2014,2015 --out goes-seconds --ci-mode
