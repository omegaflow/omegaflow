name: gong-series-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gong-series:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GONG frequency series 1995-2026 once and upload to CDN
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern gong_series.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin gong_series_compiler -- \
              --out gong_series.bin --ci-mode
