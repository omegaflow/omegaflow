name: h0-ladder-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  h0-ladder:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Weigh the H0 ladder and manifest the static inputs to the CDN
        run: cargo run -p omegaflow-measure --release --bin h0_ladder_weigh -- --ci-mode
