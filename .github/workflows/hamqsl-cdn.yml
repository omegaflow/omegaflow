name: hamqsl-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harvest/src/bin/hamqsl_compiler.rs'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  hamqsl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view www.hamqsl.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "hamqsl_solar.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset hamqsl_solar.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset hamqsl_solar.bin missing — compiling and manifesting"
          fi
      - name: Ensure the www.hamqsl.com release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view www.hamqsl.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create www.hamqsl.com --repo omegaflow/sources \
              --title "www.hamqsl.com" \
              --notes "HAMQSL solar-terrestrial indices compiled to a binary asset (CDN tag = netloc)"
          fi
      - name: Compile and manifest the HAMQSL solar series to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin hamqsl_compiler -- \
            --out hamqsl_solar.bin \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "hamqsl-cdn: hamqsl_solar.bin returned void" \
                 "hamqsl compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
