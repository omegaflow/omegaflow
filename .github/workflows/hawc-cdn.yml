name: hawc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  hawc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the data.hawc-observatory.org release exists on the CDN
        run: |
          if ! gh release view data.hawc-observatory.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create data.hawc-observatory.org --repo omegaflow/sources \
              --title "data.hawc-observatory.org" \
              --notes "HAWC gamma-ray source catalogs compiled to SKY1 skymaps (kind gamma). One record per source: RA/Dec (ICRS deg), value = fiducial 7-TeV flux (smallest-radius, TeV-1 cm-2 s-1)."
          fi
      - name: Fetch the HAWC 2HWC and 3HWC source catalogs
        run: |
          mkdir -p kernels
          curl -ksSfL --retry 3 --max-time 600 -o kernels/2HWC.yaml \
            https://data.hawc-observatory.org/datasets/2hwc-survey/2HWC.yaml \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "hawc-cdn: 2HWC.yaml returned void" \
                 "curl on data.hawc-observatory.org did not reach 2HWC.yaml. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          curl -ksSfL --retry 3 --max-time 600 -o kernels/3HWC.yaml \
            https://data.hawc-observatory.org/datasets/3hwc-survey/3HWC.yaml \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "hawc-cdn: 3HWC.yaml returned void" \
                 "curl on data.hawc-observatory.org did not reach 3HWC.yaml. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile the HAWC source catalogs and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin hawc_compiler -- \
            --input kernels/2HWC.yaml --out hawc_2hwc.sky1 --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "hawc-cdn: hawc_2hwc.sky1 returned void" \
                 "hawc compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin hawc_compiler -- \
            --input kernels/3HWC.yaml --out hawc_3hwc.sky1 --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "hawc-cdn: hawc_3hwc.sky1 returned void" \
                 "hawc compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
