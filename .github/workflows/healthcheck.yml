name: Healthcheck
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'
  push:
    paths:
      - 'src/**'
      - 'phi/**'
      - 'Cargo.toml'
permissions:
  contents: write
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
jobs:
  cd:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: /tmp/archivar_cache
        key: archivar-cache-${{ github.run_id }}
        restore-keys: |
          archivar-cache-
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo run -- --verify phi
    - uses: actions/cache@v4
      if: always()
      with:
        path: /tmp/archivar_cache
        key: archivar-cache-${{ github.run_id }}
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: CDN mirror returned void" \
          --body "CDN mirror job failed. Last commit: ${{ github.sha }}" \
          --label health

  sources:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/cache@v4
      with:
        path: /tmp/archivar_cache
        key: archivar-cache-${{ github.run_id }}
        restore-keys: |
          archivar-cache-
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo run -- --verify phi/research
    - uses: actions/cache@v4
      if: always()
      with:
        path: /tmp/archivar_cache
        key: archivar-cache-${{ github.run_id }}
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: source health returned void" \
          --body "Source health job failed. Last commit: ${{ github.sha }}" \
          --label health

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo check
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: cargo check returned void" \
          --body "Build job failed on ${{ github.sha }}" \
          --label health

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo test
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: cargo test returned void" \
          --body "Test job failed on ${{ github.sha }}" \
          --label health

  pages-verify:
    runs-on: ubuntu-latest
    steps:
    - run: |
        STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://omegaflow.space/ 2>/dev/null || echo "void")
        if [ "$STATUS" != "200" ]; then
          echo "pages returned $STATUS"
          exit 1
        fi
        echo "pages ok: $STATUS"
    - if: failure()
      run: |
        gh issue create --repo omegaflow/omegaflow \
          --title "health: pages returned void" \
          --body "Pages health check failed. https://omegaflow.space/ may be down." \
          --label health

  probe-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo run --release -- --probe phi/research/probe_batches/batch_003.φ
    - uses: actions/upload-artifact@v4
      with:
        name: probe-output
        path: probe_output.φ

  probe-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: |
        mkdir -p probe-results
        for f in phi/research/probe_batches/*_probe.φ; do
          [ -f "$f" ] || continue
          echo "=== probing $(basename $f) ==="
          timeout 120 cargo run --release -- --probe "$f" 2>&1 | tail -3
          fields=$(grep -c '^#.*= ' probe_output.φ 2>/dev/null || echo 0)
          out="probe-results/$(basename $f .φ)_out.φ"
          mv probe_output.φ "$out" 2>/dev/null
          echo "  $fields fields"
        done
    - uses: actions/upload-artifact@v4
      with:
        name: probe-full-results
        path: probe-results/

  sources-package:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
    steps:
    - uses: actions/checkout@v4
    - run: |
        mkdir -p _out
        gh release download ssd.jpl.nasa.gov --repo omegaflow/sources --dir _out/assets/ 2>/dev/null || echo "no assets"
        cp phi/sources.φ _out/
        cp phi/sources_live.φ _out/ 2>/dev/null || true
        tar czf omegaflow_sources.tar.gz -C _out .
        ls -lh omegaflow_sources.tar.gz
    - uses: actions/upload-artifact@v4
      with:
        name: sources-package
        path: omegaflow_sources.tar.gz
