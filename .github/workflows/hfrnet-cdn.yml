name: hfrnet-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  hfrnet:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view coastwatch.pfeg.noaa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "hfrnet_rtv.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset hfrnet_rtv.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset hfrnet_rtv.bin missing — compiling and manifesting"
          fi
      - name: Ensure the coastwatch.pfeg.noaa.gov release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view coastwatch.pfeg.noaa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create coastwatch.pfeg.noaa.gov --repo omegaflow/sources \
              --title "coastwatch.pfeg.noaa.gov" \
              --notes "HFRNet US West Coast RTV surface current grids (ERDDAP griddap ucsdHfrW1_Lon0360) packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the HFRNet RTV grid and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin hfrnet_compiler -- --ci-mode
