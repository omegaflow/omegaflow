name: himawari-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  himawari:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the noaa-himawari9 release exists on the CDN
        run: |
          if ! gh release view noaa-himawari9.s3.amazonaws.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create noaa-himawari9.s3.amazonaws.com --repo omegaflow/sources \
              --title "noaa-himawari9.s3.amazonaws.com" \
              --notes "AHI L1b HSD segment compiled to radiance (W m-2 sr-1 um-1, f32) from the Block 5 gain/offset; error/outside-scan sentinel counts stay carried as their raw count marker, never a fabricated radiance. Record layout: magic AHI1, columns (u16 LE), lines (u16 LE), bits_per_pixel (u16 LE), band (u8), segment (u8), satellite (u8), resolution_m (u16 LE), obs_present (u8), obs_sec (f64 LE, unix seconds), calib_present (u8; 1 = payload is radiance, 0 = payload is raw counts), error_pixels (u16 LE), outside_scan_pixels (u16 LE), payload ([f32 LE; columns*lines] when calib_present=1, [u16 LE; columns*lines] when calib_present=0)."
          fi
      - name: Fetch one AHI L1b HSD segment
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 600 \
            -o kernels/HS_H09_20221104_1550_B01_FLDK_R10_S0310.DAT.bz2 \
            https://noaa-himawari9.s3.amazonaws.com/AHI-L1b-FLDK/2022/11/04/1550/HS_H09_20221104_1550_B01_FLDK_R10_S0310.DAT.bz2 \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "himawari-cdn: the AHI L1b segment returned void" \
                 "curl on noaa-himawari9 did not reach the HS_H09 segment. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the AHI radiance record and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin himawari_hsd_compiler -- \
            --in kernels/HS_H09_20221104_1550_B01_FLDK_R10_S0310.DAT.bz2 \
            --out himawari_ahi_counts.bin \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "himawari-cdn: himawari_ahi_counts.bin returned void" \
                 "himawari_hsd_compiler returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
