name: hinet-cdn
on:
  workflow_dispatch:
    inputs:
      start:
        description: 'waveform window start, YYYY-MM-DDTHH:MM (UTC)'
        required: true
        type: string
      span:
        description: 'window span in minutes'
        required: false
        default: '60'
        type: string
      station-count:
        description: 'number of stations to harvest (0 = full network)'
        required: false
        default: '200'
        type: string
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  HINET_PASS: ${{ secrets.HINET_PASS }}
  RUSTFLAGS: -D warnings
jobs:
  hinet:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the leap-second table
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Compile the Hi-net window and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin hinet_win32_compiler -- \
            --start "${{ inputs.start }}" --span "${{ inputs.span }}" \
            --station-count "${{ inputs.station-count }}" \
            --out-bin hinet.bin --lsk kernels/naif0012.tls --ci-mode
