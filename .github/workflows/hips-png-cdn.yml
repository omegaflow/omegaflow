name: hips-png-cdn
on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'
concurrency:
  group: hips-png-cdn
  cancel-in-progress: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  hips-png-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: hips-png-cdn-${{ matrix.order }}-${{ matrix.dir }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { order: 0, dir: 0 }
          - { order: 1, dir: 0 }
          - { order: 2, dir: 0 }
          - { order: 3, dir: 0 }
          - { order: 4, dir: 0 }
          - { order: 5, dir: 0 }
          - { order: 5, dir: 10000 }
          - { order: 6, dir: 0 }
          - { order: 6, dir: 10000 }
          - { order: 6, dir: 20000 }
          - { order: 6, dir: 30000 }
          - { order: 6, dir: 40000 }
          - { order: 7, dir: 0 }
          - { order: 7, dir: 10000 }
          - { order: 7, dir: 20000 }
          - { order: 7, dir: 30000 }
          - { order: 7, dir: 40000 }
          - { order: 7, dir: 50000 }
          - { order: 7, dir: 60000 }
          - { order: 7, dir: 70000 }
          - { order: 7, dir: 80000 }
          - { order: 7, dir: 90000 }
          - { order: 7, dir: 100000 }
          - { order: 7, dir: 110000 }
          - { order: 7, dir: 120000 }
          - { order: 7, dir: 130000 }
          - { order: 7, dir: 140000 }
          - { order: 7, dir: 150000 }
          - { order: 7, dir: 160000 }
          - { order: 7, dir: 170000 }
          - { order: 7, dir: 180000 }
          - { order: 7, dir: 190000 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest one HiPS Dir shard into its manifest (resume per line)
        run: |
          cargo build -p omegaflow-harvest --release --bin hips_png_compiler
          ./target/release/hips_png_compiler --tree \
            --properties https://alasky.cds.unistra.fr/Planets/CDS_P_Mars_Tianwen1-MoRIC/properties \
            --order ${{ matrix.order }} \
            --dir ${{ matrix.dir }} \
            --limit 10000 \
            --out data/alasky.cds.unistra.fr/hips_png_CDS_P_Mars_Tianwen1-MoRIC_Norder${{ matrix.order }}_Dir${{ matrix.dir }}.manifest \
            --ci-mode
  hips-png-reader-bin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: hips-png-reader-bin
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Read the registered HiPS arm and gate on the reader record
        id: gate
        run: |
          cargo run -q -p omegaflow-utils --bin harvest_reg -- --lookup hips_png > block.txt \
            || { echo "no measured hips_png block in phi/harvest.φ — register duty"; exit 1; }
          tag=$(sed -n 's/^tag //p' block.txt)
          pattern=$(sed -n 's/^pattern //p' block.txt)
          arm=$(sed -n 's/^arm //p' block.txt)
          args=$(sed -n 's/^args //p' block.txt)
          if [ -z "$tag" ] || [ -z "$pattern" ] || [ -z "$arm" ] || [ -z "$args" ]; then
            echo "hips_png block incomplete (tag/pattern/arm/args) — register duty"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "arm=$arm" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] \
             && gh release view "$tag" --repo omegaflow/sources \
                --json assets --jq '.assets[]?.name' 2>/dev/null | grep -Eq "$pattern"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "reader record matching $pattern present and no compiler dispatch — compile skipped"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "reader record missing or a compiler dispatch — compiling the registered arm"
          fi
      - name: Compile the reader record and manifest it to the CDN
        if: steps.gate.outputs.run == 'true'
        run: |
          read -r -a argv <<< "${{ steps.gate.outputs.args }}"
          cargo build --release -p omegaflow-harvest --bin "${{ steps.gate.outputs.arm }}"
          ./target/release/"${{ steps.gate.outputs.arm }}" "${argv[@]}" --ci-mode
