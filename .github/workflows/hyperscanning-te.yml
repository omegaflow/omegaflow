name: hyperscanning-te

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      null_model:
        description: null model — phase rotates each series alone; coherent-phase rotates a triad with one shared phase vector (the pair null for transfer beyond the linear cross-correlation)
        type: choice
        options:
          - phase
          - coherent-phase
        default: phase
      channel:
        description: EEG channel label (a named electrode, not the common average)
        type: string
        default: Fz
      percentile:
        description: family-wise threshold percentile (screen 95, confirmation 99)
        type: string
        default: "95"
      surrogates:
        description: phase-randomized surrogate count (screen 200, confirmation 1000)
        type: string
        default: "200"
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the family FN/FP gates (the family-max null calibration)
        run: cargo test --release -p omegaflow-measure --bin hyperscanning_group_te -- family_fn_gate family_fp_gate coherent_null_fp_gate self_null_discriminator fn_gate_sweep nominees_round_trip --nocapture
      - name: Fetch the ds007822 EEG recordings and build the manifest
        run: |
          set -euo pipefail
          H=$(curl -sS -X POST https://openneuro.org/crn/graphql \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg q '{ dataset(id:"ds007822"){ latestSnapshot { hexsha } } }' '{query:$q}')" \
            | jq -r '.data.dataset.latestSnapshot.hexsha')
          echo "snapshot $H"
          curl -sS -X POST https://openneuro.org/crn/graphql \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg q "{ dataset(id:\"ds007822\"){ latestSnapshot { files(tree: \"$H\", recursive: true) { filename urls } } } }" '{query:$q}')" \
            -o tree.json
          mkdir -p data
          : > manifest.txt
          jq -r '.data.dataset.latestSnapshot.files[]? | select(.filename | endswith("_eeg.set")) | [.filename, .urls[0]] | @tsv' tree.json > files.tsv
          count=0
          while IFS=$'\t' read -r fn url; do
            sub=$(printf '%s' "$fn" | cut -d/ -f1)
            base=$(basename "$fn")
            task=$(printf '%s' "$base" | sed -E 's/.*_task-([^_]+)_eeg\.set/\1/')
            triad=$(printf '%s' "$sub" | sed -E 's/^sub-G([0-9]+)S[0-9]+$/G\1/')
            mkdir -p "data/$(dirname "$fn")"
            curl -sSL --retry 2 -o "data/$fn" "$url"
            printf '%s %s %s %s\n' "$task" "$triad" "$sub" "data/$fn" >> manifest.txt
            count=$((count+1))
          done < files.tsv
          jq -r '.data.dataset.latestSnapshot.files[]? | select(.filename | endswith("_channels.tsv")) | [.filename, .urls[0]] | @tsv' tree.json > channels.tsv
          nch=0
          while IFS=$'\t' read -r fn url; do
            mkdir -p "data/$(dirname "$fn")"
            curl -sSL --retry 2 -o "data/$fn" "$url"
            nch=$((nch+1))
          done < channels.tsv
          echo "downloaded $count .set file(s) + $nch channels.tsv sidecar(s)"
          sort -o manifest.txt manifest.txt
          head -6 manifest.txt
      - name: Run the family-wise TE screen and write the per-cell nominees (Takens tau, dim 3, cap 4096)
        run: |
          set -o pipefail
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin hyperscanning_group_te -- \
              --manifest manifest.txt --channel "${{ inputs.channel }}" --max-points 4096 --surrogates "${{ inputs.surrogates }}" \
              --percentile "${{ inputs.percentile }}" \
              --null "${{ inputs.null_model }}" \
              --nominees-out nominees.tsv
          } | tee report.txt
      - name: Confirm the nominees against their own per-cell nulls (p99, 1000 surrogates, fresh seed)
        if: always()
        run: |
          set -o pipefail
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin hyperscanning_group_te -- \
              --manifest manifest.txt --channel "${{ inputs.channel }}" --max-points 4096 \
              --nominees nominees.tsv \
              --null "${{ inputs.null_model }}"
          } | tee confirmation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperscanning-te-report
          path: |
            report.txt
            nominees.tsv
            confirmation.txt

  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Confirm the stochastic pair and guard the deterministic Riss (p99/p1, 200 surrogates)
        run: cargo test --release -p omegaflow-measure --bin hyperscanning_group_te -- confirmation_stochastic_driver_pair_clears_its_own_null riss_guard_deterministic_pair_measures_below_its_own_null --nocapture
      - name: Frozen-tau delay sweep for the stochastic confirmation pair (print-only diagnostic)
        if: always()
        run: cargo test --release -p omegaflow-measure --bin hyperscanning_group_te -- frozen_tau_delay_sweep_stochastic_pair --ignored --nocapture
      - name: Positive control — rich aperiodic driver through the same recursion (print-only diagnostic)
        if: always()
        run: cargo test --release -p omegaflow-measure --bin hyperscanning_group_te -- positive_control_rich_aperiodic_driver_pair --ignored --nocapture
      - name: Phase-null blind-band probe for the stochastic confirmation pair (print-only diagnostic)
        if: always()
        run: cargo test --release -p omegaflow-measure --test phase_null_blind_band -- phase_null_blind_band_stochastic_pair --ignored --nocapture
