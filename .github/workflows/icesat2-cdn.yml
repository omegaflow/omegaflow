name: icesat2-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      day:
        description: ATL03 product day (YYYY.MM.DD; publication stopped 2026-05-31)
        required: false
        type: string
        default: "2026.05.31"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  icesat2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the data.nsidc.earthdatacloud.nasa.gov release exists on the CDN
        run: |
          if ! gh release view data.nsidc.earthdatacloud.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create data.nsidc.earthdatacloud.nasa.gov --repo omegaflow/sources \
              --title "data.nsidc.earthdatacloud.nasa.gov" \
              --notes "ICESat-2 ATL03 (ATLAS/ATL03) geolocated photon heights compiled to a geo oscillator record (medium em). Header 8 B: magic AT31 (4), count (u32 LE). Record stride 56 B = 7 x f64 LE: delta_time (s), lat_ph (deg), lon_ph (deg), h_ph (m), quality_ph, beam_index, anchor_tdb (TDB seconds since J2000)."
          fi
      - name: Compile the ATL03 day and upload to CDN
        run: |
          day="${{ inputs.day }}"
          if [ -z "$day" ]; then day="2026.05.31"; fi
          cargo run -p omegaflow-harvest --release --bin icesat2_atl03_compiler -- \
            --day "$day" --limit 2 --beams 6 \
            --out data/data.nsidc.earthdatacloud.nasa.gov/icesat2_atl03.bin --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "icesat2-cdn: icesat2_atl03.bin returned void" \
                 "icesat2_atl03_compiler returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
