name: ieeg-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "IEEG.org snapshot name (e.g. 09_14_limbic_seizure_374)"
        required: false
        default: "09_14_limbic_seizure_374"
      duration:
        description: "window duration in microseconds"
        required: false
        default: "10000000"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  IEEG_USER: ${{ secrets.IEEG_USER }}
  IEEG_PASS: ${{ secrets.IEEG_PASS }}
  RUSTFLAGS: -D warnings
jobs:
  ieeg:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the IEEG.org dataset window (signed REST API)
        run: |
          set -euo pipefail
          dataset="${{ inputs.dataset }}"
          duration="${{ inputs.duration }}"
          [ -z "$duration" ] && duration=10000000
          cargo run --release -p omegaflow-harvest --bin ieeg_compiler -- \
            --dataset "$dataset" \
            --duration "$duration" \
            --out "data/www.ieeg.org/${dataset}.bin" \
            --ci-mode
      - name: Upload to the CDN
        run: |
          set -euo pipefail
          dataset="${{ inputs.dataset }}"
          gh release view www.ieeg.org --repo omegaflow/sources >/dev/null 2>&1 \
            || gh release create www.ieeg.org --repo omegaflow/sources \
                 --title "www.ieeg.org" --notes "IEEG.org snapshot windows"
          gh release upload www.ieeg.org "data/www.ieeg.org/${dataset}.bin" \
            --clobber --repo omegaflow/sources
