name: iers-eop-c04-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  iers-eop-c04:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the IERS EOP 20 C04 LOD series and upload to CDN
        run: |
          set -euo pipefail
          cargo run -p omegaflow-harvest --release --bin iers_eop_c04_compiler -- \
            --out data/datacenter.iers.org/iers_eop_c04_lod.bin \
            --ci-mode
