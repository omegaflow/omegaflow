name: igets-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  igets:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: igets-harvest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view igetsftp.gfz.de --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "igets.bin"; then
            echo "asset igets.bin already present — manifest skipped"
            exit 0
          fi
          echo "asset igets.bin missing — compiling and manifesting"
      - name: Restore harvest cache (resume the .ggp download across runs)
        uses: actions/cache@v4
        with:
          path: data/igetsftp.gfz.de
          key: igets-ggp-v1
          save-always: true
      - name: Compile IGETS/GGP gravity series and upload to CDN
        env:
          IGETS_USER: ${{ secrets.IGETS_USER }}
          IGETS_PASS: ${{ secrets.IGETS_PASS }}
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin igets_compiler -- \
            --out-bin igets.bin --lsk kernels/naif0012.tls \
            --cache data/igetsftp.gfz.de --level 2 --bucket-min 60 --ci-mode
