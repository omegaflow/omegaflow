name: inpop-epm-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 2 * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  inpop-epm:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the ftp.imcce.fr release exists on the CDN
        run: |
          if ! gh release view ftp.imcce.fr --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ftp.imcce.fr --repo omegaflow/sources \
              --title "ftp.imcce.fr" \
              --notes "raw INPOP ephemeris bins compiled for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Ensure the ftp.iaaras.ru release exists on the CDN
        run: |
          if ! gh release view ftp.iaaras.ru --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ftp.iaaras.ru --repo omegaflow/sources \
              --title "ftp.iaaras.ru" \
              --notes "raw EPM ephemeris bins compiled for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Compile the INPOP19a bins (with body-fixed orientation) and upload
        run: |
          curl -sfL -o inpop19a_spice.tar.gz https://ftp.imcce.fr/pub/ephem/planets/inpop19a/inpop19a_TDB_m100_p100_spice.tar.gz \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "inpop-epm-cdn: the inpop19a spice tar returned void" \
                 "curl on ftp.imcce.fr did not reach the tar. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          cargo run -p omegaflow-harvest --release --bin inpop_compiler -- inpop19a_spice.tar.gz --ci-mode
      - name: Compile the EPM2021 bins (with body-fixed orientation) and upload
        run: |
          curl -sfL -o epm2021.bsp https://ftp.iaaras.ru/pub/epm/EPM2021/SPICE/epm2021.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "inpop-epm-cdn: the epm2021 bsp returned void" \
                 "curl on ftp.iaaras.ru did not reach the bsp. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          echo "epm2021.bsp sha256: $(sha256sum epm2021.bsp | cut -d' ' -f1)"
          echo "epm2021.bsp bytes: $(stat -c%s epm2021.bsp)"
          cargo run -p omegaflow-harvest --release --bin epm_compiler -- epm2021.bsp --ci-mode
      - name: Verify the registered ftp.imcce.fr inpop assets are manifested
        run: |
          set -euo pipefail
          expected=$(bash .github/workflows/scripts/register_release_set.sh ftp.imcce.fr ephemeris_inpop)
          if [ -z "$expected" ]; then
            echo "no ephemeris_inpop asset registered — the register is the source of truth (pending, not zero)"
            exit 1
          fi
          present=$(gh release view ftp.imcce.fr --repo omegaflow/sources \
            --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
          missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
          if [ -n "$missing" ]; then
            echo "registered but not manifested: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            exit 1
          fi
          echo "$(printf '%s\n' "$expected" | wc -l) registered ftp.imcce.fr inpop assets all present"
