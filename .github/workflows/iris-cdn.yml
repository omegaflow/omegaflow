name: iris-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'window start (YYYY-MM-DDTHH:MM); empty = UTC yesterday 00:00'
        required: false
        type: string
        default: ''
      stop:
        description: 'window stop (YYYY-MM-DDTHH:MM); empty = UTC today 00:00'
        required: false
        type: string
        default: ''
      force:
        description: Re-manifest even when iris.bin is already present
        required: false
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  iris:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if iris.bin is already manifested
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view vso.stanford.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q '^iris\.bin$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset iris.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset iris.bin missing — compiling and manifesting"
          fi
      - name: Resolve an IRIS level-2 FITS via the HCR API and manifest it
        if: steps.idempotence.outputs.present == 'false'
        run: |
          set -euo pipefail
          START="${{ inputs.start }}"; [ -n "$START" ] || START="$(date -u -d 'yesterday' +%Y-%m-%dT00:00)"
          STOP="${{ inputs.stop }}"; [ -n "$STOP" ] || STOP="$(date -u +%Y-%m-%dT00:00)"
          curl -fsSL "https://www.lmsal.com/hek/hcr?cmd=search-events-corr&outputformat=jsonMedium&instrument=IRIS&startTime=${START}&stopTime=${STOP}" -o /tmp/hcr.json
          URL=$(jq -r '[.Events[].groups[]?.comp_data_url] | map(select(. != null)) | .[0] // empty' /tmp/hcr.json)
          if [ -z "$URL" ]; then
            echo "no IRIS level-2 asset in ${START}..${STOP} — the bin stays unwritten (0 honored)"
            exit 1
          fi
          echo "comp_data_url: $URL"
          curl -fsSL "$URL" -o /tmp/iris.fits.gz
          gunzip -f /tmp/iris.fits.gz
          mkdir -p data/vso.stanford.edu
          cargo run --release -p omegaflow-harvest --bin iris_compiler -- \
            --input /tmp/iris.fits \
            --out data/vso.stanford.edu/iris.bin \
            --ci-mode
