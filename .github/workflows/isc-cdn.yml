name: isc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  isc:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the www.isc.ac.uk release exists on the CDN
        run: |
          if ! gh release view www.isc.ac.uk --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create www.isc.ac.uk --repo omegaflow/sources \
              --title "www.isc.ac.uk" \
              --notes "ISC event bulletin (QuakeML 1.2) compiled to a fixed-stride event record. Record stride: present (u8) + pad (7), time (f64 LE, unix s), lat (f64 LE, deg), lon (f64 LE, deg), depth (f64 LE, km), magnitude (f64 LE, pad 0.0 when absent), mag_type (8 ASCII bytes, NUL pad)."
          fi
      - name: Harvest the ISC event bulletin once and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin isc_bulletin_compiler -- \
            --start 2024-01-01 --end 2024-01-07 --minmag 6.0 \
            --out isc_bulletin.iscb \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "isc-cdn: isc_bulletin.iscb returned void" \
                 "isc bulletin compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
