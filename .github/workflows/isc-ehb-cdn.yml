name: isc-ehb-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  isc-ehb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view download.isc.ac.uk --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "isc_ehb.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset isc_ehb.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset isc_ehb.bin missing — compiling and manifesting"
          fi
      - name: Compile the ISC-EHB bulletin and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin isc_ehb_compiler -- \
            --out isc_ehb.bin --ci-mode
