# harvest: format=its_live_velocity asset=present arm=its_live_compiler pattern=^its_live_velocity\.bin$ idempotent=true timeout=240 tag=stac.itslive.cloud
#   schedule weekly: ITS_LIVE glacier velocity granules are derived from Sentinel-1/2 image
#   pairs and refresh as new pairs are processed — a weekly cadence tracks the product.

name: its_live-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  its-live:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view stac.itslive.cloud --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "its_live_velocity.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset its_live_velocity.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset its_live_velocity.bin missing — compiling and manifesting"
          fi
      - name: Manifest the ITS_LIVE glacier velocity granules to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin its_live_compiler -- \
            --body earth --out data/its_live_velocity.bin --ci-mode
