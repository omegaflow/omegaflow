name: jades-cdn

# Der JADES-DR4-Spektren-Compiler (`jades_spectra_compiler`) als CDN-Manifestator.
# Ohne diesen Workflow bleibt der `url`-Zeiger
# `…/jades.herts.ac.uk/jades_spectra.bin` unmanifestiert.
# Quelle ist das JADES-DR4-Combined-external-Produkt (FITS, `jades.herts.ac.uk`);
# der Release-Tag folgt der Quellen-Herkunft.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  jades:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Restore harvest workdir
        uses: actions/cache@v4
        with:
          path: phi/jades_harvest
          key: jades-harvest-v1
      - name: NAIF leap-second kernel laden
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Die JADES-DR4-Spektren kompilieren und auf das CDN manifestieren
        run: |
          cargo run --release -p omegaflow-harvest --bin jades_spectra_compiler -- \
            --out jades_spectra.bin \
            --lsk kernels/naif0012.tls \
            --workdir phi/jades_harvest \
            --budget 340 \
            --ci-mode
