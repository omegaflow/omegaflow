name: juice-arc-restore

concurrency:
  group: juice-arc-restore
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 1e6d21f2fed489c23b0f0b19db96604422dc8b8d
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the archived sources index of the 2026-10-02 crawl
        run: |
          rm -rf /tmp/sources-index
          gh run download 37029375744 -n sources-index -R omegaflow/omegaflow -D /tmp/sources-index
      - name: Re-flatten the JUICE ephemeris from the archived index and upload ephemeris_juice.bin
        run: |
          cargo run --release -p omegaflow-harvest --bin ephemeris_compiler -- \
            --fetch-from /tmp/sources-index/phi/sources_index.φ \
            --systems planets,jupiter,saturn,mars,uranus,neptune,pluto,juice \
            --dest kernels \
            --ci-mode \
            --index /tmp/sources-index/phi/sources_index.φ
