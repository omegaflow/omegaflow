name: jwst-cdn-watch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '37 5 2 * *'
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore harvest workdir
        uses: actions/cache@v4
        with:
          path: phi/jwst_harvest
          key: jwst-harvest-v1
      - name: Watch the harvest
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov/jwst_spectra.bin)
          if [ -f phi/jwst_harvest/ledger.tsv ]; then
            n=$(wc -l < phi/jwst_harvest/ledger.tsv)
          else
            n=-1
          fi
          echo "jwst_spectra.bin: $status | ledger obs: $n"
          if [ "$status" = "200" ]; then
            bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
              "front2: jwst_spectra.bin is on the CDN — tasks 3–5 unblocked" \
              "The JWST full harvest is complete: jwst_spectra.bin is on the CDN. Nadel V front II tasks 3–5 (model, scanner, sheet) are unblocked — handover-2026-08-23-jwst-front-2-modell-scanner-blatt.md." \
              health
          elif [ "$n" = "0" ]; then
            bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
              "front2: the JWST harvest carries void" \
              "The watchdog finds neither jwst_spectra.bin on the CDN nor a ledger entry — the harvest has completed no obs_id since the last kernel-flatten run. Check MAST_TOKEN/network/build. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              health
          fi
