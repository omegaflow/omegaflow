name: kcdc-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      request:
        description: DataShop request id (created by --submit; session-bound download)
        required: true
        type: string
        default: "1175"
      asset:
        description: output asset name on the CDN (netloc kcdc.iap.kit.edu)
        required: true
        type: string
        default: kcdc_kascade.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  KCDC_USER: ${{ secrets.KCDC_USER }}
  KCDC_PASS: ${{ secrets.KCDC_PASS }}
  RUSTFLAGS: -D warnings
jobs:
  kcdc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view kcdc.iap.kit.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
          fi
      - name: Login to the KCDC DataShop (session+CSRF, credentials from env)
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p tmp
          cargo run -p omegaflow-harvest --release --bin kcdc_compiler -- \
            --login --jar tmp/kcdc_cookies.txt
      - name: Download the session-bound request zip from the DataShop
        if: steps.idempotence.outputs.present == 'false'
        run: |
          for attempt in $(seq 1 30); do
            if curl -sSfL --retry 3 --max-time 300 \
              -b tmp/kcdc_cookies.txt -c tmp/kcdc_cookies.txt \
              "https://kcdc.iap.kit.edu/datashop/download/${{ inputs.request }}/request.zip/" \
              -o request.zip; then
              echo "request.zip: $(wc -c < request.zip) B"
              exit 0
            fi
            echo "request ${{ inputs.request }} not ready (attempt $attempt) — waiting 30s"
            sleep 30
          done
          echo "request ${{ inputs.request }} did not materialize"
          exit 1
      - name: Compile the ASCII tables and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin kcdc_compiler -- \
            --compile request.zip --out "${{ inputs.asset }}" \
            --lsk kernels/naif0012.tls --ci-mode
