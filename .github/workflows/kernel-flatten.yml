name: kernel-flatten

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Crawl kernel roots
        run: |
          cargo run -p omegaflow-harvest --release --bin ephemeris_compiler -- --index \
            --root https://ssd.jpl.nasa.gov/ftp/ \
            --root https://naif.jpl.nasa.gov/pub/ \
            --out phi/sources_index.φ \
            --jobs 4 \
            --delay-ms 50
      - name: Summarize kernel index
        run: |
          cargo run -p omegaflow-harvest --release --bin ephemeris_compiler -- \
            --summarize phi/sources_index.φ docs/reference/KERNEL_INDEX.md
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources-index
          path: |
            phi/sources_index.φ
            docs/reference/KERNEL_INDEX.md
          retention-days: 7
      - name: Commit index
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ docs/reference/KERNEL_INDEX.md
          git diff --staged --quiet || git commit -m "kernel index $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push

  bodies:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/download-artifact@v4
        with:
          name: sources-index
      - name: Flatten SPK bodies and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin ephemeris_compiler -- \
            --fetch-from phi/sources_index.φ \
            --systems planets,jupiter,saturn,mars,uranus,neptune,pluto \
            --dest kernels \
            --ci-mode \
            --omega-g phi/pipeline/katalog/solar_omega_g.φ \
            --index phi/sources_index.φ
      - name: Flatten asteroid longbow and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin ephemeris_compiler -- \
            --fetch-from phi/sources_index.φ \
            --systems asteroids \
            --small-bodies \
            --dest kernels \
            --ci-mode \
            --index phi/sources_index.φ
      - name: Split sb441-n373 longbow and upload TNO bins to CDN
        run: |
          df -h .
          curl -sSfL --retry 3 --max-time 5400 \
            https://ssd.jpl.nasa.gov/ftp/eph/small_bodies/asteroids_de441/sb441-n373.bsp \
            | cargo run -p omegaflow-utils --release --bin spk_split -- \
              --bodies 2136199,2136108,2136472 \
              --gm-catalog phi/pipeline/katalog/asteroid_gm_sb441.φ \
              --carrier kernels/de441.bsp \
              --dest kernels \
              --ci-mode
      - name: Compile Horizons bodies and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin horizons_compiler -- --ci-mode
      - name: Compile Horizons long-window probe arcs and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin horizons_compiler -- --long --ci-mode
      - name: Compile daily-raster probe arcs and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin horizons_compiler -- --daily --ci-mode
      - name: Compile flyby arcs and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin horizons_compiler -- --flyby --ci-mode
      - name: Compile DASTCOM asteroid catalog and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 7200 -o kernels/dast5_le.dat \
            https://ssd.jpl.nasa.gov/ftp/xfr/dast5_le.dat
          cargo run -p omegaflow-harvest --release --bin dastcom_compiler -- \
            --input kernels/dast5_le.dat \
            --out dastcom_asteroids.bin \
            --gm phi/pipeline/katalog/asteroid_gm_inpop25c.φ \
            --diameters phi/pipeline/katalog/asteroid_diameters_neowise.φ,phi/pipeline/katalog/asteroid_diameters_akari.φ \
            --ci-mode
      - name: Compile KBO elements and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin kbo_compiler -- \
            --out kbo_elements.json \
            --etno \
            --ci-mode
      - name: Commit body manifest
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ
          git diff --staged --quiet || git commit -m "body manifest $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push
      - name: Report bodies void
        if: failure()
        run: |
          bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
            "flatten: bodies returned void" \
            "Bodies job returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            health

  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Prepare kernels dir
        run: |
          mkdir -p kernels
          gh label create health --repo omegaflow/omegaflow 2>/dev/null || true
          gh label create anomaly-report --repo omegaflow/omegaflow 2>/dev/null || true
      - name: Compile sexagesimal catalogs and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 300 -o kernels/tabo1.csv \
            https://www.physics.mcgill.ca/~pulsar/magnetar/TabO1.csv
          curl -sSfL --retry 3 --max-time 300 -o kernels/tevcat2.json \
            https://tevcat2.tevcat.org/api/sources
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/495/691/bzcat4 \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z' \
            --out kernels/blazars_z.json \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: blazars_z returned void" \
                 "blazars_z compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/612/A1/snrcat \
            --columns 'name:Source;ra:@8;dec:@9;dist:Dist' \
            --out kernels/snr_dist.json \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: snr_dist returned void" \
                 "snr_dist compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table B/psr/psr \
            --columns 'name:Name;ra:RA2000;dec:DE2000;dist:Dist' \
            --out kernels/pulsar_dist.json \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: pulsar_dist returned void" \
                 "pulsar_dist compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin sexagesimal_compiler -- \
            --source magnetar --input kernels/tabo1.csv --out magnetar_flat.json --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: magnetar_flat returned void" \
                 "magnetar_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          cargo run -p omegaflow-harvest --release --bin sexagesimal_compiler -- \
            --source tevcat --input kernels/tevcat2.json \
            --join-z kernels/blazars_z.json --join-dist kernels/snr_dist.json \
            --join-dist2 kernels/pulsar_dist.json 0.0083 \
            --out tevcat_flat.json --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: tevcat_flat returned void" \
                 "tevcat_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile MPC cometels catalog and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 600 -o kernels/cometels.json.gz \
            https://www.minorplanetcenter.net/Extended_Files/cometels.json.gz
          cargo run -p omegaflow-harvest --release --bin cometels_compiler -- \
            --input kernels/cometels.json.gz \
            --out cometels_flat.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: cometels_flat returned void" \
                 "cometels_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile DASTCOM5 comet apparition catalog and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 7200 -o kernels/dcom5_le.dat \
            https://ssd.jpl.nasa.gov/ftp/xfr/dcom5_le.dat
          cargo run -p omegaflow-harvest --release --bin dcom5_compiler -- \
            --input kernels/dcom5_le.dat \
            --out dcom5_comets.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: dcom5_comets returned void" \
                 "dcom5_comets compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile exoplanet catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://exoplanetarchive.ipac.caltech.edu/TAP/sync \
            --table pscomppars \
            --cols-unquoted \
            --columns 'name:pl_name;ra:ra;dec:dec;dist:sy_dist;masse:pl_masse;rade:pl_rade;orbsmax:pl_orbsmax;orbeccen:pl_orbeccen;orbincl:pl_orbincl;orblper:pl_orblper;tranmid:pl_tranmid;orbper:pl_orbper;strad:st_rad' \
            --skip-null dist \
            --out exoplanets.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: exoplanets returned void" \
                 "exoplanets compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile TESS light curves and upload to CDN
        continue-on-error: true
        env:
          MAST_TOKEN: ${{ secrets.MAST_TOKEN }}
        run: |
          cargo run -p omegaflow-harvest --release --bin tess_compiler -- \
            --out tess_lightcurves.bin \
            --limit 16 \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: tess_lightcurves returned void" \
                 "tess_lightcurves compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile ZTF light curves and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 300 -o dr3_stars.bin \
            https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov/dr3_stars.bin \
            && cargo run -p omegaflow-harvest --release --bin ztf_lightcurves_compiler -- \
              --catalog dr3_stars.bin \
              --out ztf_lightcurves.bin \
              --limit 32 \
              --radius 0.02 \
              --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: ztf_lightcurves returned void" \
                 "ztf_lightcurves compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile AVO radio catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/avo.rad/catalog" \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:Vflux' \
            --skip-null z \
            --out avo_rad.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: avo_rad returned void" \
                 "avo_rad compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile BZCAT5 blazar catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "VII/274/bzcat5" \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:FR;typ:Class' \
            --skip-null z \
            --out bzcat5.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: bzcat5 returned void" \
                 "bzcat5 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile Swift GRB catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://heasarc.gsfc.nasa.gov/xamin/vo/tap/sync \
            --table swiftgrb \
            --text \
            --cols-unquoted \
            --columns 'name:name;ra:ra;dec:dec;z:redshift;fluence:bat_fluence;t90:bat_t90' \
            --skip-null z \
            --out swiftgrb.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: swiftgrb returned void" \
                 "swiftgrb compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile GCVS variable-star catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/gcvs/gcvs_cat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag:magMax;period:Period' \
            --skip-null mag \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out gcvs_cat.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: gcvs_cat returned void" \
                 "gcvs_cat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile ATNF pulsar catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/psr/psr" \
            --columns 'ra:RAJ2000;dec:DEJ2000;p0:P0;dm:DM;s1400:S1400' \
            --skip-null dm \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out psr.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: psr returned void" \
                 "psr compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile Asiago supernova catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/sn/sncat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;z:z;mag:MaxMag' \
            --skip-null z \
            --out sncat.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: sncat returned void" \
                 "sncat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile white-dwarf catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/wd/catalog" \
            --columns 'ra:RAB1950;dec:DEB1950;mag:Vmag;teff:Teff;plx:Plx' \
            --skip-null mag \
            --out wd.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: wd returned void" \
                 "wd compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile VSX variable-star index and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/vsx/vsx" \
            --columns 'ra:RAJ2000;dec:DEJ2000;max:max;min:min;period:Period' \
            --skip-null max \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out vsx.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: vsx returned void" \
                 "vsx compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile SB9 spectroscopic-binary catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/sb9/main" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;mag2:mag2' \
            --skip-null mag1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out sb9.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: sb9 returned void" \
                 "sb9 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile cataclysmic-binary catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/cb/cbdata" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;m1:M1;m2:M2' \
            --skip-null mag1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out cbdata.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: cbdata returned void" \
                 "cbdata compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile LMXB catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/cb/lmxbdata" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;m1:M1;m2:M2' \
            --skip-null m1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
