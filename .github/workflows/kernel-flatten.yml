    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GONG helioseismic modes and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin gong_compiler -- \
            --lsk kernels/naif0012.tls --out gong_modes.bin --ci-mode
      - name: Compile Solar Orbiter RPW E-field once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          [ -s kernels/naif0012.tls ] || curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern rpw_efield.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin rpw_compiler -- \
              --lsk kernels/naif0012.tls --out rpw_efield.bin --ci-mode \
              --window-start 2020-06-15 --window-end 2022-12-01
      - name: Compile Wind WAVES 1994-2021 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          [ -s kernels/naif0012.tls ] || curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download spdf.gsfc.nasa.gov --repo omegaflow/sources \
            --pattern wind_waves.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin wind_waves_compiler -- \
              --lsk kernels/naif0012.tls --out wind_waves.bin --ci-mode \
              --window-start 1994-11-10 --window-end 2021-12-31 --jobs 8
      - name: Compile Wind orbit 1994-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          [ -s kernels/naif0012.tls ] || curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download spdf.gsfc.nasa.gov --repo omegaflow/sources \
            --pattern wind_orbit.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin wind_orbit_compiler -- \
              --lsk kernels/naif0012.tls --out wind_orbit.bin --ci-mode \
              --fill-horizons \
              --window-start 1994-08-07 --window-end 2026-08-21 --jobs 8
      - name: Compile F10.7 Penticton 1947-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern f107_penticton.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin f107_compiler -- \
              --out f107_penticton.bin --ci-mode
      - name: Compile GONG frequency series 1995-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern gong_series.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin gong_series_compiler -- \
              --out gong_series.bin --ci-mode
      - name: Compile WSO polar field 1976-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern wso_polar.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin wso_polar_compiler -- \
              --out wso_polar.bin --ci-mode
      - name: Compile HMI polar field 2010-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern hmi_polar.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin hmi_polar_compiler -- \
              --out hmi_polar.bin --ci-mode
      - name: Compile BiSON p-mode velocity 1976-2024 once and upload to CDN
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern bison_pmode.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin bison_compiler -- \
              --out bison_pmode.bin --ci-mode
      - name: Compile OMNI2 full series 1963-2026 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern omni2_serie.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin omni2_compiler -- \
              --lsk kernels/naif0012.tls --out omni2_serie.bin --ci-mode \
              --window-start 1963-01-01 --window-end 2026-08-06 --decimate-min 1440 --jobs 8

  solar_xrs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GOES XRS 1995-2020 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern goes_xrs.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin goes_xrs_compiler -- \
              --lsk kernels/naif0012.tls --out goes_xrs.bin --ci-mode \
              --window-start 1995-01-01 --window-end 2020-12-31 --decimate-min 60 --jobs 24

  goes_r_xrs:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GOES-R XRS retro 2017-2025 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern goes_r_xrs.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin goes_r_xrs_compiler -- \
              --lsk kernels/naif0012.tls --out goes_r_xrs.bin --ci-mode \
              --window-start 2017-01-01 --window-end 2025-12-31 --jobs 24

  euvs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GOES EUV Lyman-alpha 2009-2020 once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern goes_euvs.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin euvs_compiler -- \
              --out goes_euvs.bin --ci-mode

  cmb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the Planck SMICA CMB map once and upload to CDN
        run: |
          mkdir -p kernels
          gh release download irsa.ipac.caltech.edu --repo omegaflow/sources \
            --pattern cmb_planck_smica_n64.json --clobber 2>/dev/null && exit 0
          curl -sSfL --retry 3 --max-time 5400 -o kernels/smica.fits \
            https://irsa.ipac.caltech.edu/data/Planck/release_3/all-sky-maps/maps/component-maps/cmb/COM_CMB_IQU-smica_2048_R3.00_full.fits
          cargo run -p omegaflow-harvest --release --bin cmb_planck_compiler -- \
            --input kernels/smica.fits --nside 64 \
            --out cmb_planck_smica_n64.json --ci-mode

  eve:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the EVE temperature ladder 2011 once and upload to CDN
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern eve_lines_2011.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin eve_compiler -- \
              --year 2011 --start-doy 40 --end-doy 130 \
              --out eve_lines_2011.bin --ci-mode

  aia:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the AIA imaging ladder 2014 once and upload to CDN
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern aia_lines.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin aia_compiler -- \
              --harvest --start 2014.03.01 --end 2014.05.30 \
              --out aia_lines.bin --ci-mode

  long_window_probe:
    needs: [sun, solar_xrs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the long-window probe (F10.7 history × GOES-XRS history)
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern goes_xrs.bin --pattern f107_penticton.bin --clobber && \
            cargo run -p omegaflow-measure --release --bin long_window_probe -- \
              --goes-bin goes_xrs.bin --f107-bin f107_penticton.bin

  solar_causal_graph:
    needs: [sun, solar_xrs, euvs]
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the solar DAG sheet (6 channels × 30 pairs × lag 0..7 d)
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern goes_xrs.bin --pattern f107_penticton.bin \
            --pattern omni2_serie.bin --pattern goes_euvs.bin --clobber && \
            cargo run -p omegaflow-measure --release --bin solar_causal_graph_probe -- \
              --goes-bin goes_xrs.bin --f107-bin f107_penticton.bin \
              --omni2-bin omni2_serie.bin --euvs-bin goes_euvs.bin

  wso_hmi_consistency:
    needs: [sun]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Cross-check WSO polar field against HMI (2010-2026)
        continue-on-error: true
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern wso_polar.bin --pattern hmi_polar.bin \
            --pattern f107_penticton.bin --clobber && \
            cargo run -p omegaflow-measure --release --bin wso_hmi_consistency -- \
              --wso-bin wso_polar.bin --hmi-bin hmi_polar.bin && \
            cargo run -p omegaflow-measure --release --bin hmi_cycle_probe -- \
              --hmi-bin hmi_polar.bin --f107-bin f107_penticton.bin
