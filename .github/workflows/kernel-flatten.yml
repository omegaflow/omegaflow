        continue-on-error: true
        run: |
          for lo in $(seq 0 15 345); do
            hi=$(awk "BEGIN{print $lo+15}")
            out="kernels/rave_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
