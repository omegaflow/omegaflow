            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: polarbase returned void" \
                 --body "polarbase compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile MERLIN radio-interferometry catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/merlin/merlin" \
            --columns 'ra:RAJ2000;dec:DEJ2000;freq:Freq;ampflux:AmpFlux' \
            --skip-null freq \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out merlin.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: merlin returned void" \
                 --body "merlin compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile Chandra CSC 2.1 X-ray catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "IX/70/csc21mas" \
            --columns 'name:2CXO;ra:RAICRS;dec:DEICRS;z:z;flux:Fluxb' \
            --skip-null flux \
            --async 600 --limit 500000 \
            --out chandra_csc.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: chandra_csc returned void" \
                 --body "chandra_csc compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile NVSS 1.4 GHz radio catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "VIII/65/nvss" \
            --columns 'name:NVSS;ra:RAJ2000;dec:DEJ2000;flux:S1_4' \
            --skip-null flux \
            --async 600 --limit 2000000 \
            --out nvss.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: nvss returned void" \
