                 --label health
      - name: Compile FIRST 1.4 GHz radio catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "VIII/92/first14" \
            --columns 'name:FIRST;ra:RAJ2000;dec:DEJ2000;fpeak:Fpeak;fint:Fint' \
            --skip-null fint \
            --async 600 --limit 1100000 \
            --out first14.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: first14 returned void" \
                 --body "first14 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile PANGAEA sediment core 758961 and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin pangaea_compiler -- \
            --id PANGAEA.758961 \
            --out pangaea_758961.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: pangaea_758961 returned void" \
                 --body "pangaea_758961 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile Gaia DR3 + Bailer-Jones star catalog and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 1200 -o kernels/hip_main.dat \
            https://cdsarc.cds.unistra.fr/ftp/I/239/hip_main.dat
          cargo run --release --bin tycho2_compiler -- \
            --source bright --input kernels/hip_main.dat --out kernels/bright_stars.json --xmatch
          cargo run --release --bin tap_compiler -- \
            --root https://gaia.ari.uni-heidelberg.de/tap/sync \
            --table gaiadr3.gaia_source_lite \
            --join gaiaedr3_complements.distances source_id \
            --columns 'ra:t.ra;dec:t.dec;pmra:t.pmra;pmdec:t.pmdec;mag:t.phot_g_mean_mag;dist_pc:j.r_med_geo;bpmag:t.phot_bp_mean_mag;rpmag:t.phot_rp_mean_mag;rv:t.radial_velocity' \
            --mag-bands 1.94 11.5 0.1 \
            --epoch 2016 --limit 90000 --star-bin \
            --union-bright kernels/bright_stars.json \
            --out dr3_stars.bin \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: dr3_stars returned void" \
                 --body "dr3_stars compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile FRBCAT via TAPVizieR and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/other/PASA/33.45/frbcat \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:zHost;dm:DM;speak:Speak' \
            --out frbcat_flat.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: frbcat_flat returned void" \
                 --body "frbcat_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile FRB A279 via TAPVizieR and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/693/A279/frbs \
            --columns 'name:TNS;ra:RAJ2000;dec:DEJ2000;z:z;dm:DM;tausc:tausc' \
            --out frb_a279.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: frb_a279 returned void" \
                 --body "frb_a279 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Report catalogs void
        if: failure()
        run: |
          gh issue create --repo omegaflow/omegaflow \
            --title "flatten: catalogs returned void" \
            --body "Catalogs job returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label health

  chunk_catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Prepare kernels dir
        run: |
          mkdir -p kernels
          gh label create health --repo omegaflow/omegaflow 2>/dev/null || true
          gh label create anomaly-report --repo omegaflow/omegaflow 2>/dev/null || true
      - name: Chunk-compile RAVE DR5 (24 RA-slices, rv-gate) and upload to CDN
        continue-on-error: true
        run: |
          for lo in $(seq 0 15 345); do
            hi=$(awk "BEGIN{print $lo+15}")
            out="kernels/rave_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "III/279/rave_dr5" \
                --columns 'ra:RAJ2000;dec:DEJ2000;teff:TeffK;rv:HRV' \
                --skip-null rv \
                --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
                --crossmatch-pm 'pmRA:pmDE:Plx::Teff:BPmag:RPmag:Gmag' \
                --limit 90000 \
                --where "t.\"RAJ2000\" >= ${lo} AND t.\"RAJ2000\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/rave_c*.json > rave_dr5.json
          gh release upload ssd.jpl.nasa.gov rave_dr5.json --clobber --repo omegaflow/sources \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: rave_dr5 returned void" \
                 --body "rave_dr5 chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Chunk-compile pastel (8 RA-slices) and upload to CDN
        continue-on-error: true
        run: |
          for lo in $(seq 0 45 315); do
            hi=$(awk "BEGIN{print $lo+45}")
            out="kernels/pastel_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "B/pastel/pastel" \
                --columns 'ra:RAdeg;dec:DEdeg;teff:Teff;logg:logg;mag:Vmag' \
                --skip-null teff \
                --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
                --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
                --limit 90000 \
                --where "t.\"RAdeg\" >= ${lo} AND t.\"RAdeg\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/pastel_c*.json > kernels/pastel.json
          gh release upload ssd.jpl.nasa.gov kernels/pastel.json --clobber --repo omegaflow/sources \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: pastel returned void" \
                 --body "pastel chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Chunk-compile wds (8 RA-slices) and upload to CDN
        continue-on-error: true
        run: |
          for lo in $(seq 0 45 315); do
            hi=$(awk "BEGIN{print $lo+45}")
            out="kernels/wds_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "B/wds/wds" \
                --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;mag2:mag2;sep:sep1' \
                --skip-null mag1 \
                --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
                --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
                --limit 90000 \
                --where "t.\"RAJ2000\" >= ${lo} AND t.\"RAJ2000\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/wds_c*.json > kernels/wds.json
          gh release upload ssd.jpl.nasa.gov kernels/wds.json --clobber --repo omegaflow/sources \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: wds returned void" \
                 --body "wds chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Chunk-compile mktypes (80 RA-slices) and upload to CDN
        continue-on-error: true
        run: |
          for lo in $(seq 0 4.5 355.5); do
            hi=$(awk "BEGIN{print $lo+4.5}")
            out="kernels/mktypes_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "B/mk/mktypes" \
                --columns 'ra:RAJ2000;dec:DEJ2000;mag:Mag' \
                --skip-null mag \
                --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
                --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
                --limit 90000 \
                --where "t.\"RAJ2000\" >= ${lo} AND t.\"RAJ2000\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/mktypes_c*.json > kernels/mktypes.json
          gh release upload ssd.jpl.nasa.gov kernels/mktypes.json --clobber --repo omegaflow/sources \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: mktypes returned void" \
                 --body "mktypes chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Chunk-compile denis (16 RA-slices) and upload to CDN
        continue-on-error: true
        run: |
          for lo in $(seq 0 22.5 337.5); do
            hi=$(awk "BEGIN{print $lo+22.5}")
            out="kernels/denis_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "B/denis/denis" \
                --columns 'ra:RAJ2000;dec:DEJ2000;imag:Imag;jmag:Jmag;kmag:Kmag' \
                --skip-null jmag \
                --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
                --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
                --limit 90000 \
                --where "t.\"RAJ2000\" >= ${lo} AND t.\"RAJ2000\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/denis_c*.json > kernels/denis.json
          gh release upload ssd.jpl.nasa.gov kernels/denis.json --clobber --repo omegaflow/sources \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: denis returned void" \
                 --body "denis chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health

  sun:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile GONG helioseismic modes and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run --release --bin gong_compiler -- \
            --lsk kernels/naif0012.tls --out gong_modes.bin --ci-mode
      - name: Compile Solar Orbiter RPW E-field once and upload to CDN
        continue-on-error: true
        run: |
          mkdir -p kernels
          [ -s kernels/naif0012.tls ] || curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern rpw_efield.bin --clobber 2>/dev/null || \
            cargo run --release --bin rpw_compiler -- \
              --lsk kernels/naif0012.tls --out rpw_efield.bin --ci-mode \
              --window-start 2020-06-15 --window-end 2022-12-01
