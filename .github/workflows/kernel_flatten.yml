name: kernel-flatten

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 1 * *'

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Crawl kernel roots
        run: |
          cargo run --release --bin ephemeris_compiler -- --index \
            --root https://ssd.jpl.nasa.gov/ftp/ \
            --root https://naif.jpl.nasa.gov/pub/ \
            --out phi/sources_index.φ \
            --jobs 4 \
            --delay-ms 50
      - name: Summarize kernel index
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            --summarize phi/sources_index.φ docs/reference/KERNEL_INDEX.md
      - name: Upload index artifact
        uses: actions/upload-artifact@v4
        with:
          name: sources-index
          path: |
            phi/sources_index.φ
            docs/reference/KERNEL_INDEX.md
          retention-days: 7
      - name: Commit index
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ docs/reference/KERNEL_INDEX.md
          git diff --staged --quiet || git commit -m "kernel index $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push

  bodies:
    needs: index
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/download-artifact@v4
        with:
          name: sources-index
      - name: Flatten SPK bodies and upload to CDN
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            --fetch-from phi/sources_index.φ \
            --systems planets,jupiter,saturn,mars,uranus,neptune,pluto \
            --dest kernels \
            --ci-mode \
            --omega-g phi/pipeline/katalog/solar_omega_g.φ \
            --index phi/sources_index.φ
      - name: Flatten asteroid longbow and upload to CDN
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            --fetch-from phi/sources_index.φ \
            --systems asteroids \
            --small-bodies \
            --dest kernels \
            --ci-mode \
            --index phi/sources_index.φ
      - name: Compile Horizons bodies and upload to CDN
        run: |
          cargo run --release --bin horizons_compiler -- --ci-mode
      - name: Compile DASTCOM asteroid catalog and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 7200 -o kernels/dast5_le.dat \
            https://ssd.jpl.nasa.gov/ftp/xfr/dast5_le.dat
          cargo run --release --bin dastcom_compiler -- \
            --input kernels/dast5_le.dat \
            --out dastcom_asteroids.bin \
            --gm phi/pipeline/katalog/asteroid_gm_inpop25c.φ \
            --diameters phi/pipeline/katalog/asteroid_diameters_neowise.φ,phi/pipeline/katalog/asteroid_diameters_akari.φ \
            --ci-mode
      - name: Commit body manifest
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ
          git diff --staged --quiet || git commit -m "body manifest $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          git push
      - name: Report bodies void
        if: failure()
        run: |
          gh issue create --repo omegaflow/omegaflow \
            --title "flatten: bodies returned void" \
            --body "Bodies job returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label health

  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Prepare kernels dir
        run: |
          mkdir -p kernels
          gh label create health --repo omegaflow/omegaflow 2>/dev/null || true
          gh label create anomaly-report --repo omegaflow/omegaflow 2>/dev/null || true
      - name: Compile sexagesimal catalogs and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 300 -o kernels/tabo1.csv \
            https://www.physics.mcgill.ca/~pulsar/magnetar/TabO1.csv
          curl -sSfL --retry 3 --max-time 300 -o kernels/tevcat2.json \
            https://tevcat2.tevcat.org/api/sources
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/495/691/bzcat4 \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z' \
            --out kernels/blazars_z.json \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: blazars_z returned void" \
                 --body "blazars_z compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table J/A+A/612/A1/snrcat \
            --columns 'name:Source;ra:@8;dec:@9;dist:Dist' \
            --out kernels/snr_dist.json \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: snr_dist returned void" \
                 --body "snr_dist compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table B/psr/psr \
            --columns 'name:Name;ra:RA2000;dec:DE2000;dist:Dist' \
            --out kernels/pulsar_dist.json \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: pulsar_dist returned void" \
                 --body "pulsar_dist compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
          cargo run --release --bin sexagesimal_compiler -- \
            --source magnetar --input kernels/tabo1.csv --out magnetar_flat.json --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: magnetar_flat returned void" \
                 --body "magnetar_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
          cargo run --release --bin sexagesimal_compiler -- \
            --source tevcat --input kernels/tevcat2.json \
            --join-z kernels/blazars_z.json --join-dist kernels/snr_dist.json \
            --join-dist2 kernels/pulsar_dist.json 0.0083 \
            --out tevcat_flat.json --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: tevcat_flat returned void" \
                 --body "tevcat_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile MPC cometels catalog and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 600 -o kernels/cometels.json.gz \
            https://www.minorplanetcenter.net/Extended_Files/cometels.json.gz
          cargo run --release --bin cometels_compiler -- \
            --input kernels/cometels.json.gz \
            --out cometels_flat.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: cometels_flat returned void" \
                 --body "cometels_flat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile DASTCOM5 comet apparition catalog and upload to CDN
        continue-on-error: true
        run: |
          curl -sSfL --retry 3 --max-time 7200 -o kernels/dcom5_le.dat \
            https://ssd.jpl.nasa.gov/ftp/xfr/dcom5_le.dat
          cargo run --release --bin dcom5_compiler -- \
            --input kernels/dcom5_le.dat \
            --out dcom5_comets.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: dcom5_comets returned void" \
                 --body "dcom5_comets compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile exoplanet catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://exoplanetarchive.ipac.caltech.edu/TAP/sync \
            --table pscomppars \
            --cols-unquoted \
            --columns 'name:pl_name;ra:ra;dec:dec;dist:sy_dist;masse:pl_masse;rade:pl_rade;orbsmax:pl_orbsmax;orbeccen:pl_orbeccen;orbincl:pl_orbincl;orblper:pl_orblper;tranmid:pl_tranmid;orbper:pl_orbper;strad:st_rad' \
            --skip-null dist \
            --out exoplanets.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: exoplanets returned void" \
                 --body "exoplanets compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile TESS light curves and upload to CDN
        continue-on-error: true
        env:
          MAST_TOKEN: ${{ secrets.MAST_TOKEN }}
        run: |
          cargo run --release --bin tess_compiler -- \
            --out tess_lightcurves.bin \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: tess_lightcurves returned void" \
                 --body "tess_lightcurves compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile AVO radio catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/avo.rad/catalog" \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:Vflux' \
            --skip-null z \
            --out avo_rad.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: avo_rad returned void" \
                 --body "avo_rad compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile BZCAT5 blazar catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "VII/274/bzcat5" \
            --columns 'name:Name;ra:RAJ2000;dec:DEJ2000;z:z;flux:FR;typ:Class' \
            --skip-null z \
            --out bzcat5.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: bzcat5 returned void" \
                 --body "bzcat5 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile Swift GRB catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://heasarc.gsfc.nasa.gov/xamin/vo/tap/sync \
            --table swiftgrb \
            --text \
            --cols-unquoted \
            --columns 'name:name;ra:ra;dec:dec;z:redshift;fluence:bat_fluence;t90:bat_t90' \
            --skip-null z \
            --out swiftgrb.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: swiftgrb returned void" \
                 --body "swiftgrb compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile GCVS variable-star catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/gcvs/gcvs_cat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag:magMax;period:Period' \
            --skip-null mag \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out gcvs_cat.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: gcvs_cat returned void" \
                 --body "gcvs_cat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile ATNF pulsar catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/psr/psr" \
            --columns 'ra:RAJ2000;dec:DEJ2000;p0:P0;dm:DM;s1400:S1400' \
            --skip-null dm \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out psr.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: psr returned void" \
                 --body "psr compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile Asiago supernova catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/sn/sncat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;z:z;mag:MaxMag' \
            --skip-null z \
            --out sncat.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: sncat returned void" \
                 --body "sncat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile white-dwarf catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/wd/catalog" \
            --columns 'ra:RAB1950;dec:DEB1950;mag:Vmag;teff:Teff;plx:Plx' \
            --skip-null mag \
            --out wd.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: wd returned void" \
                 --body "wd compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile VSX variable-star index and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/vsx/vsx" \
            --columns 'ra:RAJ2000;dec:DEJ2000;max:max;min:min;period:Period' \
            --skip-null max \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out vsx.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: vsx returned void" \
                 --body "vsx compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile SB9 spectroscopic-binary catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/sb9/main" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;mag2:mag2' \
            --skip-null mag1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out sb9.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: sb9 returned void" \
                 --body "sb9 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile cataclysmic-binary catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/cb/cbdata" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;m1:M1;m2:M2' \
            --skip-null mag1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out cbdata.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: cbdata returned void" \
                 --body "cbdata compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile LMXB catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/cb/lmxbdata" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag1:mag1;m1:M1;m2:M2' \
            --skip-null m1 \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out lmxbdata.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: lmxbdata returned void" \
                 --body "lmxbdata compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile CoRoT bright-star catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/corot/Bright_star" \
            --columns 'ra:RAJ2000;dec:DEJ2000;mag:Vmag;teff:Teff;logg:logg' \
            --skip-null mag \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out corot.json \
            --ci-mode \
            || gh issue create --repo omegaflow/omegaflow \
                 --title "flatten: corot returned void" \
                 --body "corot compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 --label health
      - name: Compile polarimetry catalog and upload to CDN
        continue-on-error: true
        run: |
          cargo run --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/polarbase/polarbase" \
            --columns 'ra:RA_ICRS;dec:DE_ICRS;teff:Teff;logg:logg;mag:Vmag' \
            --skip-null teff \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
