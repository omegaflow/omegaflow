name: kernel-flatten

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Crawl kernel roots
        run: |
          cargo run --release --bin ephemeris_compiler -- --index \
            --root https://ssd.jpl.nasa.gov/ftp/ \
            --root https://naif.jpl.nasa.gov/pub/ \
            --out phi/sources_index.φ \
            --jobs 4 \
            --delay-ms 50
      - name: Summarize kernel index
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            --summarize phi/sources_index.φ docs/reference/KERNEL_INDEX.md
      - name: Commit index
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ docs/reference/KERNEL_INDEX.md
          git diff --staged --quiet || git commit -m "kernel index $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push

  flatten:
    needs: index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Flatten SPK bodies and upload to CDN
        run: |
          cargo run --release --bin ephemeris_compiler -- \
            --fetch-from phi/sources_index.φ \
            --systems planets,jupiter,saturn,mars,uranus,neptune,pluto \
            --dest kernels \
            --ci-mode \
            --index phi/sources_index.φ
      - name: Compile Horizons bodies and upload to CDN
        run: |
          cargo run --release --bin horizons_compiler -- --ci-mode
      - name: Compile DASTCOM asteroid catalog and upload to CDN
        run: |
          curl -sSfL --retry 3 --max-time 7200 -o kernels/dast5_le.dat \
            https://ssd.jpl.nasa.gov/ftp/xfr/dast5_le.dat
          cargo run --release --bin dastcom_compiler -- \
            --input kernels/dast5_le.dat \
            --out dastcom_asteroids.bin \
            --ci-mode
      - name: Compile sexagesimal catalogs and upload to CDN
        run: |
          curl -sSfL --retry 3 --max-time 300 -o kernels/tabo1.csv \
            https://www.physics.mcgill.ca/~pulsar/magnetar/TabO1.csv
          curl -sSfL --retry 3 --max-time 300 -o kernels/tevcat2.json \
            https://tevcat2.tevcat.org/api/sources
          cargo run --release --bin sexagesimal_compiler -- \
            --source magnetar --input kernels/tabo1.csv --out magnetar_flat.json --ci-mode
          cargo run --release --bin sexagesimal_compiler -- \
            --source tevcat --input kernels/tevcat2.json --out tevcat_flat.json --ci-mode
      - name: Compile MPC cometels catalog and upload to CDN
        run: |
          curl -sSfL --retry 3 --max-time 600 -o kernels/cometels.json.gz \
            https://www.minorplanetcenter.net/Extended_Files/cometels.json.gz
          cargo run --release --bin cometels_compiler -- \
            --input kernels/cometels.json.gz \
            --out cometels_flat.json \
            --ci-mode
      - name: Compile TGAS star catalog and upload to CDN
        run: |
          curl -sSfL --retry 3 --max-time 3600 -o kernels/tgas.dat.gz \
            https://cdsarc.cds.unistra.fr/ftp/I/337/tgas.dat.gz
          cargo run --release --bin tycho2_compiler -- \
            --source tgas \
            --input kernels/tgas.dat.gz \
            --out tgas_stars.bin \
            --ci-mode
      - name: Commit body manifest
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/sources_index.φ
          git diff --staged --quiet || git commit -m "body manifest $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase origin main
          git push
