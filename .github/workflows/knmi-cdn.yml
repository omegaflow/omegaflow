name: knmi-cdn

# auto-dispatch: manual — the EDR collection is a per-act surface; the runner needs the KNMI_API_KEY secret

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      collection:
        description: KNMI EDR collection id
        required: false
        type: string
        default: "10-minute-in-situ-meteorological-observations"
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  KNMI_API_KEY: ${{ secrets.KNMI_API_KEY }}
  RUSTFLAGS: -D warnings
jobs:
  knmi:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the api.dataplatform.knmi.nl release exists on the CDN
        run: |
          if ! gh release view api.dataplatform.knmi.nl --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create api.dataplatform.knmi.nl --repo omegaflow/sources \
              --title "api.dataplatform.knmi.nl" \
              --notes "KNMI Data Platform EDR in-situ observations compiled to ICRS records; 8-byte header then n x 26 f64 (temperature K, wind m/s, precipitation kg/(m2 s)), 10-minute cadence."
          fi
      - name: Compile the KNMI EDR window and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin knmi_compiler -- \
            --body earth \
            --out out \
            --edr \
            --edr-collection "${{ inputs.collection }}" \
            --edr-dump edr-dump \
            --ci-mode
  series-manifest:
    needs: [knmi]
    if: always() && needs.knmi.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fold every knmi shard on the CDN into the year-less series manifest
        run: |
          set -euo pipefail
          FAMILY="api.dataplatform.knmi.nl"
          PREFIX="knmi_"
          MANIFEST="knmi.manifest"
          REPO="omegaflow/sources"
          tmp="$(mktemp -d)"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            | jq -r '.[].tag_name' > "$tmp/tags"
          : > "$tmp/$MANIFEST"
          while IFS= read -r tag; do
            case "$tag" in
              "$FAMILY"|"$FAMILY"-*) ;;
              *) continue ;;
            esac
            gh release view "$tag" --repo "$REPO" \
              --json assets \
              --jq ".assets[] | select(.name|startswith(\"$PREFIX\")) | select(.name|endswith(\".bin\")) | \"\(.name) \(.digest)\"" \
              >> "$tmp/$MANIFEST"
          done < "$tmp/tags"
          sort -u -o "$tmp/$MANIFEST" "$tmp/$MANIFEST"
          if [ ! -s "$tmp/$MANIFEST" ]; then
            echo "no knmi shards on the CDN — the series manifest stays unwritten (0 honored)"
            exit 0
          fi
          echo "$MANIFEST lists $(wc -l < "$tmp/$MANIFEST") shards"
          gh release upload "$FAMILY" "$tmp/$MANIFEST" --clobber --repo "$REPO"
