name: lis-otd-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  lis-otd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ghrc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "lis_otd.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset lis_otd.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset lis_otd.bin missing — compiling and manifesting"
          fi
      - name: Compile the OTD flash granules and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin lis_otd_compiler -- \
            --granule https://data.ghrc.earthdata.nasa.gov/ghrcw-protected/otdlip__1/otdlip_1995.103_daily.tar \
            --granule https://data.ghrc.earthdata.nasa.gov/ghrcw-protected/otdlip__1/otdlip_1995.104_daily.tar \
            --granule https://data.ghrc.earthdata.nasa.gov/ghrcw-protected/otdlip__1/otdlip_1995.105_daily.tar \
            --out lis_otd.bin --lsk kernels/naif0012.tls --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "lis-otd-cdn: lis_otd.bin returned void" \
                 "lis_otd_compiler returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
