name: m10-jpl-edr-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  m10-jpl-edr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view planetarydata.jpl.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^mariner_m10_jpl_edr"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset mariner_m10_jpl_edr* already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset mariner_m10_jpl_edr* missing — compiling and manifesting"
          fi
      - name: Ensure the planetarydata.jpl.nasa.gov release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view planetarydata.jpl.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create planetarydata.jpl.nasa.gov --repo omegaflow/sources \
              --title "planetarydata.jpl.nasa.gov" \
              --notes "Mariner 10 ISS EDR (MVM mvm_0007..0009, mve_024..035) image column means packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the Mariner 10 JPL EDR column means and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin mariner_m10_jpl_edr_compiler -- --ci-mode
