name: mariner-occlt-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  mariner-occlt:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view spdf.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "mariner_occlt.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset mariner_occlt.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset mariner_occlt.bin missing — compiling and manifesting"
          fi
      - name: Ensure the spdf.gsfc.nasa.gov release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view spdf.gsfc.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create spdf.gsfc.nasa.gov --repo omegaflow/sources \
              --title "spdf.gsfc.nasa.gov" \
              --notes "Mariner 10 Venus occultation reduced telemetry signal data (NSSDC NSSD1346) packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the Mariner 10 Venus occultation record blocks and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin mariner_occlt_compiler -- --ci-mode
