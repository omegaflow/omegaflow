name: mariner10-ephemeris-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  mariner10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "ephemeris_mariner10.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_mariner10.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ephemeris_mariner10.bin missing — compiling and manifesting"
          fi
      - name: Ensure the ssd.jpl.nasa.gov-ephemeris release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ssd.jpl.nasa.gov-ephemeris --repo omegaflow/sources \
              --title "ssd.jpl.nasa.gov-ephemeris" \
              --notes "flattened JPL ephemeris bins compiled for omegaflow (CDN tag = <netloc>-<family>)"
          fi
      - name: Download the Mariner 10 archive SPK kernel
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 5400 -o kernels/M10_archive_1.bsp \
            https://naif.jpl.nasa.gov/pub/naif/M10/kernels/spk/M10_archive_1.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "mariner10-ephemeris-cdn: M10_archive_1.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the Mariner 10 archive SPK. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Compile the Mariner 10 ephemeris and upload to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin ephemeris_mariner10_compiler -- \
            --kernel kernels/M10_archive_1.bsp \
            --out ephemeris_mariner10.bin \
            --ci-mode
