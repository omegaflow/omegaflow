# harvest: asset=masie_ice_extent.bin arm=masie_compiler idempotent=true timeout=240 tag=noaadata.apps.nsidc.org

name: masie-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
  schedule:
    # daily product — the MASIe 4 km ice extent carries one row per day
    - cron: "23 4 * * *"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  masie:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view noaadata.apps.nsidc.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^masie_ice_extent.bin$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset masie_ice_extent.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset masie_ice_extent.bin missing — compiling and manifesting"
          fi
      - name: Manifest the MASIe 4 km ice extent to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin masie_compiler -- --ci-mode
