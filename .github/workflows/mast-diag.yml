name: mast-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      MAST_TOKEN: ${{ secrets.MAST_TOKEN }}
    steps:
      - name: Isolate MAST token vs runner network
        run: |
          echo "token set: $([ -n \"$MAST_TOKEN\" ] && echo yes || echo no)"
          echo "--- CAOM invoke (api/v0) ---"
          REQ='{"service":"Mast.Caom.Filtered","params":{"columns":"obs_id,dataRights","filters":[{"paramName":"obs_id","values":["jw03838-o004_t004_nirspec_f290lp-g395h-s1600a1-sub2048"]}]},"format":"json"}'
          curl -sS -o /dev/null -w "caom http=%{http_code} size=%{size_download}B\n" --max-time 60 \
            -H "Authorization: Bearer $MAST_TOKEN" --data-urlencode "request=$REQ" \
            https://mast.stsci.edu/api/v0/invoke
          echo "--- Download file (v0.1) public WASP-15 _x1dints ---"
          curl -sS -o /tmp/diag.fits -w "dl http=%{http_code} size=%{size_download}B time=%{time_total}s\n" \
            --max-time 90 -H "Authorization: Bearer $MAST_TOKEN" \
            "https://mast.stsci.edu/api/v0.1/Download/file?uri=mast:JWST/product/jw03838-o004_t004_nirspec_f290lp-g395h-s1600a1-sub2048_x1dints.fits"
          echo "first bytes:"; head -c 60 /tmp/diag.fits | tr -d '\n'; echo
