name: maven-tnf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even when maven_tnf assets already exist on the CDN
        required: false
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  maven-tnf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset or its shards already exist on the CDN
        id: idempotence
        run: |
          names=$(gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
            --json assets --jq '.assets[]?.name' 2>/dev/null || true)
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force=true — rebuilding despite existing assets"
          elif printf '%s\n' "$names" | grep -qE '^maven_tnf(\.bin|_t)'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "maven_tnf asset/shards already present — harvest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "maven_tnf asset/shards missing — compiling and manifesting"
          fi
      - name: Ensure the pds-ppi.igpp.ucla.edu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
              --title "pds-ppi.igpp.ucla.edu" \
              --notes "MAVEN ROSE TNF uplink-carrier-phase series packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the MAVEN ROSE TNF series (sharded under the asset cap) and manifest it to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin maven_tnf_compiler -- --ci-mode
