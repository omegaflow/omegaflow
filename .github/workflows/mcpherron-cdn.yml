# harvest: format=substorm asset=present arm=mcpherron_compiler pattern=^mcpherron\.bin$ idempotent=true timeout=120 tag=zenodo.org
name: mcpherron-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  mcpherron:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view zenodo.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "mcpherron.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset mcpherron.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset mcpherron.bin missing — compiling and manifesting"
          fi
      - name: Compile the McPherron onset list and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin mcpherron_compiler -- --out-bin mcpherron.bin --ci-mode
