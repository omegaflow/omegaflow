name: measure-gates

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  measure-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Anchor the run
        run: echo "SHA $(git rev-parse HEAD)" > measure-gates.txt
      - name: Run the Betti-0 calibration gates (FP, FN, symmetry, n-floor)
        run: cargo test --release -p omegaflow --lib -- --nocapture betti0 >> measure-gates.txt 2>&1
      - name: Run the silence-map gates (six gates in the probe bin)
        run: cargo test --release -p omegaflow-measure --bin silence_map_probe >> measure-gates.txt 2>&1
      - name: Run the silence-map probe against the CDN catalog (the real measurement)
        run: cargo run --release -p omegaflow-measure --bin silence_map_probe >> measure-gates.txt 2>&1
      - name: Fetch the SWPC live channels into the archivar cache
        run: |
          mkdir -p cache/services.swpc.noaa.gov
          for attempt in 1 2 3; do
            curl -sSfL --retry 3 --max-time 120 \
              -o cache/services.swpc.noaa.gov/json-rtsw-rtsw_wind_1m.json \
              https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json \
              && curl -sSfL --retry 3 --max-time 120 \
              -o cache/services.swpc.noaa.gov/json-rtsw-rtsw_mag_1m.json \
              https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json \
              && curl -sSfL --retry 3 --max-time 120 \
              -o cache/services.swpc.noaa.gov/json-goes-primary-xrays-7-day.json \
              https://services.swpc.noaa.gov/json/goes/primary/xrays-7-day.json \
              && curl -sSfL --retry 3 --max-time 120 \
              -o cache/services.swpc.noaa.gov/json-goes-primary-euvs-7-day.json \
              https://services.swpc.noaa.gov/json/goes/primary/euvs-7-day.json \
              && break
            echo "corpus fetch attempt ${attempt} void — retrying"
            sleep 60
          done
          test -s cache/services.swpc.noaa.gov/json-rtsw-rtsw_wind_1m.json
          test -s cache/services.swpc.noaa.gov/json-rtsw-rtsw_mag_1m.json
          test -s cache/services.swpc.noaa.gov/json-goes-primary-xrays-7-day.json
          test -s cache/services.swpc.noaa.gov/json-goes-primary-euvs-7-day.json
      - name: Run the perm-target probe (the realized input distribution of the permeability map)
        run: cargo run --release -p omegaflow-measure --bin perm_target_probe >> measure-gates.txt 2>&1
      - name: Raise an issue when a measure gate fails
        if: failure()
        run: |
          bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
               "measure-gates: a calibration gate carries a finding" \
               "A measure gate returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measure-gates
          path: measure-gates.txt
