name: membrane-hull-probe

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the membrane-hull corpus from the CDN
        run: |
          mkdir -p data/ssd.jpl.nasa.gov
          # pallas and juno_asteroid carry no ephemeris bin on the release
          # (measured 2026-09-16: gh release view ssd.jpl.nasa.gov --json assets) —
          # their SPK lines read absent in the corpus, honestly, never fabricated.
          for attempt in 1 2 3; do
            gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
              --pattern 'ephemeris_ceres.bin' --pattern 'ephemeris_vesta.bin' \
              --pattern 'ephemeris_pluto.bin' --pattern 'ephemeris_bennu.bin' \
              --pattern 'ephemeris_apophis.bin' --pattern 'ephemeris_eris.bin' \
              --pattern 'ephemeris_makemake.bin' --pattern 'ephemeris_haumea.bin' \
              --pattern 'ephemeris_sun.bin' --pattern 'dastcom_asteroids.bin' \
              --pattern 'dr3_stars.bin' \
              --clobber --dir data/ssd.jpl.nasa.gov \
              && break
            echo "membrane-hull-probe corpus fetch attempt ${attempt} void — retrying"
            sleep 60
          done
          test -s data/ssd.jpl.nasa.gov/ephemeris_sun.bin
          test -s data/ssd.jpl.nasa.gov/dastcom_asteroids.bin
          test -s data/ssd.jpl.nasa.gov/dr3_stars.bin
      - name: Run the membrane ingress hull measurement
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin membrane_hull_probe -- \
              --eph-dir data/ssd.jpl.nasa.gov \
              --stars data/ssd.jpl.nasa.gov/dr3_stars.bin \
              --dastcom data/ssd.jpl.nasa.gov/dastcom_asteroids.bin \
              --sources phi/sources.φ
          } > membrane-hull-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: membrane-hull-probe
          path: membrane-hull-probe.txt
