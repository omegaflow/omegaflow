name: merlin-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  merlin:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile MERLIN radio-interferometry catalog and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/merlin/merlin" \
            --columns 'ra:RAJ2000;dec:DEJ2000;freq:Freq;ampflux:AmpFlux' \
            --skip-null freq \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out merlin.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: merlin returned void" \
                 "merlin compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
