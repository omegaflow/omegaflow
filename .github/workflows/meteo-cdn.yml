name: meteo-cdn

on:
  workflow_dispatch:
    inputs:
      event:
        description: Event config (phi/meteo/*.json)
        required: true
        default: tibet-flut-2026.json

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}

jobs:
  meteo-harvest-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v4
        with:
          path: |
            phi/pipeline/meteo_harvest
          key: meteo-harvest-${{ runner.os }}-${{ github.event.inputs.event }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build meteo_cache_manifest
        run: cargo build -p omegaflow-harvest --release --bin meteo_cache_manifest

      - name: Fetch origin and upload cache assets to CDN
        run: |
          ./target/release/meteo_cache_manifest \
            --event phi/meteo/${{ github.event.inputs.event }} \
            --out phi/pipeline/meteo_harvest --ci-mode
