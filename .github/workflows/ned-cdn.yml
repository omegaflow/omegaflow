name: ned-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ned:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: NED sky-grid harvest (ra bands, z > 0, lattice + dedup)
        run: |
          cargo build -p omegaflow-harvest --release --bin tap_compiler
          ./target/release/tap_compiler \
            --root https://ned.ipac.caltech.edu/tap/sync \
            --table NEDTAP.objdir \
            --columns 'objid:objid;ra:ra;dec:dec;z:z;name:prefname;type:type_key;n_spectra:n_spectra' \
            --where "z > 0" \
            --band ra 0 360 1 \
            --limit 5000 \
            --lattice 1024 \
            --out ned_raw.json
          jq -r '.[] | [(.cell|tostring), (.rank|tostring), (.objid|tostring), ({ra, dec, z, name, type, n_spectra}|tojson)] | join(" ")' ned_raw.json \
            | sort -k1,1n -k2,2n -k3,3n \
            | awk -F' ' '{ cell=$1; if (cell != cur) { cur=cell; n=0; delete seen } if (n >= 4) next; oid=$3; if (seen[oid]) next; seen[oid]=1; n++; print }' \
            | awk -F' ' '{sub(/^[^ ]* [^ ]* [^ ]* /, ""); print}' | jq -s '.' > ned.json
          gh release upload ssd.jpl.nasa.gov ned.json --clobber --repo omegaflow/sources \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: ned.json returned void" \
                 "ned band compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
