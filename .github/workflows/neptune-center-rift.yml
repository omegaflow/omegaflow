name: neptune-center-rift

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  rift:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Download the three ephemeris houses and the center-899 SPK
        run: |
          mkdir -p data/ssd.jpl.nasa.gov data/ftp.imcce.fr data/ftp.iaaras.ru data/naif.jpl.nasa.gov
          curl -sSfL --retry 3 --max-time 5400 -o data/ssd.jpl.nasa.gov/ephemeris_neptune_c.bin \
            https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov/ephemeris_neptune_c.bin \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "neptune-center-rift: ephemeris_neptune_c.bin returned void from the CDN" \
                 "curl on the CDN did not reach the DE441-consistent planet-center bin. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          curl -sSfL --retry 3 --max-time 5400 -o data/ftp.imcce.fr/ephemeris_inpop_neptune.bin \
            https://github.com/omegaflow/sources/releases/download/ftp.imcce.fr/ephemeris_inpop_neptune.bin \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "neptune-center-rift: ephemeris_inpop_neptune.bin returned void from the CDN" \
                 "curl on the CDN did not reach the INPOP Neptune bin. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          curl -sSfL --retry 3 --max-time 5400 -o data/ftp.iaaras.ru/ephemeris_epm_neptune.bin \
            https://github.com/omegaflow/sources/releases/download/ftp.iaaras.ru/ephemeris_epm_neptune.bin \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "neptune-center-rift: ephemeris_epm_neptune.bin returned void from the CDN" \
                 "curl on the CDN did not reach the EPM Neptune bin. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
          curl -sSfL --retry 3 --max-time 5400 -o data/naif.jpl.nasa.gov/nep097xl-899.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/nep097xl-899.bsp \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "neptune-center-rift: nep097xl-899.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the center-899 SPK. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Run the Neptune center rift probe against the three houses
        run: |
          cargo run -p omegaflow-measure --release --bin neptune_center_rift_probe -- \
            --eph-dir data --spk data/naif.jpl.nasa.gov/nep097xl-899.bsp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: neptune-center-rift
          path: |
            state/reports/neptune_center_rift.txt
            state/reports/neptune_center_rift_series.tsv
