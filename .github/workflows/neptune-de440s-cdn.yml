name: neptune-de440s-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 4 * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  neptune-de440s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the ssd.jpl.nasa.gov release exists on the CDN
        run: |
          if ! gh release view ssd.jpl.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ssd.jpl.nasa.gov --repo omegaflow/sources \
              --title "ssd.jpl.nasa.gov" \
              --notes "raw JPL ephemeris bins compiled for omegaflow measure tools (CDN tag = netloc)"
          fi
      - name: Compile the DE440 Neptune barycenter line and upload
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 5400 -o kernels/de440s.bsp \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de440s.bsp \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "neptune-de440s-cdn: de440s.bsp returned void" \
                 "curl on naif.jpl.nasa.gov did not reach the SPK. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
          cargo run -p omegaflow-harvest --release --bin neptune_ephemeris_compiler -- \
            kernels/de440s.bsp --ci-mode
