name: nexrad-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  nexrad:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the unidata-nexrad-level2.s3.amazonaws.com release exists on the CDN
        run: |
          if ! gh release view unidata-nexrad-level2.s3.amazonaws.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create unidata-nexrad-level2.s3.amazonaws.com --repo omegaflow/sources \
              --title "unidata-nexrad-level2.s3.amazonaws.com" \
              --notes "NEXRAD Level-II (WSR-88D) volume compiled to radial gate samples. Record stride: t unix s (f64 LE), az_deg (f64 LE), el_deg (f64 LE), range_km (f64 LE), value (f64 LE, physical moment), kind (u32 LE: 1 REF dBZ, 2 VEL m/s, 3 SW m/s). Magic NXR1."
          fi
      - name: Fetch the NEXRAD Level-II volume
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 600 -o kernels/KTLX20240101_000004_V06 \
            https://unidata-nexrad-level2.s3.amazonaws.com/2024/01/01/KTLX/KTLX20240101_000004_V06 \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "nexrad-cdn: KTLX20240101_000004_V06 returned void" \
                 "curl on unidata-nexrad-level2.s3.amazonaws.com did not reach the volume. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile the NEXRAD radial gate samples and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin nexrad_level2_compiler -- \
            --input kernels/KTLX20240101_000004_V06 \
            --out nexrad_level2.bin \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "nexrad-cdn: nexrad_level2.bin returned void" \
                 "nexrad compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
