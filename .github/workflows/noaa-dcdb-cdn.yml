name: noaa-dcdb-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      date:
        description: harvest day (YYYY-MM-DD) under csb/csv/
        required: true
        type: string
        default: "2017-04-25"
      max_files:
        description: max CSV files (blank = all under the day)
        required: false
        type: string
        default: ""
      asset:
        description: output asset name on the CDN (netloc noaa-dcdb-bathymetry-pds.s3.amazonaws.com)
        required: true
        type: string
        default: dcdb_csb_2017-04-25.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  noaa-dcdb:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view noaa-dcdb-bathymetry-pds.s3.amazonaws.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
            exit 0
          fi
          echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
      - name: Compile the DCDB crowdsourced soundings and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          extra=()
          if [ -n "${{ inputs.max_files }}" ]; then extra=(--max-files "${{ inputs.max_files }}"); fi
          cargo run -p omegaflow-harvest --release --bin noaa_dcdb_bathymetry_compiler -- \
            --date "${{ inputs.date }}" "${extra[@]}" --out "${{ inputs.asset }}" \
            --lsk kernels/naif0012.tls --ci-mode
