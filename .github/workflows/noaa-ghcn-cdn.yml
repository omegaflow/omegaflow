name: noaa-ghcn-cdn

concurrency:
  group: noaa-ghcn-assets
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      station:
        description: GHCN-D station id (e.g. USW00094728)
        required: true
        type: string
        default: USW00094728
      year:
        description: harvest year
        required: true
        type: string
        default: "2025"
      month:
        description: harvest month (blank = whole year)
        required: false
        type: string
        default: "03"
      asset:
        description: output asset name on the CDN (netloc noaa-ghcn-pds.s3.amazonaws.com)
        required: true
        type: string
        default: ghcn_d_USW00094728_2025-03.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  noaa-ghcn:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view noaa-ghcn-pds.s3.amazonaws.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
            exit 0
          fi
          echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
      - name: Compile the GHCN-D daily station series and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          extra=()
          if [ -n "${{ inputs.month }}" ]; then extra=(--month "${{ inputs.month }}"); fi
          cargo run -p omegaflow-harvest --release --bin noaa_ghcn_compiler -- \
            --station "${{ inputs.station }}" --year "${{ inputs.year }}" \
            "${extra[@]}" --out "${{ inputs.asset }}" \
            --lsk kernels/naif0012.tls --ci-mode
