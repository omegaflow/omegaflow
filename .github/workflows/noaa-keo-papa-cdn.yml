name: noaa-keo-papa-cdn
on:
  workflow_dispatch:
    inputs:
      key:
        description: KEO/PAPA bucket key (classic netCDF, e.g. KEO/OS_KEO_200406_M_TSVMBP_32N145E_dy.nc)
        required: true
        type: string
        default: KEO/OS_KEO_200406_M_TSVMBP_32N145E_dy.nc
      asset:
        description: output asset name on the CDN (netloc noaa-oar-keo-papa-pds.s3.amazonaws.com)
        required: true
        type: string
        default: keo_OS_KEO_200406_M_TSVMBP_32N145E_dy.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  noaa-keo-papa:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view noaa-oar-keo-papa-pds.s3.amazonaws.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
            exit 0
          fi
          echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
      - name: Compile the KEO/PAPA mooring series and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin noaa_keo_papa_compiler -- \
            --key "${{ inputs.key }}" --out "${{ inputs.asset }}" \
            --lsk kernels/naif0012.tls --ci-mode
