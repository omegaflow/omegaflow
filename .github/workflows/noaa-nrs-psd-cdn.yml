name: noaa-nrs-psd-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  noaa-nrs-psd:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view storage.googleapis.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "noaa_nrs_psd.bin"; then
            echo "asset noaa_nrs_psd.bin already present — manifest skipped"
            exit 0
          fi
          echo "asset noaa_nrs_psd.bin missing — compiling and manifesting"
      - name: Compile NOAA NRS passive-acoustic PSD rows and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin noaa_nodd_bucket_harvester -- \
            --emit-bin noaa_nrs_psd.bin --lsk kernels/naif0012.tls --days 1 \
            --prefix nrs/products/sound_level_metrics/ --ci-mode
