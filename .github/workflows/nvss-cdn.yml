name: nvss-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
  OMEGAFLOW_TAP_TIMEOUT: "1800"
jobs:
  nvss:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Chunk-compile NVSS (8 RA-slices) and upload to CDN
        run: |
          mkdir -p kernels
          for lo in $(seq 0 45 315); do
            hi=$(awk "BEGIN{print $lo+45}")
            out="kernels/nvss_c${lo}.json"
            [ -s "$out" ] && continue
            for attempt in 1 2 3; do
              cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
                --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
                --table "VIII/65/nvss" \
                --columns 'name:NVSS;ra:RAJ2000;dec:DEJ2000;flux:S1.4' \
                --crossmatch-z 'V/154/sdss16:RA_ICRS:DE_ICRS:zsp' \
                --xmatch-radius 10 \
                --skip-null flux \
                --skip-null z \
                --async 9000 --limit 300000 \
                --where "t.\"RAJ2000\" >= ${lo} AND t.\"RAJ2000\" < ${hi}" \
                --out "$out" && break
              sleep 60
            done
            [ -s "$out" ] || { echo "slice ${lo} returned void"; exit 1; }
          done
          jq -s 'add' kernels/nvss_c*.json > nvss.json
          gh release upload ssd.jpl.nasa.gov-nvss nvss.json --clobber --repo omegaflow/sources \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: nvss returned void" \
                 "nvss chunk compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
