name: omni-hro-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      decimate-min:
        description: decimation bucket width in minutes (1 = 1-min, 60 = hourly)
        required: true
        type: string
        default: "60"
      asset:
        description: output asset name on the CDN (netloc cdaweb.gsfc.nasa.gov)
        required: true
        type: string
        default: omni_hro_1min.bin
      window-start:
        description: harvest window start (YYYY-MM-DD)
        required: false
        type: string
        default: "1981-01-01"
      window-end:
        description: harvest window end (YYYY-MM-DD)
        required: false
        type: string
        default: "2026-09-03"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  omni-hro:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view cdaweb.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
          fi
      - name: Compile OMNI HRO 1-min series and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin omni_hro_compiler -- \
            --lsk kernels/naif0012.tls --out "${{ inputs.asset }}" --ci-mode \
            --window-start "${{ inputs.window-start }}" --window-end "${{ inputs.window-end }}" \
            --decimate-min "${{ inputs.decimate-min }}" --jobs 8
