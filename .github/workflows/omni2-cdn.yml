name: omni2-cdn
on:
  workflow_dispatch:
    inputs:
      decimate-min:
        description: decimation bucket width in minutes (60 = hourly, 1440 = daily)
        required: true
        type: string
        default: "1440"
      asset:
        description: output asset name on the CDN (netloc ssd.jpl.nasa.gov)
        required: true
        type: string
        default: omni2_serie.bin
      window-start:
        description: harvest window start (YYYY-MM-DD)
        required: false
        type: string
        default: "1963-01-01"
      window-end:
        description: harvest window end (YYYY-MM-DD)
        required: false
        type: string
        default: "2026-08-06"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  omni2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view ssd.jpl.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
            exit 0
          fi
          echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
      - name: Compile OMNI2 series and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin omni2_compiler -- \
            --lsk kernels/naif0012.tls --out "${{ inputs.asset }}" --ci-mode \
            --window-start "${{ inputs.window-start }}" --window-end "${{ inputs.window-end }}" \
            --decimate-min "${{ inputs.decimate-min }}" --jobs 8
