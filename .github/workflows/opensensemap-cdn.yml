name: opensensemap-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  opensensemap:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the api.opensensemap.org release exists on the CDN
        run: |
          if ! gh release view api.opensensemap.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create api.opensensemap.org --repo omegaflow/sources \
              --title "api.opensensemap.org" \
              --notes "openSenseMap Lufttemperatur (°C, thermal): /boxes listet lastMeasurement-IDs, Wert per /boxes/:id -> sensors[N].value (N variabel, title+unit-Match). Compiled to GeoRec records (ICRS surface, medium thermal). Magic OSM1."
          fi
      - name: Compiler tests
        run: cargo test -p omegaflow-harvest --release --bin opensensemap_compiler
      - name: Compile the openSenseMap temperature records and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin opensensemap_compiler -- \
            --out opensensemap_temperatur.bin --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "opensensemap-cdn: opensensemap_temperatur.bin returned void" \
                 "opensensemap compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
