name: osm-pbf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  osm-pbf:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view download.geofabrik.de --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "monaco_nodes.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset monaco_nodes.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset monaco_nodes.bin missing — compiling and manifesting"
          fi
      - name: Ensure the download.geofabrik.de release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view download.geofabrik.de --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create download.geofabrik.de --repo omegaflow/sources \
              --title "download.geofabrik.de" \
              --notes "OSM PBF node coordinates compiled to a typed bin asset (CDN tag = netloc)"
          fi
      - name: Compile and manifest the OSM Monaco node coordinates to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin osm_pbf_compiler -- \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "osm-pbf-cdn: monaco_nodes compile returned void" \
                 "osm pbf compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
