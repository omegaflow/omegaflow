name: Pages — Landing + Binaries
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: omegaflow_linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: omegaflow_windows.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: omegaflow_macos_intel
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: omegaflow_macos_arm64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: omegaflow_linux_arm64
    steps:
    - uses: actions/checkout@v4
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ matrix.target }}
    - run: cargo build --release --target ${{ matrix.target }}
    - run: |
        BIN="target/${{ matrix.target }}/release/omegaflow"
        if [ -f "$BIN" ]; then cp "$BIN" "${{ matrix.artifact }}"; fi
        if [ -f "$BIN.exe" ]; then cp "$BIN.exe" "${{ matrix.artifact }}"; fi
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.artifact }}

  probe:
    runs-on: ubuntu-latest
    steps:
    - run: dd if=/dev/urandom of=probe_64k.bin bs=1024 count=64
    - uses: actions/upload-artifact@v4
      with:
        name: probe
        path: probe_64k.bin

  termux:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: omegaflow_linux_arm64
    - run: |
        BOOTSTRAP_URL="https://github.com/termux/termux-packages/releases/download/bootstrap-2025.12.27-r1/bootstrap-aarch64.zip"
        curl -sS -L -o bootstrap.zip "$BOOTSTRAP_URL"
        mkdir -p _termux
        cd _termux
        unzip -q ../bootstrap.zip
        cp ../omegaflow_linux_arm64 SYMLINKS/usr/bin/omegaflow
        chmod 755 SYMLINKS/usr/bin/omegaflow
        zip -qr9 ../omegaflow_termux_bootstrap.zip .
        cd ..
        ls -lh omegaflow_termux_bootstrap.zip
    - uses: actions/upload-artifact@v4
      with:
        name: termux-bootstrap
        path: omegaflow_termux_bootstrap.zip

  pages:
    needs: [build, probe, termux]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        pattern: '*'
        merge-multiple: true
        path: _site
    - run: |
        cp static/landing.html _site/index.html
        cp CNAME _site/CNAME 2>/dev/null || true
        cd _site
        dd if=/dev/zero of=omegaflow_sources.tar.gz bs=1 count=0 2>/dev/null || true
        ls -lh .
    - uses: actions/configure-pages@v4
    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site
    - uses: actions/deploy-pages@v4
      id: deployment
