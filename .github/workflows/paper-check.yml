name: paper-check

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    paths:
      - 'docs/paper/**'
      - 'docs/blatt/**'
      - 'tools/science/src/bin/export_latex.rs'
      - 'tools/register/src/bin/reference_verify.rs'
      - 'tools/science/src/bin/paper_new.rs'
      - '.github/workflows/paper-check.yml'
  pull_request:
    paths:
      - 'docs/paper/**'
      - 'docs/blatt/**'
      - 'tools/science/src/bin/export_latex.rs'
      - 'tools/register/src/bin/reference_verify.rs'
      - 'tools/science/src/bin/paper_new.rs'
      - '.github/workflows/paper-check.yml'
  workflow_dispatch:
permissions:
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Export gate (title, abstract, numbers, sha)
      run: cargo run -q -p omegaflow-science --bin export_latex -- --check
    - name: Export gate over Ein-Blatt sheets (docs/blatt)
      run: |
        if ls docs/blatt/*.md >/dev/null 2>&1; then
          cargo run -q -p omegaflow-science --bin export_latex -- --check docs/blatt/*.md
        fi
    - name: Export the papers to LaTeX (write step)
      run: cargo run -q -p omegaflow-science --bin export_latex
    - name: Provision Tectonic (static musl, sha-pinned)
      run: |
        curl -fsSL -o /tmp/tectonic.tar.gz \
          "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%400.17.0/tectonic-0.17.0-x86_64-unknown-linux-musl.tar.gz"
        echo "8533d07f9ccbd7a65824b9e0459041bca34af1eb33daba48f59215593753a3b7  /tmp/tectonic.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/.local/bin"
        tar xzf /tmp/tectonic.tar.gz -C "$HOME/.local/bin"
        "$HOME/.local/bin/tectonic" --version
    - name: Render the exported papers to PDF
      run: |
        shopt -s nullglob
        for tex in docs/paper/export/*.tex; do
          "$HOME/.local/bin/tectonic" --outdir docs/paper/export "$tex"
        done
    - name: Reference gate (arXiv, DOI)
      run: cargo run -q -p omegaflow-register --bin reference_verify
    - if: failure()
      run: |
        bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
          "paper gate: a paper carries a named difference" \
          "Paper Gate failed on ${{ github.sha }} — a paper carries a title >75, an abstract >200, a number DIFF, a sha mismatch, or an absent/pending reference." \
          paper-check
