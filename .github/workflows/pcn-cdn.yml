name: pcn-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'PCN definitive year (DTU WDC)'
        type: string
        default: '2015'
  push:
    paths:
      - 'tools/harvest/src/bin/pcn_compiler.rs'
      - '.github/workflows/pcn-cdn.yml'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  pcn:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the ftp.space.dtu.dk release exists on the CDN
        run: |
          if ! gh release view ftp.space.dtu.dk --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create ftp.space.dtu.dk --repo omegaflow/sources \
              --title "ftp.space.dtu.dk" \
              --notes "DTU WDC polar cap index (PCN, IAGA-2002, mV/m) compiled to omegaflow PCN1 binary assets (CDN tag = netloc)"
          fi
      - name: Compile and manifest the DTU PCN definitive index
        run: |
          set -euo pipefail
          year="${{ inputs.year }}"; [ -n "$year" ] || year="2015"
          out="pcn_${year}.bin"
          if gh release view ftp.space.dtu.dk --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "$out"; then
            echo "asset $out already present — manifest skipped"
            exit 0
          fi
          cargo run --release -p omegaflow-harvest --bin pcn_compiler -- \
            --year "$year" --out "data/ftp.space.dtu.dk/$out" --ci-mode
