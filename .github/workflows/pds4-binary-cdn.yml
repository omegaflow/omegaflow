name: pds4-binary-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  pds4-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view archives.esac.esa.int --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -Eq "^pds4_(binary|fixed_width)_"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset pds4_binary_*/pds4_fixed_width_* already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset pds4_binary_*/pds4_fixed_width_* missing — compiling and manifesting"
          fi
      - name: Compile and manifest the PDS4 table products (Table_Binary / Table_Character) to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin pds4_binary_compiler -- --ci-mode
