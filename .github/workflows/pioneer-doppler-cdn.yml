name: pioneer-doppler-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  pioneer-doppler:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the NAVIO full-mission ASCII doppler (p10 SC_23, p11 SC_24) once and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin pioneer_doppler_compiler -- --ci-mode
