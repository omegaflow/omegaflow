name: pioneer-telemetry-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  pioneer-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile the Pioneer-10 telemetry sets (Turyshev20170327) once and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern pioneer10_telemetry.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin pioneer_telemetry_compiler -- \
              --lsk kernels/naif0012.tls --out pioneer10_telemetry.bin --ci-mode
