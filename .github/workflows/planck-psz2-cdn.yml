name: planck-psz2-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  planck-psz2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view irsa.ipac.caltech.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "planck_psz2_sz_mmf3.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset planck_psz2_sz_mmf3.json already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset planck_psz2_sz_mmf3.json missing — compiling and manifesting"
          fi
      - name: Compile the PSZ2 SZ catalogue (mmf3 + union redshift crossmatch) and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin planck_psz2_compiler -- \
            --out planck_psz2_sz_mmf3.json --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "planck-psz2-cdn: planck_psz2_sz_mmf3 compile returned void" \
                 "planck_psz2_sz_mmf3 compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
