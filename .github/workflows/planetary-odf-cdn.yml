name: planetary-odf-cdn

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  odf:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"juno_odf_compiler","netloc":"atmos.nmsu.edu","asset":"juno_odf.bin"},
          {"bin":"juno_odf_compiler","netloc":"atmos.nmsu.edu","asset":"juno_ocru_odf.bin","args":"--volume jnogrv_0001 --out data/atmos.nmsu.edu/juno_ocru_odf.bin"},
          {"bin":"magellan_odf_compiler","netloc":"pds-geosciences.wustl.edu","asset":"magellan_odf.bin"},
          {"bin":"pathfinder_odf_compiler","netloc":"pds-geosciences.wustl.edu","asset":"pathfinder_odf.bin"},
          {"bin":"mgs_odf_compiler","netloc":"pds-geosciences.wustl.edu","asset":"mgs_odf.bin"},
          {"bin":"mro_odf_compiler","netloc":"pds-geosciences.wustl.edu","asset":"mro_odf.bin","sharded":true,"prefix":"mro_odf","timeout":350},
          {"bin":"odyssey_odf_compiler","netloc":"pds-geosciences.wustl.edu","asset":"odyssey_odf.bin","sharded":true,"prefix":"odyssey_odf"},
          {"bin":"messenger_odf_compiler","netloc":"pds-ppi.igpp.ucla.edu","asset":"messenger_odf.bin"},
          {"bin":"mars_express_odf_compiler","netloc":"archives.esac.esa.int","asset":"mars_express_odf.bin"},
          {"bin":"rosetta_odf_compiler","netloc":"archives.esac.esa.int","asset":"rosetta_odf.bin","sharded":true,"prefix":"rosetta_odf","timeout":350}
        ]
