name: planetary-odf-cdn

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  odf:
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.netloc }}-${{ matrix.asset }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout || 240 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bin: juno_odf_compiler, netloc: atmos.nmsu.edu, asset: juno_odf.bin }
          - { bin: juno_odf_compiler, netloc: atmos.nmsu.edu, asset: juno_ocru_odf.bin, args: "--volume jnogrv_0001 --out data/atmos.nmsu.edu/juno_ocru_odf.bin" }
          - { bin: magellan_odf_compiler, netloc: pds-geosciences.wustl.edu, asset: magellan_odf.bin }
          - { bin: mgs_odf_compiler, netloc: pds-geosciences.wustl.edu, asset: mgs_odf.bin }
          - { bin: mro_odf_compiler, netloc: pds-geosciences.wustl.edu, asset: mro_odf.bin, sharded: true, prefix: mro_odf, timeout: 350 }
          - { bin: odyssey_odf_compiler, netloc: pds-geosciences.wustl.edu, asset: odyssey_odf.bin, sharded: true, prefix: odyssey_odf }
          - { bin: messenger_odf_compiler, netloc: pds-ppi.igpp.ucla.edu, asset: messenger_odf.bin }
          - { bin: mars_express_odf_compiler, netloc: archives.esac.esa.int, asset: mars_express_odf.bin }
          - { bin: rosetta_odf_compiler, netloc: archives.esac.esa.int, asset: rosetta_odf.bin, timeout: 350 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the ${{ matrix.asset }} ODF volume and manifest it to the CDN
        run: |
          if [ "${{ matrix.sharded }}" = "true" ]; then
            expected=$(grep -oE "releases/download/${{ matrix.netloc }}/${{ matrix.prefix }}(_t[0-9]+_[0-9]+(_[0-9]+)?)?\.bin" phi/sources.φ \
              | xargs -r -n1 basename | sort -u)
            if [ -z "$expected" ]; then
              echo "no ${{ matrix.prefix }} shards registered — harvest runs (an unharvested volume is pending, not zero)"
            else
              present=$(gh release view ${{ matrix.netloc }} --repo omegaflow/sources \
                --json assets --jq '.assets[]?.name' 2>/dev/null | sort -u)
              missing=$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$present"))
              if [ -z "$missing" ]; then
                echo "$(printf '%s\n' "$expected" | wc -l) registered ${{ matrix.prefix }} shards, all present in release — manifest complete"
                exit 0
              fi
              echo "missing from release: $(printf '%s\n' "$missing" | tr '\n' ' ')"
            fi
          elif gh release view ${{ matrix.netloc }} --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ matrix.asset }}"; then
            echo "${{ matrix.asset }} already present — harvest skipped"
            exit 0
          fi
          cargo run --release -p omegaflow-harvest --bin ${{ matrix.bin }} -- --ci-mode ${{ matrix.args }}
