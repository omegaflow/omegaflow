name: planeto-epncore-cdn

concurrency:
  group: planeto-epncore-cdn
  cancel-in-progress: false

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings

jobs:
  planeto-epncore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Mirror the planeto mars_craters epn_core query 1:1 onto the CDN void path
        run: |
          cargo build -p omegaflow-harvest --release --bin cdn_mirror_compiler
          ./target/release/cdn_mirror_compiler --ci-mode \
            --url 'http://voparis-tap-planeto.obspm.fr/tap/sync?REQUEST=doQuery&LANG=ADQL&FORMAT=json&QUERY=SELECT+TOP+5000+target_name,c1min,c1max,c2min,c2max,diameter+FROM+mars_craters.epn_core+WHERE+diameter+IS+NOT+NULL'
