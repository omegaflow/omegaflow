name: poes19-meped-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  poes19-meped:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view cdaweb.gsfc.nasa.gov --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "poes19_meped.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset poes19_meped.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset poes19_meped.bin missing — compiling and manifesting"
          fi
      - name: Ensure the cdaweb.gsfc.nasa.gov release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view cdaweb.gsfc.nasa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create cdaweb.gsfc.nasa.gov --repo omegaflow/sources \
              --title "cdaweb.gsfc.nasa.gov" \
              --notes "CDAWeb anonymous channels compiled to omegaflow typed bins (CDN tag = netloc)"
          fi
      - name: Fetch the POES-19 MEPED daily CDF and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin poes19_meped_compiler -- \
            --url 'https://cdaweb.gsfc.nasa.gov/pub/data/noaa/noaa19/sem2_fluxes-2sec/2025/noaa19_poes-sem2_fluxes-2sec_20250330_v01.cdf' \
            --out poes19_meped.bin \
            --ci-mode
