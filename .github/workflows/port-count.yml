name: port-count

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Convert the source register and count the pending
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow -- --port "phi/sources.φ" /tmp/sources_port.φ
            echo "--- pending field lines ---"
            awk '/^# pending/{n++} END{print n+0}' /tmp/sources_port.φ
            echo "--- pending blocks / total blocks ---"
            awk '/^url /{if(p>0)c++; b++; p=0} /^# pending/{p++} END{if(p>0)c++; print (c+0) " of " (b+0)}' /tmp/sources_port.φ
          } > port-count.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: port-count
          path: port-count.txt
