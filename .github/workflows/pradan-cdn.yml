name: pradan-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      url:
        description: Concrete PRADAN Ch2 file URL (…/ch2_{payload}_l1_{YYYY}_{MM}.zip); leave empty with latest=true
        required: false
        type: string
        default: ""
      latest:
        description: Resolve the newest month-wise product from the login-gated catalog and download it
        required: false
        type: boolean
        default: false
      out:
        description: Output path (default data/pradan.issdc.gov.in/<resolved file name>)
        required: false
        type: string
        default: ""
      timeout:
        description: curl --max-time seconds for the login POST (default 3600)
        required: false
        type: string
        default: ""
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  PRADAN_USER: ${{ secrets.PRADAN_USER }}
  PRADAN_PASS: ${{ secrets.PRADAN_PASS }}
  RUSTFLAGS: -D warnings
jobs:
  pradan-ch2:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Resolve the asset name and idempotence — skip if it already rests on the CDN
        id: idempotence
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_OUT: ${{ inputs.out }}
        run: |
          if [ -n "$INPUT_URL" ]; then
            filename="${INPUT_URL##*/}"
          elif [ "$INPUT_LATEST" = "true" ]; then
            cargo run -p omegaflow-harvest --release --bin pradan_ch2_compiler -- --list > pradan_list.txt
            filename="$(awk -F'[= ]' '/^file=/{f=$2} END{print f}' pradan_list.txt)"
            if [ -z "$filename" ]; then
              echo "::error::pradan_ch2_compiler --list resolved no month-wise product"
              exit 1
            fi
          else
            echo "::error::either url or latest=true is required"
            exit 1
          fi
          out="${INPUT_OUT:-data/pradan.issdc.gov.in/$filename}"
          echo "out=$out" >> "$GITHUB_OUTPUT"
          echo "asset=$filename" >> "$GITHUB_OUTPUT"
          if gh release view pradan.issdc.gov.in --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "$filename"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset $filename already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset $filename missing — compiling and manifesting"
          fi
      - name: Ensure the pradan.issdc.gov.in release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pradan.issdc.gov.in --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pradan.issdc.gov.in --repo omegaflow/sources \
              --title "pradan.issdc.gov.in" \
              --notes "ISRO/ISSDC PRADAN protected downloads (Keycloak OIDC login) mirrored as the raw ch2_{payload}_l1_{YYYY}_{MM}.zip (CDN tag = netloc)."
          fi
      - name: Download the login-gated Ch2 zip through the Keycloak OIDC flow
        if: steps.idempotence.outputs.present == 'false'
        env:
          INPUT_URL: ${{ inputs.url }}
          INPUT_LATEST: ${{ inputs.latest }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          OUT: ${{ steps.idempotence.outputs.out }}
        run: |
          if [ "$INPUT_LATEST" = "true" ] && [ -z "$INPUT_URL" ]; then
            args=(--latest --out "$OUT")
          else
            args=(--url "$INPUT_URL" --out "$OUT")
          fi
          if [ -n "$INPUT_TIMEOUT" ]; then
            args+=(--timeout-s "$INPUT_TIMEOUT")
          fi
          cargo run -p omegaflow-harvest --release --bin pradan_ch2_compiler -- "${args[@]}" \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "pradan-cdn: Ch2 download returned void" \
                 "pradan_ch2_compiler returned void for url='$INPUT_URL' latest='$INPUT_LATEST'. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
      - name: Upload the downloaded zip to the CDN
        if: steps.idempotence.outputs.present == 'false'
        env:
          OUT: ${{ steps.idempotence.outputs.out }}
        run: |
          gh release upload pradan.issdc.gov.in "$OUT" --clobber --repo omegaflow/sources
