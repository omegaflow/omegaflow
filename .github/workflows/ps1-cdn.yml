name: ps1-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ps1-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the PS1 DR2 survey-footprint coverage asset once and upload to CDN
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern ps1_dr2_coverage.fp01 --clobber 2>/dev/null || \
          cargo run -p omegaflow-harvest --release --bin ps1_coverage_compiler -- \
            --out ps1_dr2_coverage.fp01 --full --ci-mode
