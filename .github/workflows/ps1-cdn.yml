name: ps1-cdn
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: ps1-cdn
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  ps1-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Auto-resume chunked PS1 DR2 harvest (one subcell chunk per step)
        run: |
          cargo build -p omegaflow-harvest --release --bin ps1_coverage_compiler --bin ps1_coverage_combiner
          band_min=637
          band_max=2643
          sub_min=0
          sub_max=99
          chunk=10
          budget_s=5400
          deadline=$(( $(date +%s) + budget_s ))
          parts=$(gh release view ssd.jpl.nasa.gov --repo omegaflow/sources \
            --json assets --jq '.assets[]|select(.name|startswith("ps1_part_"))|.name' 2>/dev/null || true)
          finished_all=1
          # harvest from the south edge upward; each band splits into subcell chunks,
          # one undone chunk per step, the deadline checked between chunks
          P=$band_min
          while [ "$P" -le "$band_max" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              finished_all=0
              break
            fi
            if echo "$parts" | grep -qx "ps1_part_${P}.fp01"; then
              P=$((P+1))
              continue
            fi
            s=$sub_min
            while [ "$s" -le "$sub_max" ]; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                finished_all=0
                break 2
              fi
              e=$(( s + chunk - 1 ))
              [ "$e" -gt "$sub_max" ] && e=$sub_max
              name="ps1_part_${P}_${s}_${e}.fp01"
              if echo "$parts" | grep -qx "$name"; then
                s=$((e+1))
                continue
              fi
              echo "=== harvesting projcell band ${P} subcell ${s}..${e} ==="
              if ./target/release/ps1_coverage_compiler --full --proj-min "${P}" --proj-max "${P}" \
                  --sub-min "${s}" --sub-max "${e}" --out "$name" --ci-mode; then
                echo "uploaded ${name}"
                parts="${parts}"$'\n'"${name}"
              else
                echo "chunk ${name} void this run — the hourly schedule retries it"
                finished_all=0
                break 2
              fi
              s=$((e+1))
            done
            P=$((P+1))
          done
          # combine when the whole span is covered and the final asset is absent
          has_final=$(gh release view ssd.jpl.nasa.gov --repo omegaflow/sources \
            --json assets --jq '[.assets[]?.name|select(.=="ps1_dr2_coverage.fp01")]|length' 2>/dev/null || echo 0)
          if [ "$finished_all" = "1" ] && [ "$has_final" = "0" ]; then
            echo "=== combining ==="
            mkdir -p parts
            gh release download ssd.jpl.nasa.gov -p "ps1_part_*.fp01" --repo omegaflow/sources --dir parts --clobber
            ./target/release/ps1_coverage_combiner --parts-dir parts --out ps1_dr2_coverage.fp01 \
              --expect-min "$band_min" --expect-max "$band_max"
            gh release upload ssd.jpl.nasa.gov ps1_dr2_coverage.fp01 --clobber --repo omegaflow/sources
            echo "ps1_dr2_coverage.fp01 uploaded: $(stat -c%s ps1_dr2_coverage.fp01) bytes"
          else
            echo "combine not reached this run: finished_all=${finished_all}, final present=${has_final}"
          fi
