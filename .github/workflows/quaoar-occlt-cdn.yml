name: quaoar-occlt-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  quaoar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view zenodo.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "quaoar_occlt.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset quaoar_occlt.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset quaoar_occlt.bin missing — compiling and manifesting"
          fi
      - name: Ensure the zenodo.org release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view zenodo.org --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create zenodo.org --repo omegaflow/sources \
              --title "zenodo.org" \
              --notes "Zenodo research-dataset records packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile the Quaoar occultation light curves and manifest the bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin quaoar_occlt_compiler -- --ci-mode
