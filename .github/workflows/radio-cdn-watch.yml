name: radio-cdn-watch

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '13 6 * * *'
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Watch the radio catalog assets
        run: |
          base=https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov
          loaded=""
          missing=""
          for a in nvss first14 chandra_csc; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$base/$a.json")
            echo "$a.json: $code"
            if [ "$code" = "200" ]; then
              loaded="$loaded $a"
            else
              missing="$missing $a"
            fi
          done
          if [ -z "$missing" ]; then
            bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
              "radio-cdn: the three radio catalogues are on the CDN — harvest unblocked" \
              "nvss.json, first14.json and chandra_csc.json carry 200 on the CDN (ssd.jpl.nasa.gov). Follow-up: strike the TODO item 'catalogue CDN harvest NVSS/FIRST/Chandra' and move handover-2026-08-23-katalog-cdn-ernte.md to archive/handover/." \
              health
          elif [ -n "$loaded" ]; then
            bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
              "radio-cdn: partial load of the radio catalogues" \
              "Partial load on the CDN (ssd.jpl.nasa.gov): loaded$loaded; still missing$missing. The next kernel-flatten run retries the missing assets (continue-on-error)." \
              health
          fi
