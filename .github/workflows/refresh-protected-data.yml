name: Refresh Protected Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CATALOGS_REPO: ${{ secrets.CATALOGS_REPO || 'omegaflow/sources' }}
      GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: eBird
        env:
          EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
        run: |
          mkdir -p data
          if [ -z "$EBIRD_API_KEY" ]; then
            echo "::notice::eBird skipped (no EBIRD_API_KEY)"
            exit 0
          fi
          points=("52.5 13.4" "51.5 -0.1" "48.9 2.35" "40.7 -74.0" "37.7 -122.4" "49.3 -123.1" "-3.1 -60.0" "-0.2 -78.5" "-1.3 36.8" "-33.9 18.4" "6.5 3.4" "1.35 103.8" "28.6 77.2" "35.7 139.7" "22.3 114.2" "-33.9 151.2" "-36.85 174.76")
          i=0
          for pt in "${points[@]}"; do
            read -r la lo <<< "$pt"
            code=$(curl -sS --retry 2 --fail -o "data/ebird_part_${i}.json" -w "%{http_code}" \
              -H "X-eBirdApiToken: $EBIRD_API_KEY" \
              "https://api.ebird.org/v2/data/obs/geo/recent?lat=${la}&lng=${lo}&dist=50&back=1&maxResults=500") || true
            echo "eBird point $i: HTTP ${code:-fail}"
            sleep 1
            i=$((i + 1))
          done
          files=()
          for f in data/ebird_part_*.json; do
            [ -s "$f" ] && files+=("$f")
          done
          echo "eBird ok files: ${#files[@]}"
          if [ "${#files[@]}" -gt 0 ]; then
            jq -s 'add' "${files[@]}" \
              | jq '[.[] | select(.lat != null and .lng != null) | {lat, lon, speciesCode, howMany: (.howMany // 1), obsDt}]' \
              > data/ebird_recent.json
          fi
          ls -l data/ebird_recent.json 2>/dev/null || echo "no ebird_recent.json"
          rm -f data/ebird_part_*.json

      - name: OpenAQ
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: |
          if [ -z "$OPENAQ_API_KEY" ]; then
            echo "::notice::OpenAQ skipped (no OPENAQ_API_KEY)"
            exit 0
          fi
          for spec in "2:pm25" "1:pm10"; do
            pid="${spec%%:*}"
            pname="${spec##*:}"
            curl -s --fail -H "X-API-Key: $OPENAQ_API_KEY" \
              "https://api.openaq.org/v3/parameters/${pid}/latest?limit=1000" \
              -o "data/openaq_tmp.json" && \
              jq '[.results[] | select(.value != null and .coordinates != null)
                | {lat: .coordinates.latitude, lon: .coordinates.longitude, value, lastUpdated: .datetime.utc}]' \
                data/openaq_tmp.json > "data/openaq_${pname}.json" || true
          done
          rm -f data/openaq_tmp.json

      - name: FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::notice::FIRMS skipped (no FIRMS_MAP_KEY)"
            exit 0
          fi
          curl -s --fail \
            "https://firms.modaps.eosdis.nasa.gov/api/area/csv/${FIRMS_MAP_KEY}/VIIRS_SNPP_NRT/world/1" \
            -o data/firms_viirs_nrt_world.csv || true
          curl -s --fail \
            "https://firms.modaps.eosdis.nasa.gov/api/area/csv/${FIRMS_MAP_KEY}/MODIS_NRT/world/1" \
            -o data/firms_modis_nrt_world.csv || true

      - name: Earthdata CMR granules
        env:
          EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
        run: |
          if [ -z "$EARTHDATA_EDL_TOKEN" ]; then
            echo "::notice::CMR skipped (no EARTHDATA_EDL_TOKEN)"
            exit 0
          fi
          for sn in GEDI02_A ATL06 ATL03 SWOT_L2_LR_SSH_D VNP14IMG_NRT; do
            curl -s --fail -H "Authorization: Bearer $EARTHDATA_EDL_TOKEN" \
              "https://cmr.earthdata.nasa.gov/search/granules.json?short_name=${sn}&page_size=2000&sort_key=-start_date" \
              -o "data/cmr_${sn}.json" || true
          done


      - name: USGS Water
        env:
          USGS_WATER_KEY: ${{ secrets.USGS_WATER_KEY }}
        run: |
          if [ -z "$USGS_WATER_KEY" ]; then
            echo "::notice::USGS Water skipped (no USGS_WATER_KEY)"
            exit 0
          fi
          curl -s --fail -H "api_key: $USGS_WATER_KEY" \
            "https://api.waterdata.usgs.gov/ogcapi/v0/collections/daily/items?limit=100&bbox=-125,24,-66,50" \
            -o data/usgs_water_daily.json || true

      - name: NOAA CDO
        env:
          NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN }}
        run: |
          if [ -z "$NOAA_CDO_TOKEN" ]; then
            echo "::notice::NOAA CDO skipped (no NOAA_CDO_TOKEN)"
            exit 0
          fi
          curl -sS --fail --max-time 120 -H "token: $NOAA_CDO_TOKEN" \
            "https://www.ncdc.noaa.gov/cdo-web/api/v2/stations?datasetid=GHCND&limit=1000" \
            | jq '[.results[] | select(.latitude != null and .longitude != null)
              | {lat: .latitude, lon: .longitude, name, elevation, datacoverage, station_id: .id}]' \
            > data/noaa_ghcnd_stations.json || true

      - name: NOAA CDO daily
        env:
          NOAA_CDO_TOKEN: ${{ secrets.NOAA_CDO_TOKEN }}
        run: |
          if [ -z "$NOAA_CDO_TOKEN" ]; then
            echo "::notice::NOAA CDO daily skipped (no NOAA_CDO_TOKEN)"
            exit 0
          fi
          : > /tmp/stations.tsv
          for c in US CA MX BR AR UK GM FR IT SP JA CH IN AS SF EG NI KE ID RS AY NO SW FI DA IC NL PL GR TU KS TH VM RP NZ EI PO; do
            curl -sS --fail --max-time 30 -H "token: $NOAA_CDO_TOKEN" \
              "https://www.ncei.noaa.gov/cdo-web/api/v2/stations?datasetid=GHCND&locationid=FIPS:${c}&sortfield=maxdate&sortorder=desc&limit=6" \
              | jq -r '.results[]? | [.id, (.name | gsub("\t";" ")), .latitude, .longitude, .maxdate] | @tsv'
          done >> /tmp/stations.tsv
          awk -F'\t' '$5 >= "2026-06-01"' /tmp/stations.tsv > /tmp/stations_active.tsv
          START=$(date -u -d '8 days ago' +%F)
          END=$(date -u +%F)
          : > /tmp/cdo_data.tsv
          cut -f1 /tmp/stations_active.tsv | xargs -n 40 | while read -r ids; do
            IDS=$(printf '%s\n' "$ids" | tr ' ' '\n' | sed 's/^/stationid=/' | paste -sd'&' -)
            curl -g -sS --fail --max-time 90 -H "token: $NOAA_CDO_TOKEN" \
              "https://www.ncei.noaa.gov/cdo-web/api/v2/data?datasetid=GHCND&${IDS}&datatypeid=TMAX,TMIN,PRCP&startdate=${START}&enddate=${END}&limit=1000" \
              | jq -r '.results[]? | [.station, .date[0:10], .datatype, .value] | @tsv'
          done >> /tmp/cdo_data.tsv
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t")) | map({station: .[0], name: .[1], lat: (.[2] | tonumber), lon: (.[3] | tonumber)})' /tmp/stations_active.tsv > /tmp/stations.json
          jq -R -s 'split("\n") | map(select(length > 0) | split("\t")) | map({station: .[0], date: .[1], datatype: .[2], value: (.[3] | tonumber)}) | group_by(.station) | map(. as $r | {station: $r[0].station, date: ($r | map(.date) | max), dtypes: ($r | map({(.datatype): .value}) | add)}) | map({station, date, tmax: .dtypes.TMAX, tmin: .dtypes.TMIN, prcp: .dtypes.PRCP})' /tmp/cdo_data.tsv > /tmp/cdo_data.json
          jq -s '(.[0] | map({(.station): {lat: .lat, lon: .lon, name: .name}}) | add) as $smap | (.[1] | map(select(.station | in($smap)) | . + $smap[.station]) | map(select(.tmax != null or .tmin != null) | {lat, lon, name, date, tmax_c: (if .tmax != null then .tmax / 10 else null end), tmin_c: (if .tmin != null then .tmin / 10 else null end), prcp_mm: (if .prcp != null then .prcp / 10 else null end)}))' /tmp/stations.json /tmp/cdo_data.json > data/noaa_cdo_daily.json || true
          rm -f /tmp/stations.tsv /tmp/stations_active.tsv /tmp/cdo_data.tsv /tmp/stations.json /tmp/cdo_data.json

      - name: Ocean Networks Canada
        env:
          OCEANNETWORKS_TOKEN: ${{ secrets.OCEANNETWORKS_TOKEN }}
        run: |
          if [ -z "$OCEANNETWORKS_TOKEN" ]; then
            echo "::notice::Ocean Networks skipped (no OCEANNETWORKS_TOKEN)"
            exit 0
          fi
          curl -sS --fail --max-time 60 -H "Authorization: Bearer $OCEANNETWORKS_TOKEN" \
            "https://data.oceannetworks.ca/api/locations?method=getLocations" \
            | jq '[.[] | select(.lat != null and .lon != null) | {lat, lon, deployments, depth}]' \
            > data/oceannetworks_sites.json || true

      - name: EIA grid
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          if [ -z "$EIA_API_KEY" ]; then
            echo "::notice::EIA skipped (no EIA_API_KEY)"
            exit 0
          fi
          code=$(curl -sS -o /tmp/eia_body.json -w "%{http_code}" --fail --max-time 60 \
            "https://api.eia.gov/v2/electricity/rto/region-data/data/?frequency=hourly&data%5B0%5D=value&api_key=${EIA_API_KEY}&length=5000") || true
          echo "EIA: HTTP ${code:-fail}"
          if [ "$code" = "200" ]; then
            jq '.response.data as $d | $d[0].period as $p
                | [$d[] | select(.period == $p) | (.value // 0 | tonumber)]
                | {period: $p, total_demand_mw: add, rto_count: length}' \
              /tmp/eia_body.json > data/eia_grid_demand.json
          fi


      - name: TAP catalogs -> CDN
        env:
          OMEGAFLOW_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
          GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          TAP_MAX_ROWS: "0"
          TAP_MAX_SOURCES: "25"
        run: |
          pip install -q astropy numpy 2>/dev/null || true
          python3 scripts/tap_to_cdn.py --update-sources || \
            echo "::warning::TAP conversion had failures (see logs)"
          if ! git diff --quiet -- phi/sources.φ; then
            git config user.name "omegaflow-bot"
            git config user.email "bot@omegaflow.space"
            git add phi/sources.φ
            git commit -m "Mycelium: point TAP sources at catalogs CDN" || true
            git push origin HEAD 2>/dev/null || echo "::warning::push failed (branch locked by parallel work)"
          fi

      - name: Shard huge catalogs
        env:
          OMEGAFLOW_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
          GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/shard_done ]; then
            for src in vizier_nvss_radio vizier_first_radio vizier_lotss_dr3 vizier_gleam_extragalactic_catalog; do
              if ! python3 scripts/shard_catalog.py --source "$src" --bins 24 --update-sources 2>/dev/null; then
                echo "::warning::shard $src incomplete"
              fi
              if ! git diff --quiet -- phi/sources.φ; then
                git config user.name "omegaflow-bot"
                git config user.email "bot@omegaflow.space"
                git add phi/sources.φ
                git commit -m "Mycelium: shard $src into 24 RA bins" || true
                git push origin HEAD 2>/dev/null || true
              fi
            done
            touch /tmp/shard_done
          fi
          if [ ! -f /tmp/reload_done ]; then
            python3 scripts/shard_catalog.py --reload-excerpts 2>/dev/null || \
              echo "::warning::excerpt reload had failures"
            touch /tmp/reload_done
          fi

      - name: Repair Gaia catalogs
        env:
          OMEGAFLOW_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
        run: |
          python3 scripts/repair_gaia.py 2>&1 | tail -5 || \
            echo "::warning::gaia repair had failures"

      - name: Mirror static files -> catalogs
        run: |
          echo "Mirroring third-party static files to domain releases"
          declare -A MIRRORS=(
            ["ne_10m_parks_area.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_parks_and_protected_lands_area.geojson"
            ["ne_10m_parks_point.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_parks_and_protected_lands_point.geojson"
            ["ne_110m_coastline.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_coastline.geojson"
            ["ne_110m_boundaries.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_boundary_lines_land.geojson"
            ["gem_active_faults.geojson"]="https://raw.githubusercontent.com/GEMScienceTools/gem-global-active-faults/master/geojson/gem_active_faults.geojson"
            ["meteorites_tidy.csv"]="https://raw.githubusercontent.com/rfordatascience/tidytuesday/master/data/2019/2019-06-11/meteorites.csv"
            ["meteorites_nasa_all.csv"]="https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2019/2019-06-11/meteorites.csv"
            ["ourairports_global.csv"]="https://ourairports.com/data/airports.csv"
            ["particle2026.csv"]="https://raw.githubusercontent.com/scikit-hep/particle/main/src/particle/data/particle2026.csv"
            ["nuclear_power_plants.csv"]="https://raw.githubusercontent.com/cristianst85/GeoNuclearData/master/data/csv/denormalized/reactors.csv"
            ["earth_impact_craters.geojson"]="https://raw.githubusercontent.com/arijguest/3D-meteorite-viewer/main/earth-impact-craters-v2.geojson"
            ["meteorite_strike_data.json"]="https://raw.githubusercontent.com/FreeCodeCamp/ProjectReferenceData/master/meteorite-strike-data.json"
            ["ne_10m_populated_places.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_populated_places_simple.geojson"
            ["ne_50m_glaciers.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_glaciated_areas.geojson"
            ["ne_50m_lakes.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_lakes.geojson"
            ["ne_110m_populated_places.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_populated_places.geojson"
            ["ne_10m_rivers.geojson"]="https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_10m_rivers_lake_centerlines.geojson"
            ["constellations_bounds.json"]="https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.bounds.json"
            ["periodic_table.json"]="https://raw.githubusercontent.com/Bowserinator/Periodic-Table-JSON/master/PeriodicTableJSON.json"
            ["jbrooksuk_airports.json"]="https://raw.githubusercontent.com/jbrooksuk/JSON-Airports/master/airports.json"
            ["power_plants_wri.csv"]="https://raw.githubusercontent.com/wri/global-power-plant-database/master/output_database/global_power_plant_database.csv"
            ["gem_faults_harmonized.geojson"]="https://raw.githubusercontent.com/cossatot/gem-global-active-faults/master/geojson/gem_active_faults.geojson"
            ["pb2002_boundaries.json"]="https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_boundaries.json"
            ["pb2002_orogens.json"]="https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_orogens.json"
            ["pb2002_plates.json"]="https://raw.githubusercontent.com/fraxen/tectonicplates/master/GeoJSON/PB2002_plates.json"
          )
          declare -A MIRROR_DOMAINS=(
            ["ne_10m_parks_area.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_10m_parks_point.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_110m_coastline.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_110m_boundaries.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["gem_active_faults.geojson"]="github.com-GEMScienceTools-gem-global-active-faults"
            ["meteorites_tidy.csv"]="github.com-rfordatascience-tidytuesday"
            ["meteorites_nasa_all.csv"]="github.com-rfordatascience-tidytuesday"
            ["ourairports_global.csv"]="github.com-davidmegginson-ourairports-data"
            ["particle2026.csv"]="github.com-scikit-hep-particle"
            ["nuclear_power_plants.csv"]="github.com-cristianst85-GeoNuclearData"
            ["earth_impact_craters.geojson"]="github.com-arijguest-3D-meteorite-viewer"
            ["meteorite_strike_data.json"]="github.com-FreeCodeCamp-ProjectReferenceData"
            ["ne_10m_populated_places.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_50m_glaciers.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_50m_lakes.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_110m_populated_places.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["ne_10m_rivers.geojson"]="github.com-nvkelso-natural-earth-vector"
            ["constellations_bounds.json"]="github.com-ofrohn-d3-celestial"
            ["periodic_table.json"]="github.com-Bowserinator-Periodic-Table-JSON"
            ["jbrooksuk_airports.json"]="github.com-jbrooksuk-JSON-Airports"
            ["power_plants_wri.csv"]="github.com-wri-global-power-plant-database"
            ["gem_faults_harmonized.geojson"]="github.com-cossatot-gem-global-active-faults"
            ["pb2002_boundaries.json"]="github.com-fraxen-tectonicplates"
            ["pb2002_orogens.json"]="github.com-fraxen-tectonicplates"
            ["pb2002_plates.json"]="github.com-fraxen-tectonicplates"
          )
          for fn in "${!MIRRORS[@]}"; do
            url="${MIRRORS[$fn]}"
            domain="${MIRROR_DOMAINS[$fn]}"
            release_tag="${domain}"
            echo "  mirror: $fn -> $release_tag <- $url"
            gh release create "$release_tag" --repo "$CATALOGS_REPO" --title "$release_tag" --notes "" 2>/dev/null || true
            if curl -sS --retry 2 --fail -o "data/mirror_$fn" "$url"; then
              gh release upload "$release_tag" "data/mirror_$fn" --repo "$CATALOGS_REPO" --clobber
              echo "    uploaded"
            else
              echo "::warning::mirror $fn failed"
            fi
          done

      - name: TeVCat -> CDN (HEASARC TAP → JSON)
        env:
          OMEGAFLOW_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
        run: |
          pip install -q astropy
          python3 << 'PYEOF'
          import urllib.request, json, io, sys, os, ssl
          TOKEN = os.environ["OMEGAFLOW_TOKEN"]
          ctx = ssl.create_default_context()
          ctx.check_hostname = False
          ctx.verify_mode = ssl.CERT_NONE

          url = "https://heasarc.gsfc.nasa.gov/xamin/vo/tap/sync?REQUEST=doQuery&LANG=ADQL&QUERY=SELECT+*+FROM+tevcat"
          req = urllib.request.Request(url, headers={"User-Agent": "omegaflow-ci/1.0"})
          with urllib.request.urlopen(req, timeout=120, context=ctx) as r:
              text = r.read().decode(errors='replace')

          rows = []
          try:
              from astropy.io.votable import parse_single_table
              table = parse_single_table(io.BytesIO(text.encode()))
              cols = table.array.dtype.names or []
              for rec in table.array:
                  row = {}
                  for c in cols:
                      val = rec[c]
                      if hasattr(val, 'tolist'): val = val.tolist()
                      row[c] = val
                  rows.append(row)
              print(f"TeVCat: {len(rows)} sources (astropy)")
          except Exception as e:
              print(f"astropy failed: {e}, falling back to xml")
              import xml.etree.ElementTree as ET
              ns = 'http://www.ivoa.net/xml/VOTable/v1.3'
              root = ET.fromstring(text)
              for table_elem in root.iter(f'{{{ns}}}TABLE'):
                  fields = []
                  for f in table_elem.findall(f'{{{ns}}}FIELD'):
                      fields.append(f.get('name', ''))
                  for tr in table_elem.findall(f'.//{{{ns}}}TR'):
                      tds = tr.findall(f'{{{ns}}}TD')
                      if len(tds) == len(fields):
                          row = {}
                          for i, td in enumerate(tds):
                              row[fields[i]] = td.text
                          rows.append(row)
              print(f"TeVCat: {len(rows)} sources (xml fallback)")

          def api(method, path, data=None):
              url = f"https://api.github.com{path}"
              h = {"Authorization": f"Bearer {TOKEN}", "User-Agent": "omegaflow-ci/1.0", "Accept": "application/vnd.github+json"}
              if data:
                  h["Content-Type"] = "application/json"
                  req = urllib.request.Request(url, data=data.encode(), headers=h, method=method)
              else:
                  req = urllib.request.Request(url, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      return r.status, json.loads(r.read()) if r.status != 204 else None
              except urllib.error.HTTPError as e:
                  return e.code, json.loads(e.read()) if e.fp else {"message": str(e)}

          domain = "heasarc.gsfc.nasa.gov"
          status, release = api("GET", f"/repos/omegaflow/sources/releases/tags/{domain}")
          if status != 200 or release is None:
              status, release = api("POST", "/repos/omegaflow/sources/releases", json.dumps({"tag_name": domain, "name": domain, "body": ""}))
              if release is None:
                  print("Failed to get/create release")
                  sys.exit(1)

          for a in release.get("assets", []):
              if a["name"] == "astro_tevcat_main.json":
                  api("DELETE", f"/repos/omegaflow/sources/releases/assets/{a['id']}")
                  break

          flat = json.dumps({"data": rows}).encode()
          upload_url = release["upload_url"].split("{")[0]
          import urllib.parse
          url = f"{upload_url}?name={urllib.parse.quote('astro_tevcat_main.json')}"
          req = urllib.request.Request(url, data=flat,
              headers={"Authorization": f"Bearer {TOKEN}", "User-Agent": "omegaflow-ci/1.0",
                       "Content-Type": "application/octet-stream"}, method="POST")
          with urllib.request.urlopen(req, timeout=60, context=ctx) as r:
              print(f"Upload: HTTP {r.status}, {len(flat)/1024:.0f} KB")
          PYEOF

      - name: Mirror all sources -> CDN (health snapshot)
        env:
          OMEGAFLOW_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
        run: |
          python3 scripts/migrate_live_to_cdn.py --mode mirror-all 2>&1 | tail -10

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN || secrets.GITHUB_TOKEN }}
          CATALOGS_REPO: ${{ vars.CATALOGS_REPO || 'omegaflow/sources' }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::no token to publish release"
            exit 1
          fi
          python3 scripts/refresh_catalogs.py
