# Rat 2026-10-17 · R3 Concurrency-Schlüssel — 3:3, ungeglättet (kein stiller Wechsel).
# A per-SHA (GLM-5.3, DeepSeek V4 Pro, Lumo 2.0): der HEAD-Zustand ist je SHA definiert.
# B per-ref (Sakana Fugu, Mistral Large 4, Kimi K3): die Raumzeit-Adresse des HEAD ist der
#   Ref, nicht der SHA — per-SHA adressiert die Vergangenheit, nicht die Gegenwart. Der
#   Check ist zustands- statt commit-basiert (mit jedem Push wird der laufende Vorgänger
#   obsolet); ein Cancel mid-write kann inkonsistenten Zustand hinterlassen (Writes
#   idempotent halten); `cancelled` darf nicht als Failure gelesen werden.
# B trägt die härtere Begründung, A bleibt gleichberechtigt — der Wechsel braucht das
# Operator-/Rat-Wort. Gemessen: 8 Läufe/10 min, 7 cancelled, Gate bei `0 jobs`.
name: register-coverage
on:
  workflow_dispatch:
  push:
    paths:
      - 'docs/handover/**'
      - 'phi/**'
      - 'tools/register/**'
concurrency:
  group: register-coverage-${{ github.ref }}
  cancel-in-progress: false
jobs:
  orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --release -p omegaflow-register --bin register_lookup
    - name: Orphan-Gate — jede Linie trägt ihre offenen Register-Einträge
      run: target/release/register_lookup --orphans --fail
    - name: Transport-Gate — kein Sender-Löschen ohne Echo
      run: target/release/register_lookup --tokens --noecho-fail
