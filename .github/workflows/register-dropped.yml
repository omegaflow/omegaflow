name: register-dropped
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/register/**'
concurrency:
  group: register-dropped
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --release -p omegaflow-register --bin register_lookup
    - name: Dropped sweep — canonical keys of the un-witnessed drops
      run: |
        target/release/register_lookup --dropped-keys | sort -u | tee dropped-keys.txt
        echo "dropped-keys: $(wc -l < dropped-keys.txt) key(s)"
    - uses: actions/upload-artifact@v4
      with:
        name: dropped-keys
        path: dropped-keys.txt
        if-no-files-found: error
