name: register-dropped
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/register/**'
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - run: cargo build --release -p omegaflow-register --bin register_lookup
    - name: Dropped sweep — full-history measurement
      run: target/release/register_lookup --dropped
