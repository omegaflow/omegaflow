name: silence-map-probe

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  silence-map-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Anchor the run
        run: echo "SHA $(git rev-parse HEAD)" > silence-map-probe.txt
      - name: Run the silence-map probe against the CDN catalog (the real measurement)
        run: cargo run --release -p omegaflow-measure --bin silence_map_probe >> silence-map-probe.txt 2>&1
      - name: Raise an issue when the probe carries a finding
        if: failure()
        run: |
          bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
               "silence-map-probe: the CDN-catalog probe carries a finding" \
               "The silence-map probe returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               health
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: silence-map-probe
          path: silence-map-probe.txt
