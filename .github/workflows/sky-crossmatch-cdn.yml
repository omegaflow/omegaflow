name: sky-crossmatch-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  crossmatch:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Join the full held sky-direction set to Gaia DR3 parallax and NED objdir
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern skydirections.bin --pattern dr3_stars.bin --clobber
          cargo run -p omegaflow-measure --release --bin direction_distance_join -- \
            --stars dr3_stars.bin --radius 5 --directions skydirections.bin 2>&1 | tee sky_crossmatch_verdict.log
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern skydirections_zchunk.bin --clobber 2>/dev/null || true
          cargo run -p omegaflow-measure --release --bin direction_z_join -- \
            --radius 30 --directions skydirections.bin --out skydirections_zchunk.bin --ci-mode 2>&1 | tee -a sky_crossmatch_verdict.log
      - name: Ensure the ssd.jpl.nasa.gov-sky-crossmatch release exists on the CDN
        run: |
          gh release view ssd.jpl.nasa.gov-sky-crossmatch --repo omegaflow/sources >/dev/null 2>&1 \
            || gh release create ssd.jpl.nasa.gov-sky-crossmatch --repo omegaflow/sources \
                 --title "ssd.jpl.nasa.gov-sky-crossmatch" --notes "CDN family release"
      - name: Persist the crossmatch verdict log to the CDN (ssd.jpl.nasa.gov)
        if: always()
        continue-on-error: true
        run: |
          gh release upload ssd.jpl.nasa.gov-sky-crossmatch sky_crossmatch_verdict.log --clobber --repo omegaflow/sources \
            || { echo "log upload void — the local log is the artifact"; exit 0; }
