name: skydirection-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  LASAIR_TOKEN: ${{ secrets.LASAIR_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  skydirection:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the S2 sky-direction set once and upload to CDN
        run: |
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern skydirections.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin skydirection_compiler -- \
              --out skydirections.bin --lasair-window 2460500 \
              --antares --antares-limit 20 \
              --fink-cone 148.8746 2.5208 60 --ci-mode
