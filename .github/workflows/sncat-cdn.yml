name: sncat-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  sncat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile Asiago supernova catalog and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/sn/sncat" \
            --columns 'ra:RAJ2000;dec:DEJ2000;z:z;mag:MaxMag' \
            --skip-null z \
            --out sncat.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: sncat returned void" \
                 "sncat compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
