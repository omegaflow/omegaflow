name: source-census

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the source latency census
        run: |
          cargo run -p omegaflow-measure --release --bin source_latency_census -- --blocked
      - name: Commit the census report
        continue-on-error: true
        run: |
          git config user.name "omegaflow-bot"
          git config user.email "bot@omegaflow.space"
          git add phi/reports/source_latency_census.φ
          git diff --staged --quiet || git commit -m "source latency census $(date -u +'%Y-%m-%dT%H:%MZ')"
          git pull --rebase --autostash origin main
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            sleep 20
            git pull --rebase --autostash origin main
          done
          exit 1
