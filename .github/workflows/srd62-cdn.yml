name: srd62-cdn
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  suprastrom-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest NIST SRD 62 penetration depth and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin srd62_compiler -- \
            --out kernels \
            --ci-mode
