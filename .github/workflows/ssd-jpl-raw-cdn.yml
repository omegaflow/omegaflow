# harvest: format=raw_ssd_jpl arm=raw_mirror pattern=^.*\.txt$ idempotent=true timeout=240 tag=ssd.jpl.nasa.gov
# JPL SSD /dat/planets/ observation-record family (asteroid & planetary astrometry,
# Goldstone/VLBI radar, and spacecraft ranging/Doppler) mirrored byte-for-byte to the
# omegaflow/sources CDN. Base https://ssd.jpl.nasa.gov/planets/obs_data.html. Each matrix
# entry carries the registered url/origin/sha256; raw_mirror refuses to upload unless the
# live body hashes to the registered sha256. The Viking range/Doppler pair is carried by
# viking-text-cdn.yml (viking_text_compiler, id-filtered to the two landers) and is not repeated.

name: ssd-jpl-raw-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harvest/src/bin/raw_mirror.rs'
      - '.github/workflows/ssd-jpl-raw-cdn.yml'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  OMEGAFLOW_R2_MIRROR: ${{ vars.OMEGAFLOW_R2_MIRROR }}
  OMEGAFLOW_R2_WORKER: ${{ vars.OMEGAFLOW_R2_WORKER }}

jobs:
  ssd-jpl-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
