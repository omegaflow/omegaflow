name: star-dmax-probe

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the committed star bin from the CDN
        run: |
          curl -sSfL -o dr3_stars.bin \
            https://github.com/omegaflow/sources/releases/download/ssd.jpl.nasa.gov/dr3_stars.bin
      - name: Run the star d_max distribution measurement
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            cargo run --release -p omegaflow-measure --bin star_dmax_probe -- \
              --bin dr3_stars.bin \
              --floor 1e-30 --floor 1e-27 --floor 1e-24 --floor 1e-21 \
              --floor 1e-18 --floor 1e-15 --floor 1e-12 --floor 1e-9 \
              --floor 1e-6 --floor 1e-3 --floor 1.0 --floor 1e3 \
              --softening 1.0 --softening 1e3 --softening 1e6
          } > star-dmax-probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: star-dmax-probe
          path: star-dmax-probe.txt
