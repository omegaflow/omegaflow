name: stromboli-station-term

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      end:
        description: ISO end time of the crater section (empty -> now)
        required: false
        default: ''
permissions:
  contents: write
env:
  RUSTFLAGS: -D warnings
jobs:
  stromboli-station-term:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the Stromboli station term (crater section vs the reference station)
        env:
          SECTION_END: ${{ inputs.end }}
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            if [ -n "$SECTION_END" ]; then
              cargo run --release -p omegaflow-measure --bin stromboli_station_term_probe -- --end "$SECTION_END"
            else
              cargo run --release -p omegaflow-measure --bin stromboli_station_term_probe
            fi
          } > stromboli-station-term.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stromboli-station-term
          path: stromboli-station-term.txt
