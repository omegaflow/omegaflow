name: substorm-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      start:
        description: start ISO date (e.g. 1997-01-01)
        required: true
        type: string
        default: "1997-01-01"
      stop:
        description: stop ISO date (e.g. 2026-10-01)
        required: true
        type: string
        default: "2026-10-01"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  substorm:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile each substorm onset list and manifest the bin to the CDN
        run: |
          set -euo pipefail
          for list in newell forsyth liou frey ohtani; do
            echo "substorm list: $list"
            cargo run -p omegaflow-harvest --release --bin substorm_compiler -- \
              --list "$list" \
              --start "${{ inputs.start }}" \
              --stop "${{ inputs.stop }}" \
              --out "substorm_${list}.bin" \
              --ci-mode
          done
