name: superdarn-cpcp-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  superdarn-cpcp:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view zenodo.org --repo omegaflow/sources
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "superdarn_cpcp.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset superdarn_cpcp.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset superdarn_cpcp.bin missing — compiling and manifesting"
          fi
      - name: Compile SuperDARN CPCP convection maps and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin superdarn_cpcp_compiler -- \
            --url https://zenodo.org/api/records/10374021/files/20160311.north.map2/content \
            --out-bin superdarn_cpcp.bin --ci-mode
