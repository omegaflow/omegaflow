name: superdarn-fitacf-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  superdarn-fitacf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view zenodo.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "superdarn_fitacf.bin"; then
            echo "asset superdarn_fitacf.bin already present — manifest skipped"
            exit 0
          fi
          echo "asset superdarn_fitacf.bin missing — compiling and manifesting"
      - name: Compile SuperDARN FITACF line-of-sight velocities and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin superdarn_fitacf_compiler -- \
            --day 20191113 --out-bin superdarn_fitacf.bin \
            --lsk kernels/naif0012.tls --ci-mode
