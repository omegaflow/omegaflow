name: superdarn-rawacf-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  superdarn-rawacf:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view frdr-dfdr.ca --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "superdarn_rawacf.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset superdarn_rawacf.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset superdarn_rawacf.bin missing — compiling and manifesting"
          fi
      - name: Compile SuperDARN RAWACF lag-0 backscatter power and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run -p omegaflow-harvest --release --bin superdarn_rawacf_compiler -- \
            --url https://www.frdr-dfdr.ca/repo/files/7/published/publication_1302/submitted_data/2023/01/20230101.0000.00.fir.a.rawacf.bz2 \
            --radar fir --date 20230101 --out-bin superdarn_rawacf.bin --ci-mode
