name: supermag-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      start:
        description: start ISO (e.g. 2025-03-01T00:00:00)
        required: true
        type: string
        default: "2025-03-01T00:00:00"
      days:
        description: total window days (split into shards under the 2 GiB asset limit)
        required: true
        type: string
        default: "31"
      shards:
        description: number of time shards (each shard carries the full station network)
        required: true
        type: string
        default: "2"
      asset:
        description: output asset base name; the shard letter (a, b, …) is appended
        required: true
        type: string
        default: supermag_2025-03
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  supermag:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the leap-second kernel
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Compile each time shard of the merged SuperMAG network and upload to the CDN
        run: |
          set -euo pipefail
          shards="${{ inputs.shards }}"
          total="${{ inputs.days }}"
          per=$(( (total + shards - 1) / shards ))
          suffixes=(a b c d e f g h)
          start_in="${{ inputs.start }}"
          base="${start_in//T/ }"
          base_epoch=$(date -u -d "$base" +%s)
          for i in $(seq 0 $(( shards - 1 ))); do
            offset=$(( i * per ))
            left=$(( total - offset ))
            if [ "$left" -le 0 ]; then break; fi
            d=$(( left < per ? left : per ))
            start=$(date -u -d "@$(( base_epoch + offset * 86400 ))" +%Y-%m-%dT%H:%M:%S)
            asset="${{ inputs.asset }}${suffixes[$i]}.bin"
            echo "shard $i: start=$start days=$d asset=$asset"
            cargo run -p omegaflow-harvest --release --bin supermag_compiler -- \
              --all --start "$start" --days "$d" --out "$asset" \
              --lsk kernels/naif0012.tls --ci-mode
          done
