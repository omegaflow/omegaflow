name: supermag-cdn
on:
  workflow_dispatch:
    inputs:
      start:
        description: start ISO (e.g. 2025-03-01T00:00:00)
        required: true
        type: string
        default: "2025-03-01T00:00:00"
      days:
        description: window days (max 28 per request; larger windows paginate)
        required: false
        type: string
        default: "31"
      asset:
        description: output asset name on the CDN (netloc supermag.jhuapl.edu)
        required: true
        type: string
        default: supermag_2025-03.bin
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  supermag:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          if gh release view supermag.jhuapl.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "${{ inputs.asset }}"; then
            echo "asset ${{ inputs.asset }} already present — manifest skipped"
            exit 0
          fi
          echo "asset ${{ inputs.asset }} missing — compiling and manifesting"
      - name: Compile the merged SuperMAG network series and upload to CDN
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          cargo run -p omegaflow-harvest --release --bin supermag_compiler -- \
            --all --start "${{ inputs.start }}" \
            --days "${{ inputs.days }}" --out "${{ inputs.asset }}" \
            --lsk kernels/naif0012.tls --ci-mode
