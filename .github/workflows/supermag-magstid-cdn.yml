name: supermag-magstid-cdn
on:
  workflow_dispatch:
    inputs:
      start:
        description: start ISO (e.g. 2025-03-01T00:00:00)
        required: true
        type: string
        default: "2025-03-01T00:00:00"
      days:
        description: window days (max 28 per request; larger windows paginate)
        required: false
        type: string
        default: "31"
      budget:
        description: per-run budget — stations harvested before the run closes
        required: false
        type: string
        default: "50"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  supermag-magstid:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Fetch the leap-second kernel
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
      - name: Build the SuperMAG compiler
        run: cargo build -p omegaflow-harvest --release --bin supermag_compiler
      - name: Harvest the magstid station network within the per-run budget
        run: |
          set -euo pipefail
          start_date="${{ inputs.start }}"
          start_date="${start_date%%T*}"
          budget="${{ inputs.budget }}"
          mapfile -t stations < <(./target/release/supermag_compiler --list-stations)
          if [ "${#stations[@]}" -eq 0 ]; then
            echo "magstid carries no station list — nothing to harvest"
            exit 1
          fi
          echo "${#stations[@]} stations in the magstid network"
          if ! gh release view supermag.jhuapl.edu --repo omegaflow/sources \
              --json assets --jq '.assets[]?.name' 2>/tmp/gh_listing.err > /tmp/present.txt; then
            echo "release listing void: $(cat /tmp/gh_listing.err 2>/dev/null)"
            exit 1
          fi
          harvested=0
          for code in "${stations[@]}"; do
            if [ "$harvested" -ge "$budget" ]; then
              echo "per-run budget ${budget} reached — ${code} and later stations stay pending"
              break
            fi
            asset="supermag_${code}_${start_date}_${{ inputs.days }}d.bin"
            if grep -qx "$asset" /tmp/present.txt; then
              echo "${code}: ${asset} already present — manifest skipped"
              continue
            fi
            if ./target/release/supermag_compiler --station "$code" \
               --start "${{ inputs.start }}" --days "${{ inputs.days }}" \
               --out "$asset" --lsk kernels/naif0012.tls --ci-mode; then
              echo "$asset" >> /tmp/present.txt
              harvested=$((harvested + 1))
            else
              echo "${code}: no measured series — the asset stays unwritten (0 honored)"
            fi
          done
          echo "harvested ${harvested} station series this run"
