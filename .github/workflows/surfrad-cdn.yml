# auto-dispatch: manual — station/year/day are required per-act inputs; auto-dispatch cannot supply them
name: surfrad-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      station:
        description: SURFRAD station code (three alphanumeric characters, e.g. tbl)
        required: true
        type: string
        default: "tbl"
      year:
        description: measurement year (YYYY)
        required: true
        type: string
        default: "2024"
      doy:
        description: day of year (DDD, 1..366)
        required: true
        type: string
        default: "001"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  surfrad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the gml.noaa.gov release exists on the CDN
        run: |
          if ! gh release view gml.noaa.gov --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create gml.noaa.gov --repo omegaflow/sources \
              --title "gml.noaa.gov" \
              --notes "SURFRAD (NOAA GML) daily broadband radiation compiled to hourly ICRS records; magic SRFR, 8-byte header then n x 26 f64 (W/m2, inverse-square em)."
          fi
      - name: Compile the SURFRAD day and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin surfrad_compiler -- \
            --station "${{ inputs.station }}" \
            --year "${{ inputs.year }}" \
            --doy "${{ inputs.doy }}" \
            --body earth \
            --out out \
            --ci-mode
  series-manifest:
    needs: [surfrad]
    if: always() && needs.surfrad.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fold every surfrad shard on the CDN into the year-less series manifest
        run: |
          set -euo pipefail
          FAMILY="gml.noaa.gov"
          PREFIX="surfrad_"
          MANIFEST="surfrad.manifest"
          REPO="omegaflow/sources"
          tmp="$(mktemp -d)"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            | jq -r '.[].tag_name' > "$tmp/tags"
          : > "$tmp/$MANIFEST"
          while IFS= read -r tag; do
            case "$tag" in
              "$FAMILY"|"$FAMILY"-*) ;;
              *) continue ;;
            esac
            gh release view "$tag" --repo "$REPO" \
              --json assets \
              --jq ".assets[] | select(.name|startswith(\"$PREFIX\")) | select(.name|endswith(\".bin\")) | \"\(.name) \(.digest)\"" \
              >> "$tmp/$MANIFEST"
          done < "$tmp/tags"
          sort -u -o "$tmp/$MANIFEST" "$tmp/$MANIFEST"
          if [ ! -s "$tmp/$MANIFEST" ]; then
            echo "no surfrad shards on the CDN — the series manifest stays unwritten (0 honored)"
            exit 0
          fi
          echo "$MANIFEST lists $(wc -l < "$tmp/$MANIFEST") shards"
          gh release upload "$FAMILY" "$tmp/$MANIFEST" --clobber --repo "$REPO"
