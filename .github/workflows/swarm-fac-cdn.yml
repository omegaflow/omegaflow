name: swarm-fac-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  swarm-fac:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view isdc-data.gfz.de --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "swarm_fac.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset swarm_fac.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset swarm_fac.bin missing — compiling and manifesting"
          fi
      - name: Ensure the isdc-data.gfz.de release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view isdc-data.gfz.de --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create isdc-data.gfz.de --repo omegaflow/sources \
              --title "isdc-data.gfz.de" \
              --notes "GFZ ISDC mirror of ESA Swarm Level-2 FAC_TMS small-scale field-aligned current (CC-BY-4.0) compiled to omegaflow SWFC binary assets (CDN tag = netloc)"
          fi
      - name: Fetch the Swarm L2 FAC daily CDF and manifest the SWFC bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin swarm_fac_compiler -- \
            --url 'https://isdc-data.gfz.de/swarm/OPER/Level2/FAC_TMS/Sat_AC/small_scale/SW_OPER_FAC_TMS_2F_20201201T000000_20201201T235959_0402.cdf' \
            --out swarm_fac.bin \
            --ci-mode
