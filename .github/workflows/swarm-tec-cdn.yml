name: swarm-tec-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  swarm-tec:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view swarm-diss.eo.esa.int --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "swarm_tec.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset swarm_tec.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset swarm_tec.bin missing — compiling and manifesting"
          fi
      - name: Ensure the swarm-diss.eo.esa.int release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view swarm-diss.eo.esa.int --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create swarm-diss.eo.esa.int --repo omegaflow/sources \
              --title "swarm-diss.eo.esa.int" \
              --notes "ESA Swarm Level-2 daily TEC (Absolute_VTEC) compiled to omegaflow SCTE binary assets (CDN tag = netloc)"
          fi
      - name: Fetch the Swarm TEC daily ZIP and manifest the SCTE bin to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin swarm_tec_compiler -- \
            --url 'https://swarm-diss.eo.esa.int/?do=download&file=swarm/Level2daily/Entire_mission_data/TEC/TMS/Sat_A/SW_OPER_TECATMS_2F_20131125T000000_20131125T235959_0502.ZIP' \
            --out swarm_tec.bin \
            --ci-mode
