name: te-gate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  te-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the n=1000 shift sweep (the shift-null measurement)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture shift_sweep_n1000
      - name: Run the n=1000 TE calibration gates (heavy; ignored in the default cargo test)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_fpr_autocorrelation
      - name: Raise an issue when the n=1000 gate fails
        if: failure()
        run: |
          bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
               "te-gate: the n=1000 FPR gate carries a finding" \
               "The n=1000 TE calibration gate returned void (FPR > 8% or rise > 2pp under autocorrelation). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               health
      - name: Run the n=1000 block sweep (the block-length fix measurement)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture block_sweep_n1000
      - name: Run the n=1000 KSG sweep (the estimator-switch measurement)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture ksg_sweep_n1000
      - name: Run the n=1000 arx sweep (the arx-null measurement + OLS counter)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture arx_sweep_n1000
      - name: Run the conditional n=1000 FP/FN gate (the direct-path calibration)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_conditional_arx_fpr_fn_n1000
      - name: Run the reversed conditional n=1000 FP/FN gate (the reverse-direction calibration)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_conditional_arx_fpr_fn_reversed_n1000
      - name: Run the two-confounder n=1000 FPR gate (the direct _2 path)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_conditional_arx_2_fpr_n1000
      - name: Run the coupling scan te_c/thr_c (the per-lag calibration curve)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture coupling_scan_te_over_thr_n1000
      - name: Run the FPR-vs-bins sweep (the restricted-null calibration curve)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture fpr_bins_sweep_n2000
      - name: Run the MI-lag stability sweep (the tau-instability gate, n up to 4096 x 200 surrogates)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_mi_lag_stability
      - name: Run the flare-envelope true-coupling gate (the power study; 43% at n=240)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture flare_envelope_conditional_keeps_true_coupling
      - name: Run the flare-envelope power probe (print-only; n in 400/600/1000)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture flare_envelope_power_probe
      - name: Print the KSG/KDE estimator split (te_scal/te_topo — the Riss 4 numbers)
        run: cargo run --release -p omegaflow-measure --bin te_fn_probe
