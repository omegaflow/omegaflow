name: te-gate

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
permissions:
  contents: read
  issues: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  te-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the n=1000 TE calibration gates (heavy; ignored in the default cargo test)
        run: |
          cargo test --release -p omegaflow --lib -- --ignored --nocapture gate_fpr_autocorrelation \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "te-gate: the n=1000 FPR gate carries a finding" \
                 "The n=1000 TE calibration gate returned void (FPR > 8% or rise > 2pp under autocorrelation). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Run the n=1000 block sweep (the block-length fix measurement)
        run: cargo test --release -p omegaflow --lib -- --ignored --nocapture block_sweep_n1000
