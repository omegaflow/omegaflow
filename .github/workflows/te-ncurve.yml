name: te-ncurve

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      null_model:
        description: 'null model: phase (canonical) | block | shift | arx'
        default: 'phase'
      est:
        description: 'estimator: ksg | binned'
        default: 'ksg'
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  ncurve:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        n: [400, 450, 500, 550, 600, 650, 700, 800, 900, 1000]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the gate battery (the 0) at gate-n ${{ matrix.n }}
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT n${{ matrix.n }}"
            cargo run --release -p omegaflow-measure --bin pcmci_class_benchmark -- --anchor --gate --gate-n ${{ matrix.n }} --null ${{ github.event.inputs.null_model }} --est ${{ github.event.inputs.est }}
          } > "report-n${{ matrix.n }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: point-n${{ matrix.n }}
          path: report-n${{ matrix.n }}.txt
  tcurve:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        segment:
          - lo: 400
            hi: 450
          - lo: 500
            hi: 550
          - lo: 600
            hi: 650
          - lo: 700
            hi: 700
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the power curve (detection) over T=${{ matrix.segment.lo }}..${{ matrix.segment.hi }}
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT tcurve ${{ matrix.segment.lo }}:${{ matrix.segment.hi }}"
            cargo run --release -p omegaflow-measure --bin pcmci_class_benchmark -- --tcurve --t ${{ matrix.segment.lo }}:${{ matrix.segment.hi }}
          } > "report-tcurve-${{ matrix.segment.lo }}-${{ matrix.segment.hi }}.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tcurve-sheet-${{ matrix.segment.lo }}-${{ matrix.segment.hi }}
          path: report-tcurve-${{ matrix.segment.lo }}-${{ matrix.segment.hi }}.txt
