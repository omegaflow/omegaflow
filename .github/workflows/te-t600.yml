name: te-t600

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the T=600 battery point
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT t600"
            cargo run --release -p omegaflow-measure --bin pcmci_class_benchmark -- --t600
          } > "report-t600.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t600-sheet
          path: report-t600.txt
