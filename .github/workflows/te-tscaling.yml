name: te-tscaling
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  RUSTFLAGS: -D warnings
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run the T-scaling trio (T=150/300/600) at the operating point
        run: |
          {
            echo "SHA $(git rev-parse HEAD)"
            echo "POINT tscaling"
            cargo run --release -p omegaflow-measure --bin pcmci_class_benchmark -- --tscale
          } > "report-tscaling.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tscaling-sheet
          path: report-tscaling.txt
