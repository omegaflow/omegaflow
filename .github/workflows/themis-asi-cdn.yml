name: themis-asi-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'THEMIS ASI CDF URL (empty = the committed default 2022-01-31 fsim)'
        required: false
        type: string
        default: ''
      force:
        description: Re-manifest even when the bin is already present
        required: false
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  themis-asi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the bin is already manifested
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view themis.ssl.berkeley.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^themis_asi\.bin$"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset themis_asi.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset themis_asi.bin missing — compiling and manifesting"
          fi
      - name: Compile the THEMIS ASI image and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          set -euo pipefail
          mkdir -p data/themis.ssl.berkeley.edu
          URL="${{ inputs.url }}"
          if [ -n "$URL" ]; then
            cargo run --release -p omegaflow-harvest --bin themis_asi_compiler -- \
              --url "$URL" --out "data/themis.ssl.berkeley.edu/themis_asi.bin" --ci-mode
          else
            cargo run --release -p omegaflow-harvest --bin themis_asi_compiler -- \
              --out "data/themis.ssl.berkeley.edu/themis_asi.bin" --ci-mode
          fi
