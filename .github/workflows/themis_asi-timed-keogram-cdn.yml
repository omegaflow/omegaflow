# harvest: format=themis_asi_timed_keogram asset=present arm=themis_asi_timed_keogram_compiler pattern=^themis_asi_timed_keogram\.bin$ idempotent=true timeout=120 tag=data.phys.ucalgary.ca

# auto-dispatch: manual — station, date and the UT window are required per-act inputs (the station coordinate table is pending); auto-dispatch cannot supply them
name: themis_asi-timed-keogram-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      station:
        description: 'THEMIS ASI station label (e.g. atha_themis02) or bare code (e.g. atha)'
        required: true
        type: string
      date:
        description: 'night YYYYMMDD'
        required: true
        type: string
      start:
        description: 'window start HHMM (empty = from night start)'
        required: false
        type: string
        default: ''
      stop:
        description: 'window stop HHMM (empty = to night end)'
        required: false
        type: string
        default: ''
      force:
        description: Re-manifest even when the asset is already present
        required: false
        type: boolean
        default: false
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  themis-asi-timed-keogram:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the timed keogram asset is already manifested
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view data.phys.ucalgary.ca --repo omegaflow/sources \
              --json assets --jq '.assets[]?.name' 2>/dev/null \
              | grep -qE '^themis_asi_timed_keogram\.bin$'; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "themis_asi_timed_keogram.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "themis_asi_timed_keogram.bin missing — compiling and manifesting"
          fi
      - name: Compile the THEMIS ASI timed keogram and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          set -euo pipefail
          mkdir -p data/data.phys.ucalgary.ca
          ARGS="--station ${{ inputs.station }} --date ${{ inputs.date }} --out-bin data/data.phys.ucalgary.ca/themis_asi_timed_keogram.bin --ci-mode"
          if [ -n "${{ inputs.start }}" ] && [ -n "${{ inputs.stop }}" ]; then
            ARGS="--station ${{ inputs.station }} --date ${{ inputs.date }} --start ${{ inputs.start }} --stop ${{ inputs.stop }} --out-bin data/data.phys.ucalgary.ca/themis_asi_timed_keogram.bin --ci-mode"
          fi
          cargo run --release -p omegaflow-harvest --bin themis_asi_timed_keogram_compiler -- $ARGS \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "themis_asi-timed-keogram-cdn: timed keogram compile returned void" \
                 "themis_asi_timed_keogram_compiler returned void for ${{ inputs.station }} ${{ inputs.date }} ${{ inputs.start }}..${{ inputs.stop }}. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
