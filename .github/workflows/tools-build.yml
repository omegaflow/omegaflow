name: tools-build
on:
  workflow_dispatch:
  push:
    paths: ['tools/**','src/**','bin/**','Cargo.toml','Cargo.lock']
permissions:
  contents: write
concurrency:
  group: tools-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v7
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    # The session/analysis/tool crates are published whole: a session never
    # builds locally, so every bin it may invoke must be on PATH. The 243
    # measure/227 harvest probe/compiler bins stay CI-run bodies (not session
    # tools) and are not published.
    - run: cargo build --release --bins -p omegaflow-register -p omegaflow-utils -p omegaflow-gate
    - run: cargo build --release -p omegaflow-measure --bin text_review
    - run: cargo build --release -p omegaflow-service
    - run: cargo build --release -p omegaflow --bin omegaflow --features browser_relay
    - name: Tool list
      run: |
        echo "TOOLS=cdn_reconcile claim_reader commit_words concurrency_contract doc_audit home_scan number_audit open_points_check path_reference_scan pending_extract pii_exposure reference_verify register_lookup register_verify relations_consistency_probe repo_surveillance session_burn source_url_candidates git_safety bench sfetch probe_sweep hdf5_reader harvest_reg parquet_reader register_sort sread spk_split giveup_scan tdat_reader ci_manage las_reader bucket_litmus sgrep archive_search bloat_scan omega_sh zip_range_extract source_scanner grib2_reader opendap_reader netcdf_reader area_reconcile volume_builder commit_check livefeed_gate text_review omegaflow smail smail_recv mail_watchdog mail_digest cds_watchdog job_dashboard job_monitor notes_notify" >> "$GITHUB_ENV"
    - name: Write tools.manifest
      env:
        TOOLS_SHA: ${{ github.sha }}
      run: |
        {
          echo "git_sha=${TOOLS_SHA}"
          for t in $TOOLS; do
            echo "${t} $(sha256sum "target/release/${t}" | awk '{print $1}')"
          done
        } > tools.manifest
    - name: Publish to tools-latest
      env:
        GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
      run: |
        gh release view tools-latest --repo omegaflow/omegaflow >/dev/null 2>&1 || \
          gh release create tools-latest --title tools-latest --generate-notes --repo omegaflow/omegaflow
        ARGS=""
        for t in $TOOLS; do ARGS="$ARGS target/release/$t"; done
        gh release upload tools-latest $ARGS tools.manifest --clobber --repo omegaflow/omegaflow
