name: vex-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  vex-vera:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Harvest the VXRS_1101..1104 ODF volumes and manifest vex_odf.bin to the CDN
        run: |
          if gh release view atmos.nmsu.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "vex_odf.bin"; then
            echo "vex_odf.bin already present — harvest skipped"
            exit 0
          fi
          cargo run --release -p omegaflow-harvest --bin vex_odf_compiler -- --ci-mode
