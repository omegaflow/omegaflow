name: viking-text-cdn

# Der Viking-Text-Compiler (`viking_text_compiler`) als CDN-Manifestator.
# Ohne diesen Workflow bleibt der `url`-Zeiger
# `…/ssd.jpl.nasa.gov-planets/viking_lander_tracking.bin` unmanifestiert.
# Quelle sind die JPL-SSD-Planetentexte
# `…/dat/planets/viking{range,doppler}.txt`; der Release-Tag ist die Familie
# `ssd.jpl.nasa.gov-planets` — der Host-Release `ssd.jpl.nasa.gov` ist bei
# 1000 Assets gekappt. Die Reihe reift langsam; ein
# Monatslauf genügt dem Register-`ttl 604800`.

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 1 * *"

permissions:
  contents: write
  id-token: write

jobs:
  viking:
    uses: ./.github/workflows/cdn-manifest.yml
    secrets: inherit
    with:
      harvests: |
        [
          {"bin":"viking_text_compiler","netloc":"ssd.jpl.nasa.gov-planets","asset":"viking_lander_tracking.bin"}
        ]
