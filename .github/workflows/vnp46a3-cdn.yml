name: vnp46a3-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      tile:
        description: 'VNP46A3 tile (h<col>v<row>); an equatorial tile carries DNB night data year-round'
        type: string
        default: 'h18v07'
  schedule:
    - cron: '29 4 * * *'
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  EARTHDATA_EDL_TOKEN: ${{ secrets.EARTHDATA_EDL_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  vnp46a3:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Resolve the newest VNP46A3 granule for the chosen tile (CMR search, no token)
        id: granule
        run: |
          set -euo pipefail
          tile="${{ inputs.tile }}"; [ -n "$tile" ] || tile="h18v07"
          url=$(curl -sSfL "https://cmr.earthdata.nasa.gov/search/granules.umm_json?short_name=VNP46A3&version=2&page_size=2000&sort_key=-start_date" \
            | jq -r --arg tile "$tile" '[.items[].umm.RelatedUrls[]? | select(.URL | startswith("https://data.laadsdaac.earthdatacloud.nasa.gov/prod-lads/")) | select(.URL | contains("." + $tile + ".")) | .URL] | first // empty')
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "granule $url"
      - name: Compile and upload the VNP46A3 nightlight raster
        run: |
          set -euo pipefail
          cargo run -p omegaflow-harvest --release --bin vnp46a3_compiler -- \
            "${{ steps.granule.outputs.url }}" \
            --label allangle_composite_snow_free \
            --out data/data.laadsdaac.earthdatacloud.nasa.gov/vnp46a3_allangle_composite_snow_free.bin \
            --ci-mode
