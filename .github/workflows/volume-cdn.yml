name: volume-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  tx2019slab:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view data.earthscope.org --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "TX2019slab_percent.r0.0-n4c.volume.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset TX2019slab_percent.r0.0-n4c.volume.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset TX2019slab_percent.r0.0-n4c.volume.bin missing — compiling and manifesting"
          fi
      - name: Compile TX2019slab_percent.r0.0-n4c.volume.bin and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          curl -sSfL https://data.earthscope.org/archive/seismology/products/emc/netcdf/TX2019slab_percent.r0.0-n4c.nc -o TX2019slab_percent.r0.0-n4c.nc
          cargo run -p omegaflow-utils --release --bin volume_builder -- \
            TX2019slab_percent.r0.0-n4c.nc \
            --out TX2019slab_percent.r0.0-n4c.volume.bin --ci-mode --tag data.earthscope.org

