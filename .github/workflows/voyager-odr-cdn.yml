name: voyager-odr-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      url:
        description: ODR source URL
        required: false
        default: https://pds-ppi.igpp.ucla.edu/data/VG2-S-RSS-1-ROCC-V1.0/DATA/C0XR13AA.ODR
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  voyager-odr:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "voyager_odr.bin"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset voyager_odr.bin already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset voyager_odr.bin missing — compiling and manifesting"
          fi
      - name: Ensure the pds-ppi.igpp.ucla.edu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
              --title "pds-ppi.igpp.ucla.edu" \
              --notes "Voyager VG2-S RSS open-loop files packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Compile and manifest the Voyager ODR open-loop file to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin voyager_odr_compiler -- \
            --url "${{ inputs.url }}" \
            --year 1981 \
            --out voyager_odr.bin \
            --ci-mode

  voyager-odr-series:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the series shards already exist on the CDN
        id: idempotence
        run: |
          if gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^voyager_odr_s"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "voyager_odr_s* shards already present — harvest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "voyager_odr_s* shards missing — harvesting the series"
          fi
      - name: Ensure the pds-ppi.igpp.ucla.edu release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view pds-ppi.igpp.ucla.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create pds-ppi.igpp.ucla.edu --repo omegaflow/sources \
              --title "pds-ppi.igpp.ucla.edu" \
              --notes "Voyager VG2-S RSS open-loop files packaged to omegaflow binary assets (CDN tag = netloc)"
          fi
      - name: Harvest the Voyager 2 Saturn ODR series and manifest the shards to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          curl -fsSL https://pds-ppi.igpp.ucla.edu/data/VG2-S-RSS-1-ROCC-V1.0/INDEX/INDEX.TAB -o INDEX.TAB
          cargo run --release -p omegaflow-harvest --bin voyager_odr_compiler -- \
            --index INDEX.TAB \
            --base https://pds-ppi.igpp.ucla.edu/data/VG2-S-RSS-1-ROCC-V1.0/ \
            --ci-mode
