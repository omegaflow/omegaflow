name: vsx-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  vsx:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Compile VSX variable-star index and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin tap_compiler -- \
            --root https://tapvizier.cds.unistra.fr/TAPVizieR/tap/sync \
            --table "B/vsx/vsx" \
            --columns 'ra:RAJ2000;dec:DEJ2000;max:max;min:min;period:Period' \
            --skip-null max \
            --crossmatch 'I/355/gaiadr3:RA_ICRS:DE_ICRS:Dist' \
            --crossmatch-pm 'pmRA:pmDE:Plx:RV:Teff:BPmag:RPmag:Gmag' \
            --out vsx.json \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "flatten: vsx returned void" \
                 "vsx compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
