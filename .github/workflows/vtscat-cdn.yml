name: vtscat-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  vtscat:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if gh release view github.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "vtscat_flux.sky1"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset vtscat_flux.sky1 already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset vtscat_flux.sky1 missing — compiling and manifesting"
          fi
      - name: Ensure the github.com release exists on the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          if ! gh release view github.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create github.com --repo omegaflow/sources \
              --title "github.com" \
              --notes "VERITAS VTSCat spectral flux maps compiled to a SKY1 skymap (kind gamma). One record per source: RA/Dec (ICRS deg), value = fiducial 1-TeV differential flux dnde (m-2 s-1 TeV-1)."
          fi
      - name: Compile the VTSCat flux map and upload to CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin vtscat_compiler -- \
            --out vtscat_flux.sky1 \
            --ci-mode \
            || { bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "vtscat-cdn: vtscat_flux.sky1 returned void" \
                 "VTSCat compile returned void for the VERITAS flux map. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health; exit 1; }
