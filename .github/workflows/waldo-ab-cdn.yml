# harvest: format=waldo_ab asset=present arm=waldo_ab_compiler pattern=^waldo_ab\.csv$ idempotent=true timeout=240 tag=craam-files-bucket.s3.amazonaws.com

name: waldo-ab-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      force:
        description: Re-manifest even when the asset is present
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * 4"

permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  waldo:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Idempotence — skip if the asset already exists on the CDN
        id: idempotence
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "force re-manifest requested — compiling and manifesting"
            exit 0
          fi
          if gh release view craam-files-bucket.s3.amazonaws.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -q "^waldo_ab"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "asset waldo_ab already present — manifest skipped"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "asset waldo_ab missing — compiling and manifesting"
          fi
      - name: Compile and manifest the WALDO A/B MAT-v4 narrowband series to the CDN
        if: steps.idempotence.outputs.present == 'false'
        run: |
          cargo run --release -p omegaflow-harvest --bin waldo_ab_compiler -- --ci-mode
