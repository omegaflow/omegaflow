# harvest: format=raw_wayback arm=raw_mirror pattern=^.*\.dat$ idempotent=true timeout=240 tag=web.archive.org
# WDC-B Moscow / Obninsk seismological catalogue — the live host zeus.wdcb.ru serves only an
# Apache maintenance page and every advertised path is 404; the raw files survive only as
# Internet Archive snapshots of the historical Obninsk/ tree (34 captures, 2003-2019). This is
# the heritage rescue: the raw bytes are held on the CDN so a later session inherits them.
# Each matrix entry carries the registered url/origin/sha256; raw_mirror refuses to upload
# unless the live body hashes to the registered sha256. License: CC-BY-NC-4.0 (page footer).

name: wdcb-obn-wayback-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/harvest/src/bin/raw_mirror.rs'
      - '.github/workflows/wdcb-obn-wayback-cdn.yml'

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  OMEGAFLOW_R2_MIRROR: ${{ vars.OMEGAFLOW_R2_MIRROR }}
  OMEGAFLOW_R2_WORKER: ${{ vars.OMEGAFLOW_R2_WORKER }}

jobs:
  wdcb-obn:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
