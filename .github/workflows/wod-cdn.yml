name: wod-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      year:
        description: WOD year directory (2000..present)
        required: false
        type: string
        default: "2000"
      instrument:
        description: WOD instrument (ctd drb gld mbt mrb osd pfl uor xbt)
        required: false
        type: string
        default: "drb"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  wod:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the noaa-wod-pds.s3.amazonaws.com release exists on the CDN
        run: |
          if ! gh release view noaa-wod-pds.s3.amazonaws.com --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create noaa-wod-pds.s3.amazonaws.com --repo omegaflow/sources \
              --title "noaa-wod-pds.s3.amazonaws.com" \
              --notes "World Ocean Database cast/level rows compiled to a WOD1 geo asset. Record stride: t (f64 LE, TDB), lat (f64 LE, deg), lon (f64 LE, deg), alt (f64 LE, m, negative below the sea surface), freq (f64 LE, 0.0 pad), bin_width (f64 LE, 0.0 pad), val (f64 LE), comp (u32 LE: 1 temperature, 2 salinity, 3 oxygen)."
          fi
      - name: Idempotence — skip if the asset already exists on the CDN
        run: |
          asset="noaa_wod_${{ inputs.year }}_${{ inputs.instrument }}.bin"
          if gh release view noaa-wod-pds.s3.amazonaws.com --repo omegaflow/sources \
             --json assets --jq '.assets[]?.name' 2>/dev/null | grep -qx "$asset"; then
            echo "asset $asset already present — manifest skipped"
            exit 0
          fi
          echo "asset $asset missing — compiling and manifesting"
      - name: Fetch the WOD year granule and the leap-second table
        run: |
          mkdir -p kernels
          curl -sSfL --retry 3 --max-time 120 -o kernels/naif0012.tls \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls
          curl -sSfL --retry 3 --max-time 3600 -o kernels/wod.nc \
            https://noaa-wod-pds.s3.amazonaws.com/${{ inputs.year }}/wod_${{ inputs.instrument }}_${{ inputs.year }}.nc \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "wod-cdn: wod_${{ inputs.instrument }}_${{ inputs.year }}.nc returned void" \
                 "curl on noaa-wod-pds did not reach the ${{ inputs.year }} granule. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
      - name: Compile the WOD cast/level records and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin wod_compiler -- \
            --input kernels/wod.nc \
            --out noaa_wod_${{ inputs.year }}_${{ inputs.instrument }}.bin \
            --lsk kernels/naif0012.tls \
            --ci-mode \
            || bash .github/workflows/scripts/gh_issue_once.sh omegaflow/omegaflow \
                 "wod-cdn: noaa_wod_${{ inputs.year }}_${{ inputs.instrument }}.bin returned void" \
                 "wod compile returned void. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
                 health
