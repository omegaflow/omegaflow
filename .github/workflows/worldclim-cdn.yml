# auto-dispatch: manual — the variable raster URL is a required per-act input; auto-dispatch cannot supply it
name: worldclim-cdn

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      url:
        description: WorldClim 2.1 base raster zip URL (e.g. https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_tavg.zip)
        required: true
        type: string
        default: "https://geodata.ucdavis.edu/climate/worldclim/2_1/base/wc2.1_10m_tavg.zip"
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  worldclim:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Ensure the geodata.ucdavis.edu release exists on the CDN
        run: |
          if ! gh release view geodata.ucdavis.edu --repo omegaflow/sources >/dev/null 2>&1; then
            gh release create geodata.ucdavis.edu --repo omegaflow/sources \
              --title "geodata.ucdavis.edu" \
              --notes "WorldClim 2.1 monthly climatology GeoTIFFs compiled to ICRS records; magic WCLM, 8-byte header then n x 26 f64 (temperature K, precipitation mm), monthly cadence."
          fi
      - name: Compile the WorldClim rasters and upload to CDN
        run: |
          cargo run -p omegaflow-harvest --release --bin worldclim_compiler -- \
            --body earth \
            --out out \
            --url "${{ inputs.url }}" \
            --ci-mode
  series-manifest:
    needs: [worldclim]
    if: always() && needs.worldclim.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Fold every worldclim shard on the CDN into the year-less series manifest
        run: |
          set -euo pipefail
          FAMILY="geodata.ucdavis.edu"
          PREFIX="worldclim_"
          MANIFEST="worldclim.manifest"
          REPO="omegaflow/sources"
          tmp="$(mktemp -d)"
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            | jq -r '.[].tag_name' > "$tmp/tags"
          : > "$tmp/$MANIFEST"
          while IFS= read -r tag; do
            case "$tag" in
              "$FAMILY"|"$FAMILY"-*) ;;
              *) continue ;;
            esac
            gh release view "$tag" --repo "$REPO" \
              --json assets \
              --jq ".assets[] | select(.name|startswith(\"$PREFIX\")) | select(.name|endswith(\".bin\")) | \"\(.name) \(.digest)\"" \
              >> "$tmp/$MANIFEST"
          done < "$tmp/tags"
          sort -u -o "$tmp/$MANIFEST" "$tmp/$MANIFEST"
          if [ ! -s "$tmp/$MANIFEST" ]; then
            echo "no worldclim shards on the CDN — the series manifest stays unwritten (0 honored)"
            exit 0
          fi
          echo "$MANIFEST lists $(wc -l < "$tmp/$MANIFEST") shards"
          gh release upload "$FAMILY" "$tmp/$MANIFEST" --clobber --repo "$REPO"
