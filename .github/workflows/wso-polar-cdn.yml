name: wso-polar-cdn
on:
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ secrets.OMEGAFLOW_TOKEN }}
  RUSTFLAGS: -D warnings
jobs:
  wso-polar:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Compile WSO polar field 1976-2026 once and upload to CDN
        run: |
          mkdir -p kernels
          gh release download ssd.jpl.nasa.gov --repo omegaflow/sources \
            --pattern wso_polar.bin --clobber 2>/dev/null || \
            cargo run -p omegaflow-harvest --release --bin wso_polar_compiler -- \
              --out wso_polar.bin --ci-mode
