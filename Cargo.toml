[package]
name = "omegaflow"
version = "1.0.0"
authors = ["omegaflow"]
edition = "2024"
license = "CC-BY-NC-SA-4.0"
description = "φ(x,y,z,t)"
repository = "https://github.com/omegaflow/omegaflow"
homepage = "https://omegaflow.space"
default-run = "omegaflow"

[features]
default = ["gpu"]
gpu = ["dep:wgpu", "dep:winit", "dep:pollster"]
browser_relay = []

[dependencies]
wgpu = { version = "24", optional = true }
winit = { version = "0.30", optional = true }
pollster = { version = "0.4", optional = true }
