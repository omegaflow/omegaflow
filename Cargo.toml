[package]
name = "omegaflow"
version = "1.0.0"
authors = ["omegaflow"]
edition = "2024"
license = "CC-BY-NC-SA-4.0"
description = "φ(x,y,z,t)"
repository = "https://github.com/omegaflow/omegaflow"
homepage = "https://omegaflow.space"
default-run = "omegaflow"

[features]
browser_relay = []
gamepad = ["dep:gilrs"]

[dependencies]
wgpu = "24"
winit = "0.30"
pollster = "0.4"
serialport = { version = "4", default-features = false }
gilrs = { version = "0.11", optional = true }

[dev-dependencies]
naga = "24"
