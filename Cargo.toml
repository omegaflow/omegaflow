[package]
name = "omegaflow"
version = "1.0.0"
authors = ["omegaflow"]
edition = "2024"
license-file = "LICENSE"
description = "φ(x,y,z,t)"
repository = "https://github.com/omegaflow/omegaflow"
homepage = "https://omegaflow.space"

[workspace]
members = [
    "tools/app",
    "tools/gate",
    "tools/harvest",
    "tools/measure",
    "tools/membrane",
    "tools/register",
    "tools/science",
    "tools/service",
    "tools/utils",
]
default-members = ["."]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
browser_relay = []
commit_gate = []

[dev-dependencies]
cdshealpix = "0.10"
time = { version = "0.3", features = ["parsing"] }
tungstenite = "0.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
