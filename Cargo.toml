[package]
name = "omegaflow"
version = "1.0.0"
authors = ["omegaflow"]
edition = "2024"
license-file = "LICENSE"
description = "φ(x,y,z,t)"
repository = "https://github.com/omegaflow/omegaflow"
homepage = "https://omegaflow.space"
default-run = "omegaflow"

[workspace]
members = [
    "tools/gate",
    "tools/harvest",
    "tools/measure",
    "tools/register",
    "tools/science",
    "tools/service",
    "tools/utils",
]
default-members = ["."]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
browser_relay = []
commit_gate = []

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "24"
