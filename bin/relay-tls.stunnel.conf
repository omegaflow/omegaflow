; relay-tls.stunnel.conf — external TLS terminator for the wireless sensor relay.
;
; Reverse-proxies HTTPS on :1619 to the plain-HTTP relay on 127.0.0.1:1618.
; The relay (src/) is untouched — std + curl + serialport hold. This file is the
; transport wrapper only. Certificate material is not tracked: it lives under
; state/tls/ (gitignored), generated once by the operator.

[relay-tls]
accept  = 0.0.0.0:1619
connect = 127.0.0.1:1618
cert    = /home/johannes/projects/omegaflow/state/tls/relay-leaf.pem
key     = /home/johannes/projects/omegaflow/state/tls/relay-leaf.key

; --- CA generation + phone trust (companion commands, run once by the operator) ---
;
; 1. Local CA (self-signed root) — install ONLY ca.pem on the phone, never the key:
;    openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
;      -keyout state/tls/ca.key -out state/tls/ca.pem \
;      -subj "/CN=omegaflow-relay-ca"
;
; 2. Leaf cert for the LAN IP — the SAN carries the IP, not a DNS name.
;    Replace 192.168.0.0 with the real LAN IP (the value is pending until measured):
;    openssl req -newkey rsa:2048 -nodes \
;      -keyout state/tls/relay-leaf.key -out state/tls/relay-leaf.csr \
;      -subj "/CN=omegaflow-relay"
;    openssl x509 -req -in state/tls/relay-leaf.csr \
;      -CA state/tls/ca.pem -CAkey state/tls/ca.key -CAcreateserial \
;      -days 825 -out state/tls/relay-leaf.pem \
;      -extfile <(printf "subjectAltName=IP:192.168.0.0")
;
; 3. Trust the CA on the phone (Android):
;    Settings → Security → Encryption & credentials → Install a certificate →
;    CA certificate → choose ca.pem.
;    iOS: AirDrop ca.pem, open it, install the profile, then Settings → General →
;    About → Certificate Trust Settings → enable full trust for omegaflow-relay-ca.
;
; 4. Start the terminator, then the relay (OMEGAFLOW_HIDDEN unset):
;    stunnel bin/relay-tls.stunnel.conf
;    bin/omegaflow
;
; 5. Consent + verify:
;    open https://<lan-ip>:1619/consent?ja
;    archive_search --verdict https://<lan-ip>:1619/
;    archive_search --sniff  https://<lan-ip>:1619/
