name = "omegaflow-email-recv"
main = "email_worker.js"
compatibility_date = "2026-08-25"
account_id = ""  # CLOUDFLARE_ACCOUNT_ID (env / .secrets.local)

[vars]
FORWARD_TO = ""  # operator address (env / .secrets.local)

[observability]
enabled = true

[[kv_namespaces]]
binding = "MAIL_QUEUE"
id = "REPLACE_WITH_WRANGLER_KV_NAMESPACE_ID"

[triggers]
crons = ["*/5 * * * *"]
