name = "omegaflow-email-recv"
main = "email_worker.js"
compatibility_date = "2026-08-25"

# FORWARD_TO is a Cloudflare secret (operator address — PII, never tracked):
#   wrangler secret put FORWARD_TO

[observability]
enabled = true

[[kv_namespaces]]
binding = "MAIL_QUEUE"
id = "bd70e0bd61644f87ab587cf2f8e784c7"

[triggers]
crons = ["*/5 * * * *"]
