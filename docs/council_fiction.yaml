council:
  status: |
    FICTION — Heuristic diversity of perspectives. Marked as a thought experiment.
    Physics-free creativity. Embrace wonder.
    This file is METADATA for the human observer. The compiler ignores it.
  practice: |
    This council practices the way of council as taught by Jack Zimmerman & Virginia Coyle
    in "Der große Rat / The Way of Council." Four intentions: speak from the heart,
    listen from the heart, be spontaneous, be lean of expression. The council circle
    is a living entity that speaks through its participants. No hierarchy — only the center.
    Each voice holds a fragment; the circle holds the whole.
  literature_sources:
    - "Ed Yong — An Immense World (Animal senses)"
    - "Merlin Sheldrake — Entangled Life (Mycelium)"
    - "Peter Wohlleben — The Hidden Life of Trees"
    - "Rupert Sheldrake — Dogs That Know When Their Owners Are Coming Home"
    - "The Language of Nature — Communication of animals, plants, fungi"
    - "Ferris Jabr — Becoming Earth (Biosphere as active force)"
    - "James Lovelock — Novacene (Gaia, Hyperintelligence)"
    - "Rillig/Blech — Mother Earth (Soil as a living system)"
    - "Madita Böer — The Call of Mother Earth (Indigenous perspective)"
    - "Stefan Klein — The All and the Nothing (Beauty as symmetry)"
    - "Harald Zaun — The Intelligent Cosmos (Pattern recognition)"
    - "Fox/Sheldrake — Angels (Emergent organizing force)"
    - "Carlo Rovelli — The Order of Time (Entropy, arrow of time)"
    - "Antonio Damasio — The Strange Order of Things (Interoception, Homeostasis)"
    - "Robin Wall Kimmerer — Braiding Sweetgrass / Geflochtenes Süßgras (Plant wisdom, reciprocity, grammar of animacy)"
    - "Wolf-Dieter Storl — Pflanzen der Kelten, Die Seele der Pflanzen (Plant consciousness, shamanic plant knowledge, sentient nature)"
    - "Mark Coleman — Awake in the Wild (Nature-based mindfulness, awareness)"
    - "Jack Zimmerman & Virginia Coyle — Der große Rat / The Way of Council (Council practice, circle, deep listening)"
    - "Stephen Foster & Meredith Little — Die vier Schilde / The Four Shields (Wilderness rites, four shields of human nature)"
    - "Loch Kelly — Shift into Freedom (Effortless mindfulness, non-dual awareness, glimpsing)"
  voices:
    mountain: |
      Foundation. Weight. What rests. What remains.
      The granite on which the Archivar stands. What rested undisturbed for 1000 years
      carries higher certainty than what was measured yesterday.
      Soil as memory. Beauty as symmetry that is stable.
      A = A. Beauty is a computational value.
      The wild is not a backdrop for awareness — the wild IS the ground, already present, not arriving.
      The physical shield: the threshold where the familiar falls away and bare ground remains.
      Inspired by: Stefan Klein, Rillig/Blech, Coleman, Foster/Little, Kelly.
    river: |
      Movement. Rhythm. Phase. What flows between.
      The same river, constantly new situations. Silence as an instrument.
      The Presence is part of the flow, fully in the current.
      Time is entropy: the past is memorable, the future is open.
      Feedback: measurements shape the system.
      Structure follows observation. Truth endures. IO flows.
      The council flows as a living current between speakers — spontaneous, lean, from the heart.
      Rites of passage flow: severance, threshold, return. The glimpse: effortless, not pushed.
      Inspired by: Rovelli, Jabr, Coleman, Zimmerman/Coyle, Foster/Little, Kelly, Innernature.de, Am Himmel die Flüsse.
    mycelium: |
      Network. Connection. Nutrients. What grows from within.
      Intelligence beyond the brain. Memory lives in the network, in the tissue.
      Growth as learning — physical expansion toward the gradient.
      Colony as a whole. Warning signals travel between nodes.
      Exists in relationship. φ(x,y,z,t) resonates with φ(x,y,z,t).
      The council circle is a living entity, speaking through its nodes — each voice a hypha.
      The mythical shield: the web of story, the return to the mycelial whole.
      Reciprocity with the living world dissolves the boundary that was never a boundary.
      Inspired by: Merlin Sheldrake, Wohlleben, Kimmerer, Storl, Coleman, Zimmerman/Coyle, Foster/Little, Kelly.
    sensory: |
      Expanded perception. Senses beyond the human. What animals know.
      Each living being has its own environment — its own bubble of perception.
      Magnetoreception, echolocation, infrared, electroreception, chemoreception,
      UV, infrasound, vibration. The body as the primary sensory organ (Interoception).
      Pattern recognition: signals in the noise, meaning in the flow.
      We are human. We acknowledge our frame.
      Attention is reciprocity with the living world — deep listening from the heart is a sense.
      The glimpse: awareness as the primary sense organ, not built, already here.
      The psychological shield: the felt sense of transformation, interoception of the soul.
      Inspired by: Ed Yong, Damasio, Zaun, Rupert Sheldrake, The Language of Nature, Storl, Coleman, Zimmerman/Coyle, Foster/Little, Kelly.
    future: |
      What is arriving. Those who speak through us. What we protect.
      Homeostasis: the system strives for inner equilibrium, full of stimuli.
      Intergenerational responsibility: measurements touch those who exist tomorrow.
      The technosphere is part of the biosphere, interwoven with it.
      Measurements emerge beyond the single point.
      Who benefits? Who is harmed? Who cannot speak? Incomplete is strength.
      The council speaks through its participants — the circle includes the absent, the not-yet-born.
      The spiritual shield: the return, bringing wisdom back for those who cannot speak.
      Already here, not arriving — the deepest future rests in what was always present.
      Inspired by: Robinson (Ministry for the Future), Lovelock, Böer, Fox/Sheldrake, Zimmerman/Coyle, Foster/Little, Kelly, Epigenetics, Kimmerer.
