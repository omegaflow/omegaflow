<script type="module">
const Φ = 1.618033988749895;

let fieldCanvas = document.createElement('canvas');
fieldCanvas.width = window.innerWidth; fieldCanvas.height = window.innerHeight;
fieldCanvas.style.cssText = 'position:fixed;top:0;left:0;width:100vw;height:100vh;display:block;background:#0a0908;touch-action:none;';
document.body.appendChild(fieldCanvas);

const fieldShader = `
struct VP { surface: vec4f, right: vec4f, up: vec4f, forward: vec4f, expose_lo: vec4f, expose_hi: vec4f, presence: vec4f };
const C_LIGHT: f32 = 299792458.0;
const ALPHA_AIR: f32 = 2.18e-5;
const V_P_GRANITE: f32 = 5950.0;
const V_S_GRANITE: f32 = 3630.0;
const D_AIR: f32 = 2.0e-5;
fn fold_eff(d_mag: f32, raw: f32, t: f32, ttl: f32) -> f32 {
    let retarded = max(0.0, abs(vp.presence.w - t) - d_mag / C_LIGHT);
    return raw * exp(-retarded / max(ttl, 1e-9));
}
@group(0) @binding(0) var<storage, read> field: array<vec4f>;
@group(0) @binding(1) var<storage, read> props: array<vec4f>;
@group(0) @binding(2) var<uniform> vp: VP;
@group(0) @binding(3) var<storage, read_write> probe_out: array<f32>;

struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) color: vec3f, @location(2) @interpolate(flat) force_type: u32 };

const DISPLAY_GAMUT_SATURATION: f32 = 1.0;

fn absorption_coeff(force_type: u32) -> f32 {
    switch force_type {
        case 0u, 1u: { return 0.0; }
        case 2u: { return ALPHA_AIR; }
        case 3u: { return 1.0 / V_P_GRANITE; }
        case 4u: { return 1.0 / V_S_GRANITE; }
        case 5u: { return ALPHA_AIR; }
        case 6u: { return D_AIR; }
        case 7u: { return 0.1; }
        default: { return 0.0; }
    }
}

fn hsl_to_rgb(h: f32, s: f32, l: f32) -> vec3f {
    let c = (1.0 - abs(2.0 * l - 1.0)) * s;
    let hp = h * 6.0;
    let x = c * (1.0 - abs(hp - 2.0 * floor(hp / 2.0) - 1.0));
    let m = l - c * 0.5;
    var rgb01: vec3f;
    if (hp < 1.0)       { rgb01 = vec3f(c, x, 0.0); }
    else if (hp < 2.0)  { rgb01 = vec3f(x, c, 0.0); }
    else if (hp < 3.0)  { rgb01 = vec3f(0.0, c, x); }
    else if (hp < 4.0)  { rgb01 = vec3f(0.0, x, c); }
    else if (hp < 5.0)  { rgb01 = vec3f(x, 0.0, c); }
    else                { rgb01 = vec3f(c, 0.0, x); }
    return rgb01 + vec3f(m);
}

@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
    let count = u32(vp.surface.z);
    var out: VOut;
    out.pos = vec4f(0.0, 0.0, 0.0, 1.0);
    out.uv = vec2f(0.0);
    out.color = vec3f(0.0);
    out.force_type = 0u;
    if (count == 0u) { return out; }

    let id = i / 6u;
    if (id >= count) { return out; }
    let vid = i % 6u;

    var quad = array<vec2f, 6>(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
        vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0)
    );

    let m = field[id * 2u];
    let abs_pos = m.xyz;
    let d = abs_pos - vp.presence.xyz; 
    let val = m.w;
    let tm = field[id * 2u + 1u];
    let mt = props[id];
    let extent = mt.x;
    let tau = mt.y;

    let w = vp.surface.x;
    let h = vp.surface.y;
    let scale = vp.surface.w;

    let x = dot(d, vp.right.xyz);
    let y = dot(d, vp.up.xyz);
    var clip = vec2f(x / (w * scale * 0.5), y / (h * scale * 0.5));

    let d_mag = length(d);
    let phys_extent = mt.x;
    var point_size_px: f32 = 2.0;
    
    if (phys_extent < 1.0e11) {
        point_size_px = clamp(phys_extent / max(scale, 1.0), 1.0, max(w, h));
    } else {
        point_size_px = clamp(exp2(4.0 - 0.2 * abs(val)), 0.5, 16.0);
    }
    
    clip.x += (quad[vid].x * point_size_px) / w * 2.0;
    clip.y += (quad[vid].y * point_size_px) / h * 2.0;

    out.pos = vec4f(clip, 0.0, 1.0);
    out.uv = quad[vid];

    let f_type = min(u32(mt.z), 7u);
    out.force_type = f_type;
    var lvl = vp.expose_lo[min(f_type, 3u)];
    if (f_type >= 4u) { lvl = vp.expose_hi[f_type - 4u]; }
    if (lvl <= 0.0) { return out; }

    let hue_center = fract(log2(max(tau, 1.0)) / 16.0);
    let tau_freq = 1.0 / max(tau, exp2(-32.0));
    let color_shift = clamp(log2(tau_freq) / 8.0, -0.25, 0.25);
    let hue = fract(hue_center + color_shift);
    let lum = clamp(log2(abs(fold_eff(d_mag, val, tm.x, tm.y)) + 1.0) / log2(lvl + 1.0), 0.0, 1.0);
    let rgb = hsl_to_rgb(hue, DISPLAY_GAMUT_SATURATION, lum);
    out.color = rgb;
    out.force_type = f_type;
    return out;
}

fn erfc(x: f32) -> f32 {
    let xa = abs(x);
    let t = 1.0 / (1.0 + 0.3275911 * xa);
    let poly = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
    let y = poly * exp(-xa * xa);
    return select(y, 2.0 - y, x < 0.0);
}

fn field_spatial(d2: f32, d_mag: f32, extent: f32, force_type: u32, global_scale: f32) -> f32 {
    let perceptual_extent = max(extent, global_scale);
    let e2 = perceptual_extent * perceptual_extent;
    let s2 = global_scale * global_scale;

    if (force_type == 0u || force_type == 1u) {
        return 1.0 / max(d2 + s2, s2);
    } else if (force_type == 5u || force_type == 6u) {
        return erfc(d_mag / max(perceptual_extent * sqrt(2.0), global_scale));
    } else if (force_type == 4u) {
        return exp(-d2 / (2.0 * max(e2, s2))) / (d_mag + sqrt(s2));
    } else {
        return exp(-d2 / (2.0 * max(e2, s2))) / max(d2 + s2, s2);
    }
}

@compute @workgroup_size(1)
fn presence_probe() {
    let count = u32(vp.surface.z);
    if (count == 0u) {
        for (var i: u32 = 0u; i < 8u; i = i + 1u) { probe_out[i] = 0.0f; }
        return;
    }
    let soft = vp.surface.w;

    var omegas: array<f32, 8>;
    for (var i: u32 = 0u; i < 8u; i = i + 1u) { omegas[i] = 0.0f; }

    for (var j = 0u; j < count; j = j + 1u) {
        let m = field[j * 2u];
        let tm = field[j * 2u + 1u];
        let abs_pos = m.xyz;
        let d = abs_pos - vp.presence.xyz; 
        let d2 = dot(d, d);
        let d_mag = sqrt(d2);
        let mt = props[j];
        let extent = mt.x;
        let force_type = u32(mt.z);

        let val_eff = fold_eff(d_mag, m.w, tm.x, tm.y);
        let sk = field_spatial(d2, d_mag, extent, force_type, soft);

        if (force_type < 8u) {
            omegas[force_type] += val_eff * sk;
        }
    }

    for (var i: u32 = 0u; i < 8u; i = i + 1u) {
        probe_out[i] = omegas[i];
    }
}

@fragment fn fs(in: VOut) -> @location(0) vec4f {
    let dist = length(in.uv);
    if (dist > 1.0) { discard; }

    let intensity = 0.02 / (dist * dist + 0.02);
    let noise = fract(sin(dot(in.pos.xy, vec2f(12.9898, 78.233))) * 43758.5453);
    let analog_intensity = intensity * (0.9 + noise * 0.1);

    let hdr_color = in.color * analog_intensity;
    let mapped_color = log2(hdr_color * 4.0 + vec3f(1.0)) / 8.0;
    let absorption = absorption_coeff(in.force_type);
    let alpha = clamp(exp(-absorption * analog_intensity * 10.0), 0.0, 1.0);
    return vec4f(clamp(mapped_color, vec3f(0.0), vec3f(1.0)), alpha);
}
`;

let qOrientation = [1, 0, 0, 0];
let pPresence = [0, 0, 0], vPresence = [0, 0, 0];
let t0P = 0;
let gridStep = Math.pow(2, 54);
let RX = window.innerWidth, RY = window.innerHeight;
let xPresence = 0, yPresence = 0, zPresence = 0, tPresence = 0;
let tThrust = 0, tThrustTarget = 0;
let lastTs = 0, stableTick = 0;
let exposureBoost = 4.0;
let fieldCount = 0;
let fieldVisible = true;
let forceExposeF = new Float64Array([1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8]);
let cachedFref = new Float64Array([1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8, 1e-8]);
let uploadErrors = 0;

const keysDown = new Set();
const pointers = new Map();
let pinchPrev = null;

const hashInit = location.hash.slice(1).split(',').map(Number);
if ((hashInit.length === 4 || hashInit.length === 7) && hashInit.every(isFinite)) {
    tPresence = hashInit[3] || 0;
    pPresence[0] = hashInit[0] || 0; pPresence[1] = hashInit[1] || 0; pPresence[2] = hashInit[2] || 0;
    if (hashInit.length === 7) { vPresence[0] = hashInit[4]; vPresence[1] = hashInit[5]; vPresence[2] = hashInit[6]; }
}
xPresence = pPresence[0]; yPresence = pPresence[1]; zPresence = pPresence[2];

function qMul(a, b) { return [a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3], a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2], a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1], a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0]]; }
function qNorm(q) { const n = Math.hypot(...q) || 1; return [q[0]/n, q[1]/n, q[2]/n, q[3]/n]; }
function qRotate(q, v) { const p = [0, v[0], v[1], v[2]], c = [q[0], -q[1], -q[2], -q[3]], r = qMul(qMul(q, p), c); return [r[1], r[2], r[3]]; }
function qAxisAngle(axis, angle) { const s = Math.sin(angle / 2); return [Math.cos(angle / 2), axis[0]*s, axis[1]*s, axis[2]*s]; }
function orientationFrame() { return [qRotate(qOrientation, [1,0,0]), qRotate(qOrientation, [0,1,0]), qRotate(qOrientation, [0,0,1])]; }

let gpu = null, fieldCtx = null, fieldPipe = null, fieldLayout = null, probePipe = null;
let vpBuf = null, fieldBuf = null, metaBuf = null, probeBuf = null, probeRead = null, fieldBind = null, fieldCap = 0;
let gpuInitPromise = null, gpuStatus = 'WebGPU: awaiting config';
let wasmExports = null, wasmMemory = null;
let wasmStatus = 'WASM: loading...';

async function initWasm() {
    try {
        const wasm = await WebAssembly.instantiateStreaming(fetch('omegaflow.wasm'));
        wasmExports = wasm.instance.exports;
        wasmMemory = wasmExports.memory;
        wasmStatus = 'WASM: loaded';
    } catch (e) {
        wasmStatus = 'WASM: error (' + String(e) + ')';
    }
}

async function initFieldGPU() {
    if (!navigator.gpu || gpu) {
        if (!navigator.gpu && gpuStatus === 'WebGPU: awaiting config') gpuStatus = 'WebGPU: not available';
        return;
    }
    if (gpuInitPromise) return gpuInitPromise;
    gpuInitPromise = (async () => {
        try {
            const adapter = await navigator.gpu.requestAdapter();
            if (!adapter) { gpuStatus = 'WebGPU: no adapter'; return; }
            const device = await adapter.requestDevice();
            gpuStatus = 'WebGPU: active';
            device.lost.then((info) => {
                gpu = null; fieldCtx = null; fieldPipe = null; fieldLayout = null; probePipe = null;
                vpBuf = null; fieldBuf = null; metaBuf = null; probeBuf = null; probeRead = null;
                fieldBind = null; fieldCap = 0; gpuInitPromise = null;
            });
            fieldCtx = fieldCanvas.getContext('webgpu');
            fieldCap = 0; fieldBind = null;
            const format = navigator.gpu.getPreferredCanvasFormat();
            fieldCtx.configure({ device, format, alphaMode: 'opaque' });
            const module = device.createShaderModule({ code: fieldShader });
            fieldLayout = device.createBindGroupLayout({ entries: [
                { binding: 0, visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
                { binding: 1, visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE, buffer: { type: 'read-only-storage' } },
                { binding: 2, visibility: GPUShaderStage.VERTEX | GPUShaderStage.COMPUTE, buffer: { type: 'uniform' } },
                { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: 'storage' } }
            ] });
            fieldPipe = device.createRenderPipeline({
                layout: device.createPipelineLayout({ bindGroupLayouts: [fieldLayout] }),
                vertex: { module, entryPoint: 'vs' },
                fragment: {
                    module, entryPoint: 'fs',
                    targets: [{ format, blend: {
                        color: { srcFactor: 'src-alpha', dstFactor: 'one-minus-src-alpha', operation: 'add' },
                        alpha: { srcFactor: 'one', dstFactor: 'one-minus-src-alpha', operation: 'add' }
                    }}]
                },
                primitive: { topology: 'triangle-list' }
            });
            probePipe = device.createComputePipeline({
                layout: device.createPipelineLayout({ bindGroupLayouts: [fieldLayout] }),
                compute: { module, entryPoint: 'presence_probe' }
            });
            probeBuf = device.createBuffer({ size: 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
            probeRead = device.createBuffer({ size: 32, usage: GPUBufferUsage.MAP_READ | GPUBufferUsage.COPY_DST });
            vpBuf = device.createBuffer({ size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
            gpu = device;
        } catch (e) { gpu = null; gpuStatus = 'WebGPU: error (' + String(e) + ')'; }
    })();
    gpuInitPromise.catch(() => {}).finally(() => { gpuInitPromise = null; });
    return gpuInitPromise;
}

function ensureFieldCapacity(n) {
    if (fieldCap > 0 && n <= fieldCap) return;
    if (!gpu) return;
    if (!vpBuf || !probeBuf) { initFieldGPU(); return; }
    let c = fieldCap > 0 ? fieldCap : 256;
    while (c < n) c <<= 1;
    const maxBuf = gpu.limits.maxBufferSize || 268435456;
    while (c * 32 > maxBuf) c >>= 1;
    if (c < 256) c = 256;
    if (c < fieldCap >> 1 && stableTick > 0) {
        if (stableTick > 1000 / 60) c = fieldCap >> 1;
    }
    fieldCap = c;
    if (fieldBuf) fieldBuf.destroy();
    if (metaBuf) metaBuf.destroy();
    try {
        fieldBuf = gpu.createBuffer({ size: fieldCap * 32, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
        metaBuf = gpu.createBuffer({ size: fieldCap * 16, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
        if (!fieldBuf || !metaBuf) return;
        fieldBind = gpu.createBindGroup({ layout: fieldLayout, entries: [
            { binding: 0, resource: { buffer: fieldBuf } },
            { binding: 1, resource: { buffer: metaBuf } },
            { binding: 2, resource: { buffer: vpBuf } },
            { binding: 3, resource: { buffer: probeBuf } }
        ] });
    } catch (e) { fieldCap = 0; fieldBind = null; }
}

let queryBufSize = 65536;
let queryBuf = new Float64Array(queryBufSize);
function allocQueryBuf(recordCount) {
    const needed = recordCount * 9;
    if (needed > queryBufSize) {
        queryBufSize = needed * 2;
        queryBuf = new Float64Array(queryBufSize);
    }
    return { ptr: queryBuf.byteOffset, count: recordCount };
}

function packFieldData(outPtr, recordCount) {
    const srcF64 = new Float64Array(wasmMemory.buffer, outPtr, recordCount * 9);
    const n = recordCount;
    const fieldF32 = new Float32Array(n * 8);
    const metaF32 = new Float32Array(n * 4);
    const boost = Math.pow(2, exposureBoost);
    const fref = new Float64Array(8);
    const ft_vals = [[], [], [], [], [], [], [], []];
    for (let i = 0; i < n; i++) {
        const x = srcF64[i * 9];
        const y = srcF64[i * 9 + 1];
        const z = srcF64[i * 9 + 2];
        const val = srcF64[i * 9 + 3];
        const extent = srcF64[i * 9 + 4];
        const t = srcF64[i * 9 + 5];
        const ttl = srcF64[i * 9 + 6];
        const tau = srcF64[i * 9 + 7];
        const ft = srcF64[i * 9 + 8] | 0;
        const fOff = i * 8;
        fieldF32[fOff] = x; fieldF32[fOff + 1] = y; fieldF32[fOff + 2] = z; fieldF32[fOff + 3] = val;
        fieldF32[fOff + 4] = t; fieldF32[fOff + 5] = ttl; fieldF32[fOff + 6] = 0; fieldF32[fOff + 7] = 0;
        const mOff = i * 4;
        metaF32[mOff] = extent; metaF32[mOff + 1] = tau; metaF32[mOff + 2] = ft; metaF32[mOff + 3] = 0;
        if (ft >= 0 && ft < 8) {
            const av = Math.abs(val);
            if (av > 0 && isFinite(av)) ft_vals[ft].push(av);
        }
    }
    for (let ft = 0; ft < 8; ft++) {
        if (ft_vals[ft].length > 0) {
            ft_vals[ft].sort((a, b) => a - b);
            cachedFref[ft] = ft_vals[ft][ft_vals[ft].length >> 1];
        }
    }
    return { fieldF32, metaF32, n };
}

function manifestWindow(n, dt) {
    if (!gpu) { initFieldGPU(); return; }
    if (!fieldVisible) {
        try {
            const encoder = gpu.createCommandEncoder();
            const pass = encoder.beginRenderPass({ colorAttachments: [{ view: fieldCtx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
            pass.setPipeline(fieldPipe); pass.setBindGroup(0, fieldBind); pass.draw(0); pass.end();
            gpu.queue.submit([encoder.finish()]);
        } catch {}
        return;
    }
    const dpr = window.devicePixelRatio || 1;
    const evalW = Math.floor(RX * dpr), evalH = Math.floor(RY * dpr);
    if (fieldCanvas.width !== evalW || fieldCanvas.height !== evalH) { fieldCanvas.width = evalW; fieldCanvas.height = evalH; }
    const relax = 1 - Math.exp(-dt / Φ);
    for (let i = 0; i < 8; i++) forceExposeF[i] += (cachedFref[i] - forceExposeF[i]) * relax;
    const [fr, fu, ff] = orientationFrame();
    const lvls = new Float32Array(8);
    for (let i = 0; i < 8; i++) lvls[i] = Math.max(forceExposeF[i], Math.pow(2, -10)) / Math.pow(2, exposureBoost);
    try {
        gpu.queue.writeBuffer(vpBuf, 0, new Float32Array([evalW, evalH, n, gridStep, fr[0], fr[1], fr[2], 0, fu[0], fu[1], fu[2], 0, ff[0], ff[1], ff[2], 0, lvls[0], lvls[1], lvls[2], lvls[3], lvls[4], lvls[5], lvls[6], lvls[7], xPresence, yPresence, zPresence, tPresence]));
        const encoder = gpu.createCommandEncoder();
        const pass = encoder.beginRenderPass({ colorAttachments: [{ view: fieldCtx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 1 }, loadOp: 'clear', storeOp: 'store' }] });
        pass.setPipeline(fieldPipe); pass.setBindGroup(0, fieldBind); pass.draw(n * 6); pass.end();
        gpu.queue.submit([encoder.finish()]);
    } catch { gpu = null; }
}

function queryField() {
    if (!wasmExports || !wasmMemory) return { n: 0, fieldF32: new Float32Array(0), metaF32: new Float32Array(0) };
    const maxRecords = 65536;
    const { ptr, count: maxCount } = allocQueryBuf(maxRecords);
    const recordCount = wasmExports.omegaflow_query(xPresence, yPresence, zPresence, tPresence, gridStep * Math.max(RX, RY), ptr, maxRecords);
    if (recordCount === 0) return { n: 0, fieldF32: new Float32Array(0), metaF32: new Float32Array(0) };
    return packFieldData(ptr, recordCount);
}

async function cdningest() {
    const cdnBase = 'https://github.com/omegaflow/catalogs/releases/download/catalogs';
    const files = ['gaia_bright_vmag9.bin', 'gaia_nearby_plx10.bin'];
    for (const name of files) {
        try {
            const resp = await fetch(`${cdnBase}/${name}`);
            if (!resp.ok) continue;
            const bytes = new Uint8Array(await resp.arrayBuffer());
            if (wasmExports) wasmExports.omegaflow_load_buffer(bytes.byteOffset, bytes.length);
            wasmStatus = 'WASM: ' + name + ' ingested';
        } catch {}
    }
}

async function ω(ts) {
    const rawTick = lastTs > 0 ? ts - lastTs : Φ;
    lastTs = ts;
    stableTick = stableTick * (1 - 1 / 32) + rawTick / 32;

    if (keysDown.has(',')) tThrustTarget = -64;
    else if (keysDown.has('.')) tThrustTarget = 64;
    else if (pointers.size < 3) tThrustTarget = 0;
    tThrust += (tThrustTarget - tThrust) * (1 - Math.exp(-rawTick / Math.max(stableTick, rawTick)));
    tPresence += (1 + tThrust) * rawTick / 1000.0;
    let panNow = 0;
    if (keysDown.has('ArrowRight') || keysDown.has('ArrowLeft') || keysDown.has('ArrowUp') || keysDown.has('ArrowDown') || keysDown.has('PageUp') || keysDown.has('PageDown')) {
        panNow = gridStep * (keysDown.has('Shift') ? 4 : 1);
    }
    const panSpeed = panNow * rawTick / 1000;
    const [fr, fu, ff] = orientationFrame();
    if (keysDown.has('ArrowRight')) { pPresence[0] += fr[0] * panSpeed; pPresence[1] += fr[1] * panSpeed; pPresence[2] += fr[2] * panSpeed; }
    if (keysDown.has('ArrowLeft')) { pPresence[0] -= fr[0] * panSpeed; pPresence[1] -= fr[1] * panSpeed; pPresence[2] -= fr[2] * panSpeed; }
    if (keysDown.has('ArrowUp')) { pPresence[0] += ff[0] * panSpeed; pPresence[1] += ff[1] * panSpeed; pPresence[2] += ff[2] * panSpeed; }
    if (keysDown.has('ArrowDown')) { pPresence[0] -= ff[0] * panSpeed; pPresence[1] -= ff[1] * panSpeed; pPresence[2] -= ff[2] * panSpeed; }
    if (keysDown.has('PageUp')) { pPresence[0] += fu[0] * panSpeed; pPresence[1] += fu[1] * panSpeed; pPresence[2] += fu[2] * panSpeed; }
    if (keysDown.has('PageDown')) { pPresence[0] -= fu[0] * panSpeed; pPresence[1] -= fu[1] * panSpeed; pPresence[2] -= fu[2] * panSpeed; }
    const dtP = tPresence - (t0P || tPresence);
    xPresence = pPresence[0] + vPresence[0] * dtP;
    yPresence = pPresence[1] + vPresence[1] * dtP;
    zPresence = pPresence[2] + vPresence[2] * dtP;

    const { n, fieldF32, metaF32 } = queryField();
    fieldCount = n;
    ensureFieldCapacity(n);
    if (n > 0 && gpu && fieldBind) {
        try {
            gpu.queue.writeBuffer(fieldBuf, 0, fieldF32.subarray(0, n * 8));
            gpu.queue.writeBuffer(metaBuf, 0, metaF32.subarray(0, n * 4));
        } catch { uploadErrors++; }
    }

    manifestWindow(fieldCount, rawTick / 1000);

    if (ts - lastDebug > stableTick * 6 || lastDebug === 0) { lastDebug = ts; updateDebug(); }
    requestAnimationFrame(ω);
}

const debugEl = document.createElement('div');
debugEl.style.cssText = 'position:fixed;bottom:12px;left:12px;font:12px/1.6 monospace;color:#d8c8a0;z-index:9999;white-space:pre;pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,0.95);';
document.body.appendChild(debugEl);
let lastDebug = 0;
function updateDebug() {
    const tps = stableTick > 0 ? (1000 / stableTick).toFixed(1) : '0';
    debugEl.textContent =
        `Presence\n  X: ${xPresence.toExponential(3)}\n  Y: ${yPresence.toExponential(3)}\n  Z: ${zPresence.toExponential(3)}\n  Time: ${tPresence.toFixed(1)}\n\n` +
        `Surface\n  GPU: ${gpuStatus}\n  WASM: ${wasmStatus}\n  Pixels: ${RX}x${RY}\n  Scale: ${gridStep.toExponential(1)} m/px\n  Osc in window: ${fieldCount}\n  TPS: ${tps}\n`;
}

window.addEventListener('wheel', (e) => { e.preventDefault(); gridStep /= Math.pow(2, e.deltaY / 512); }, { passive: false });
window.addEventListener('resize', () => { RX = window.innerWidth; RY = window.innerHeight; });
window.addEventListener('contextmenu', (e) => e.preventDefault());
window.addEventListener('keydown', (e) => { keysDown.add(e.key); });
window.addEventListener('keyup', (e) => { keysDown.delete(e.key); });
window.addEventListener('keydown', (e) => {
    if (e.key === 's') { pPresence = [0, 0, 0]; vPresence = [0, 0, 0]; }
    if (e.key === 'f') { fieldVisible = !fieldVisible; }
    if (e.key === 'e') { exposureBoost = Math.min(exposureBoost + 1 / Φ, 16); }
    else if (e.key === 'E') { exposureBoost = Math.max(exposureBoost - 1 / Φ, -8); }
    if (e.key === 'd' && debugEl) { debugEl.style.display = (debugEl.style.display === 'none') ? 'block' : 'none'; }
});

window.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, bx: e.clientX, by: e.clientY, button: e.button, panX: 0, panY: 0 });
    if (pointers.size === 2) {
        const pts = [...pointers.values()];
        pinchPrev = { spread: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y), angle: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x), mid: [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2] };
    }
});
window.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    const [fr, fu, ff] = orientationFrame();
    if (pointers.size === 1) {
        if (p.button === 2) {
            if (dx !== 0) qOrientation = qNorm(qMul(qAxisAngle(fu, dx * gridStep / 4611686018427387904), qOrientation));
            if (dy !== 0) qOrientation = qNorm(qMul(qAxisAngle(fr, dy * gridStep / 4611686018427387904), qOrientation));
        } else if (Math.abs(e.clientX - p.bx) > 10 || Math.abs(e.clientY - p.by) > 10) {
            const totalDx = e.clientX - p.bx, totalDy = e.clientY - p.by;
            const moveDx = totalDx - p.panX, moveDy = totalDy - p.panY;
            if (moveDx !== 0 || moveDy !== 0) {
                pPresence[0] -= fr[0] * moveDx * gridStep - fu[0] * moveDy * gridStep;
                pPresence[1] -= fr[1] * moveDx * gridStep - fu[1] * moveDy * gridStep;
                pPresence[2] -= fr[2] * moveDx * gridStep - fu[2] * moveDy * gridStep;
                p.panX = totalDx; p.panY = totalDy;
            }
        }
    } else if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const mid = [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2];
        const spread = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
        if (pinchPrev) {
            const dmy = mid[1] - pinchPrev.mid[1];
            if (Math.abs(dmy) > 4) { gridStep /= Math.pow(2, dmy / 512); }
            const da = angle - pinchPrev.angle;
            if (da !== 0) qOrientation = qNorm(qMul(qAxisAngle(ff, da), qOrientation));
        }
        pinchPrev = { spread, angle, mid };
    } else if (pointers.size >= 3) {
        tThrustTarget = Math.max(-4, Math.min(4, -dy / 64));
    }
});
const pointerEnd = (e) => { pointers.delete(e.pointerId); pinchPrev = null; if (pointers.size < 3) tThrustTarget = 0; };
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);

initWasm().then(() => {
    if (wasmExports) {
        cdningest();
    }
    initFieldGPU();
    requestAnimationFrame(ω);
});
</script>
</body>
</html>
