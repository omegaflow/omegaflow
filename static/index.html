fn hsl_to_rgb(h: f32, s: f32, l: f32) -> vec3f {
    let c = (1.0 - abs(2.0 * l - 1.0)) * s;
    let hp = h * 6.0;

fn erfc(x: f32) -> f32 {
    let xa = abs(x);
    let t = 1.0 / (1.0 + 0.3275911 * xa);
    let poly = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
    let y = poly * exp(-xa * xa);
    return select(y, 2.0 - y, x < 0.0);
}

fn field_spatial(d2: f32, d_mag: f32, extent: f32, force_type: u32, global_scale: f32) -> f32 {
    let perceptual_extent = max(extent, global_scale);
    let e2 = perceptual_extent * perceptual_extent;
    let s2 = global_scale * global_scale;

    if (force_type == 0u || force_type == 1u) {
        return 1.0 / max(d2 + s2, s2);
    } else if (force_type == 5u || force_type == 6u) {
        return erfc(d_mag / max(perceptual_extent * sqrt(2.0), global_scale));
    } else if (force_type == 4u) {
        return exp(-d2 / (2.0 * max(e2, s2))) / (d_mag + sqrt(s2));
    } else {
        return exp(-d2 / (2.0 * max(e2, s2))) / max(d2 + s2, s2);

                debugEl.style.cssText = 'position:fixed;bottom:12px;left:12px;font:11px "SF Mono",Menlo,Consolas,monospace;color:#a89878;background:rgba(10,9,8,0.85);padding:14px 16px;margin:0;border:none;border-radius:4px;z-index:9999;line-height:1.65;width:440px;height:400px;resize:none;backdrop-filter:blur(10px);box-shadow:0 4px 24px rgba(0,0,0,0.4);overflow:hidden;white-space:pre;';
                document.body.appendChild(debugEl);
            }
            if (ts - lastDebug > stableTick * 6 || lastDebug === 0) {
                lastDebug = ts;
                let maxFill = 0;
                for (let i = 0; i < oscillators.length; i++) maxFill = Math.max(maxFill, oscillators[i].filled);
                const xStr = isFinite(xPresence) ? xPresence.toExponential(3) : 'NaN';
                const yStr = isFinite(yPresence) ? yPresence.toExponential(3) : 'NaN';
                const zStr = isFinite(zPresence) ? zPresence.toExponential(3) : 'NaN';
                let tps = stableTick > 0 ? (1000 / stableTick).toFixed(1) : '0';
                let topOsc = [];
                for (let i = 0; i < oscillators.length; i++) {
                    const o = oscillators[i];
                    if (o.filled > 0) {
                        topOsc.push({ u: o.url.substring(0, 32), v: o.median });
                    }
                }
                topOsc.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
                const topLines = topOsc.slice(0, 12).map(t => `  ${t.u}: ${t.v.toPrecision(4)}`).join('\n');

                debugEl.value =
                    "Presence\n" +
                    `  X: ${xStr}\n` +
                    `  Y: ${yStr}\n` +
                    `  Z: ${zStr}\n` +
                    `  Time: ${tPresence.toFixed(1)}\n` +
                    `  Pan: ${panNow.toExponential(1)} m/s\n` +
                    `  Velocity: ${Math.hypot(vPresence[0], vPresence[1], vPresence[2]).toExponential(1)} m/s\n\n` +
                    `Surface\n` +
                    `  Pixels: ${RX}x${RY}\n` +
                    `  Scale: ${gridStep.toExponential(1)} m/px\n` +
                    `  Oscillators in window: ${rawWindowResponse.count}\n` +
                    `  Uploads: ${uploadCount} ok / ${uploadErrors} err\n` +
                    `  Window omega: ${probedOmega.toExponential(2)} (exposure ${(exposureBoost > 0 ? '+' : '') + exposureBoost} oct)\n` +
                    "\nField (8 Forces)\n" +
                    `  EM (Electromagnetic): ${probedOmegas[0].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[0], Math.pow(2, -40))))}]\n` +
                    `  Gravity (Gravitational): ${probedOmegas[1].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[1], Math.pow(2, -40))))}]\n` +
                    `  Acoustic (Sound): ${probedOmegas[2].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[2], Math.pow(2, -40))))}]\n` +
                    `  SeismicBody (P-wave): ${probedOmegas[3].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[3], Math.pow(2, -40))))}]\n` +
                    `  SeismicSurface (S-wave): ${probedOmegas[4].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[4], Math.pow(2, -40))))}]\n` +
                    `  Thermal (Heat): ${probedOmegas[5].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[5], Math.pow(2, -40))))}]\n` +
                    `  Diffusion (Matter): ${probedOmegas[6].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[6], Math.pow(2, -40))))}]\n` +
                    `  Advective (Wind): ${probedOmegas[7].toExponential(2)} [ref 2^${Math.round(Math.log2(Math.max(forceExposeF[7], Math.pow(2, -40))))}]\n` +
                    `  Total Omega: ${probedOmega.toExponential(2)}\n\n` +
                    "System\n" +
                    `  Oscillators: ${oscillators.length}\n` +
                    `  Ring buffer: ${maxFill}/${CAPTURE_RING_SIZE} samples\n` +
                    `  Ticks per second: ${tps}\n\n` +
                    "Performance\n" +
                    `  GPU: ${gpu ? 'active' : 'none'}\n` +
                    `  Field frames: ${fieldFrames}\n` +
                    `  Frame:     ${rawTick.toFixed(1)}ms\n` +
                    `  Manifest:  ${lastManifestTime.toFixed(1)}ms\n\n` +
                    "Connection\n" +
                    `  WebSocket: ${transport.socket ? 'open' : 'closed'}\n` +
                    `  Round trip: ${transport.rtt.toFixed(0)}ms\n\n` +
                    "Station oscillators\n" +
                    (topLines || "  Waiting for interaction...");
            }
            requestAnimationFrame(ω);
        }
        if (stationFlowConsented) {
            const sensorNames = ['Accelerometer', 'Gyroscope', 'Magnetometer', 'AmbientLightSensor', 'LinearAccelerationSensor', 'GravitySensor'];
            for (const name of sensorNames) {
                if (typeof window[name] !== 'undefined') {
                    try {
                        const inst = new window[name]({ frequency: Math.min(64, stableTick > 0 ? Math.round(1000 / stableTick) : 64), referenceFrame: 'device' });
                        const prefix = name.toLowerCase();
                        inst.addEventListener('reading', () => {
                            for (const p of Object.getOwnPropertyNames(inst)) {
                                if (p === 'timestamp' || p === 'activated') continue;
                                try { const v = inst[p]; if (typeof v === 'number') recordSample(prefix + '.' + p, v); } catch(e) {}
                            }
                        });
                        inst.start();
                            } catch(e) {}
                        }
            }
        }
        window.addEventListener('mousemove', (e) => { recordSample('event.mousemove.x', e.clientX); recordSample('event.mousemove.y', e.clientY); }, { passive: true });
        window.addEventListener('mousedown', (e) => { recordSample('event.mousedown.button', e.button); }, { passive: true });
        window.addEventListener('mouseup', (e) => { recordSample('event.mouseup.button', e.button); }, { passive: true });
        window.addEventListener('wheel', (e) => { recordSample('event.wheel.deltaY', e.deltaY); gridStep /= Math.pow(2, e.deltaY / 512); }, { passive: true });
        window.addEventListener('touchstart', (e) => { if (e.touches.length > 0) { recordSample('event.touchstart.x', e.touches[0].clientX); recordSample('event.touchstart.y', e.touches[0].clientY); } }, { passive: true });
        window.addEventListener('touchmove', (e) => { if (e.touches.length > 0) { recordSample('event.touchmove.x', e.touches[0].clientX); recordSample('event.touchmove.y', e.touches[0].clientY); } }, { passive: true });
        window.addEventListener('touchend', (e) => { recordSample('event.touchend.count', e.changedTouches.length); }, { passive: true });
        window.addEventListener('keydown', (e) => { recordSample('event.keydown.code', e.keyCode); }, { passive: true });
        window.addEventListener('keyup', (e) => { recordSample('event.keyup.code', e.keyCode); }, { passive: true });
        window.addEventListener('click', (e) => { recordSample('event.click.x', e.clientX); recordSample('event.click.y', e.clientY); }, { passive: true });
        window.addEventListener('resize', () => { RX = window.innerWidth; RY = window.innerHeight; recordSample('event.resize.width', RX); recordSample('event.resize.height', RY); }, { passive: true });
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'd' && debugEl) {
                debugEl.style.display = (debugEl.style.display === 'none') ? 'block' : 'none';
            }
        });
        fieldCanvas.style.touchAction = 'none';
        window.addEventListener('pointerdown', (e) => {
            pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, bx: e.clientX, by: e.clientY, button: e.button, panX: 0, panY: 0 });
            if (pointers.size === 2) {
                const pts = [...pointers.values()];
                pinchPrev = { 
                    spread: Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y),
                    angle: Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x),
                    mid: [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2]
                };
            }
        });
        window.addEventListener('pointermove', (e) => {
            const p = pointers.get(e.pointerId);
            if (!p) return;
            const dx = e.clientX - p.x, dy = e.clientY - p.y;
            p.x = e.clientX; p.y = e.clientY;
            const [fr, fu, ff] = orientationFrame();
            if (pointers.size === 1) {
                if (p.button === 2) {
                    if (dx !== 0) qOrientation = qNorm(qMul(qAxisAngle(fu, dx / 256), qOrientation));
                    if (dy !== 0) qOrientation = qNorm(qMul(qAxisAngle(fr, dy / 256), qOrientation));
                } else if (Math.abs(e.clientX - p.bx) > 10 || Math.abs(e.clientY - p.by) > 10) {
                    const totalDx = e.clientX - p.bx;
                    const totalDy = e.clientY - p.by;
                    const moveDx = totalDx - p.panX;
                    const moveDy = totalDy - p.panY;
                    if (moveDx !== 0 || moveDy !== 0) {
                        pPresence[0] -= fr[0] * moveDx * gridStep - fu[0] * moveDy * gridStep;
                        pPresence[1] -= fr[1] * moveDx * gridStep - fu[1] * moveDy * gridStep;
                        pPresence[2] -= fr[2] * moveDx * gridStep - fu[2] * moveDy * gridStep;
                        p.panX = totalDx;
                        p.panY = totalDy;
                    }
                }
            } else if (pointers.size === 2) {
                const pts = [...pointers.values()];
                const mid = [(pts[0].x + pts[1].x) / 2, (pts[0].y + pts[1].y) / 2];
                const spread = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                const angle = Math.atan2(pts[1].y - pts[0].y, pts[1].x - pts[0].x);
                if (pinchPrev) {
                    const dmy = mid[1] - pinchPrev.mid[1];
                    if (Math.abs(dmy) > 4) {
                        gridStep /= Math.pow(2, dmy / 512);
                    }
                    const da = angle - pinchPrev.angle;
                    if (da !== 0) qOrientation = qNorm(qMul(qAxisAngle(ff, da), qOrientation));
                }
                pinchPrev = { spread, angle, mid };
            } else if (pointers.size >= 3) {
                tThrustTarget = Math.max(-4, Math.min(4, -dy / 64));
            }
        });
        const pointerEnd = (e) => { pointers.delete(e.pointerId); pinchPrev = null; if (pointers.size < 3) tThrustTarget = 0; };
        window.addEventListener('pointerup', pointerEnd);
        window.addEventListener('pointercancel', pointerEnd);
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('keydown', (e) => { keysDown.add(e.key); });
        window.addEventListener('keyup', (e) => { keysDown.delete(e.key); });
        window.addEventListener('keydown', (e) => {
            if (e.key === 's') {
                pPresence = [0, 0, 0];
                vPresence = [0, 0, 0];
                t0P = tPresence;
                keysDown.clear();
                e.preventDefault();
            }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'f') { fieldVisible = !fieldVisible; e.preventDefault(); }
            if (e.key === 'e') { exposureBoost = Math.min(exposureBoost + 1, 16); e.preventDefault(); }
            else if (e.key === 'E') { exposureBoost = Math.max(exposureBoost - 1, -8); e.preventDefault(); }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'b') return;
            e.preventDefault();
            pPresence = [0, 0, 0];
            vPresence = [0, 0, 0];
            t0P = tPresence;
            qOrientation = [1, 0, 0, 0];
            keysDown.clear();
        });
        window.addEventListener('error', (e) => { reportState('ERROR', e.message + ' @ ' + e.filename + ':' + e.lineno); e.preventDefault(); });
        window.addEventListener('unhandledrejection', (e) => { reportState('REJECTION', String(e.reason)); e.preventDefault(); });
        requestAnimationFrame(ω);
    </script>
</body>
</html>
