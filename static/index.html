fn wavelength_to_rgb(lambda: f32) -> vec3f {

fn erfc(x: f32) -> f32 {

fn field_spatial(d2: f32, d_mag: f32, extent: f32, kernel_id: u32, global_scale: f32, absorption: f32) -> f32 {

                    const dmy = mid[1] - pinchPrev.mid[1];
                    if (Math.abs(dmy) > 4) {
                        gridStep /= Math.pow(2, dmy / 512);
                    }
                    const da = angle - pinchPrev.angle;
                    if (da !== 0) qOrientation = qNorm(qMul(qAxisAngle(ff, da), qOrientation));
                }
                pinchPrev = { spread, angle, mid };
            } else if (pointers.size >= 3) {
                tThrustTarget = Math.max(-4, Math.min(4, -dy / 64));
            }
        });
        const pointerEnd = (e) => { pointers.delete(e.pointerId); pinchPrev = null; if (pointers.size < 3) tThrustTarget = 0; };
        window.addEventListener('pointerup', pointerEnd);
        window.addEventListener('pointercancel', pointerEnd);
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        window.addEventListener('keydown', (e) => { keysDown.add(e.key); });
        window.addEventListener('keyup', (e) => { keysDown.delete(e.key); });
        window.addEventListener('keydown', (e) => {
            if (e.key === 's') {
                pPresence = [0, 0, 0];
                vPresence = [0, 0, 0];
                t0P = tPresence;
                keysDown.clear();
                e.preventDefault();
            }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === '-' || e.key === '_') { gridStep *= 4; e.preventDefault(); }
            if (e.key === '+' || e.key === '=') { gridStep /= 4; e.preventDefault(); }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'f') { fieldVisible = !fieldVisible; e.preventDefault(); }
            if (e.key === 'e') { exposureBoost = Math.min(exposureBoost + 1.0 / Φ, 16); e.preventDefault(); }
            else if (e.key === 'E') { exposureBoost = Math.max(exposureBoost - 1.0 / Φ, -8); e.preventDefault(); }
        });
        const stationJumps = (() => {
            const jumps = {};
            let key = 1;
            for (const id in BODY_REGISTRY) {
                if (key > 9) break;
                jumps[String(key)] = { target: BODY_REGISTRY[id], grid: Math.pow(2, 28) };
                key++;
            }
            return jumps;
        })();
        window.addEventListener('keydown', (e) => {
            const cfg = stationJumps[e.key];
            if (!cfg) return;
            e.preventDefault();
            fetch(`/jump/${cfg.target}`).then(r => r.text()).then(body => {
                const parts = body.trim().split(/\s+/);
                if (parts.length >= 3) {
                    pPresence = [parseFloat(parts[0]), parseFloat(parts[1]), parseFloat(parts[2])];
                    vPresence = [0, 0, 0];
                    t0P = tPresence;
                    gridStep = cfg.grid;
                }
            }).catch(() => { console.warn('stream empty'); });
        });
        window.addEventListener('keydown', (e) => {
            if (e.key !== 'b') return;
            e.preventDefault();
            pPresence = [0, 0, 0];
            vPresence = [0, 0, 0];
            t0P = tPresence;
            qOrientation = [1, 0, 0, 0];
            keysDown.clear();
        });
        window.addEventListener('error', (e) => { reportState('signal', e.message + ' @ ' + e.filename + ':' + e.lineno); e.preventDefault(); });
        window.addEventListener('unhandledrejection', (e) => { reportState('REJECTION', String(e.reason)); e.preventDefault(); });
        requestAnimationFrame(ω);
    </script>
</body>
</html>
