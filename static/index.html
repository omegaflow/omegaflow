struct VP { surface: vec4f, right: vec4f, up: vec4f, forward: vec4f, expose_lo: vec4f, expose_hi: vec4f, expose_ex: vec4f, presence: vec4f };
const C_VACUUM: f32 = 299792458.0;
const AUDIO_SPEED_AIR: f32 = 343.0;
const PROPAGATION_SPEED: array<f32, 9> = array<f32, 9>(
    C_VACUUM,
    C_VACUUM,
    AUDIO_SPEED_AIR,
    6000.0,
    3000.0,

fn fold_eff(d_mag: f32, raw: f32, t: f32, ttl: f32, force_type: u32, advective_v: f32) -> f32 {
    let v_const = PROPAGATION_SPEED[force_type];
    let v = select(v_const, advective_v, force_type == 7u && advective_v > 0.0);
    let temporal = abs(vp.presence.w - t);
    var retarded = select(temporal - d_mag / v, temporal, v == 0.0 || d_mag == 0.0);
    retarded = max(retarded, 0.0);
    return raw * exp(-retarded / max(ttl, 1e-9));
}
@group(0) @binding(0) var<storage, read> field: array<vec4f>;
@group(0) @binding(1) var<storage, read> props: array<vec4f>;
@group(0) @binding(2) var<uniform> vp: VP;
@group(0) @binding(3) var<storage, read_write> probe_out: array<f32>;

struct VOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f, @location(1) color: vec3f, @location(2) @interpolate(flat) kernel_id: u32, @location(3) @interpolate(flat) absorption: f32, @location(4) @interpolate(flat) force_type: u32, @location(5) @interpolate(flat) advection: f32, @location(6) @interpolate(flat) d_mag: f32, @location(7) @interpolate(flat) extent: f32 };

const DISPLAY_GAMUT_SATURATION: f32 = 1.0;

fn hsl_to_rgb(h: f32, s: f32, l: f32) -> vec3f {
    let c = (1.0 - abs(2.0 * l - 1.0)) * s;
    let hp = h * 6.0;
    let x = c * (1.0 - abs(hp - 2.0 * floor(hp / 2.0) - 1.0));
    let m = l - c * 0.5;
    var rgb01: vec3f;
    if (hp < 1.0)       { rgb01 = vec3f(c, x, 0.0); }
    else if (hp < 2.0)  { rgb01 = vec3f(x, c, 0.0); }
    else if (hp < 3.0)  { rgb01 = vec3f(0.0, c, x); }
    else if (hp < 4.0)  { rgb01 = vec3f(0.0, x, c); }
    else if (hp < 5.0)  { rgb01 = vec3f(x, 0.0, c); }
    else                { rgb01 = vec3f(c, 0.0, x); }
    return rgb01 + vec3f(m);
}

@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
    let count = u32(vp.surface.z);
    var out: VOut;
    out.pos = vec4f(0.0, 0.0, 0.0, 1.0);
    out.uv = vec2f(0.0);
    out.color = vec3f(0.0);
    out.kernel_id = 0u;
    if (count == 0u) { return out; }

    let id = i / 6u;
    if (id >= count) { return out; }
    let vid = i % 6u;

    var quad = array<vec2f, 6>(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
        vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0)
    );

    let m = field[id * 3u];
    var d = m.xyz;
    let beta = vec3f(vp.right.w, vp.up.w, vp.forward.w);
    let b2 = dot(beta, beta);
    var dopp = 1.0;
    let d_mag0 = length(d);
    if (b2 > 1e-12 && d_mag0 > 0.0) {
        let gamma = 1.0 / sqrt(max(1.0 - b2, 1e-9));
        let n_hat = d / d_mag0;
        let nb = dot(n_hat, beta);
        dopp = gamma * (1.0 + nb);
        let bmag = sqrt(b2);
        let bhat = beta / bmag;
        let nbh = dot(n_hat, bhat);
        let n_prime = (n_hat + ((gamma - 1.0) * nbh + gamma * bmag) * bhat) / (gamma * (1.0 + nb));
        d = n_prime * d_mag0;
    }
    let val = m.w;
    let tm = field[id * 3u + 1u];
    let fm = field[id * 3u + 2u];
    let mt = props[id];
    let extent = mt.x;
    let tau = mt.y;

    let w = vp.surface.x;
    let h = vp.surface.y;
    let scale = vp.surface.w;

    let x = dot(d, vp.right.xyz);
    let y = dot(d, vp.up.xyz);
    var clip = vec2f(x / (w * scale * 0.5), y / (h * scale * 0.5));

    let d_mag = length(d);
    let phys_extent = mt.x;
    out.d_mag = d_mag;
    out.extent = phys_extent;
    let w_f = max(w, h);
    var point_size_px = clamp(phys_extent / scale, 0.5, max(w_f * 0.2, 1.0));
    
    clip.x += (quad[vid].x * point_size_px) / w * 2.0;
    clip.y += (quad[vid].y * point_size_px) / h * 2.0;

    out.pos = vec4f(clip, 0.0, 1.0);
    out.uv = quad[vid];

    let k_id = u32(mt.z);
    let ft = u32(tm.z);
    out.kernel_id = k_id;
    out.absorption = f32(tm.w);
    out.advection = fm.x;
    var lvl = get_expose(ft);
    if (lvl <= 0.0) { return out; }

    let hue_center = fract(log2(max(tau, 1.0)) / 16.0 + f32(k_id) * 0.125);
    let tau_freq = 1.0 / max(tau, exp2(-32.0));
    let color_shift = clamp(log2(tau_freq) / 8.0, -0.25, 0.25);
    let hue = fract(hue_center + color_shift + f32(u32(tm.z)) / 9.0 + log2(dopp) * 0.125);
    let lum = clamp(log2(abs(fold_eff(d_mag, val, tm.x, tm.y, u32(tm.z), fm.x)) * pow(dopp, 4.0) + 1.0) / log2(lvl + 1.0), 0.0, 1.0);
    let rgb = hsl_to_rgb(hue, DISPLAY_GAMUT_SATURATION, lum);
    out.color = rgb;
    out.force_type = u32(tm.z);
    return out;
}

fn get_expose(ft: u32) -> f32 {
    if (ft < 4u) {
        return vp.expose_lo[ft];
    } else if (ft < 8u) {
        return vp.expose_hi[ft - 4u];
    } else {
        return vp.expose_ex[ft - 8u];
    }
}

fn erfc(x: f32) -> f32 {
    let xa = abs(x);
    let t = 1.0 / (1.0 + 0.3275911 * xa);
    let poly = t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))));
    let y = poly * exp(-xa * xa);
    return select(y, 2.0 - y, x < 0.0);
}

fn field_spatial(d2: f32, d_mag: f32, extent: f32, kernel_id: u32, global_scale: f32, absorption: f32) -> f32 {
    let perceptual_extent = max(extent, global_scale);
    let e2 = perceptual_extent * perceptual_extent;
    let s2 = global_scale * global_scale;

    if (kernel_id == 0u || kernel_id == 6u) {
        return 1.0 / max(d2 + s2, s2);
    } else if (kernel_id == 3u) {
        return erfc(d_mag / max(perceptual_extent * sqrt(2.0), global_scale));
    } else if (kernel_id == 2u) {
        return exp(-d2 / (2.0 * max(e2, s2))) / (d_mag + sqrt(s2));
    } else if (kernel_id == 4u) {
        return exp(-d_mag / max(perceptual_extent, global_scale));
    } else if (kernel_id == 5u) {
        let alpha = clamp(absorption, 0.0, 1.0);
        let beta = 1.6;
        let core = exp(-d2 / (2.0 * max(e2, s2)));
        let tail = pow(max(e2, s2), beta * 0.5) / pow(max(d2 + s2, s2), beta * 0.5);
        return (1.0 - alpha) * core + alpha * tail;
    } else {
        return exp(-d2 / (2.0 * max(e2, s2))) / max(d2 + s2, s2);
    }
}

@compute @workgroup_size(1)
fn presence_probe() {
    let count = u32(vp.surface.z);
    if (count == 0u) {
        for (var i: u32 = 0u; i < 7u; i = i + 1u) { probe_out[i] = 0.0f; }
        return;
    }
    let soft = vp.surface.w;

    var omegas: array<f32, 7>;
    for (var i: u32 = 0u; i < 7u; i = i + 1u) { omegas[i] = 0.0f; }

    for (var j = 0u; j < count; j = j + 1u) {
        let m = field[j * 3u];
        let tm = field[j * 3u + 1u];
        let fm = field[j * 3u + 2u];
        let d = m.xyz;
        let d2 = dot(d, d);
        let d_mag = sqrt(d2);
        let mt = props[j];
        let extent = mt.x;
        let kernel_id = u32(mt.z);
        let absorption = f32(tm.w);

        let val_eff = fold_eff(d_mag, m.w, tm.x, tm.y, u32(tm.z), fm.x);
        let sk = field_spatial(d2, d_mag, extent, kernel_id, soft, absorption);

        if (kernel_id < 7u) {
            omegas[kernel_id] += val_eff * sk;
        }
    }

    for (var i: u32 = 0u; i < 7u; i = i + 1u) {
        probe_out[i] = omegas[i];
    }
}

@fragment fn fs(in: VOut) -> @location(0) vec4f {
    let dist = length(in.uv);
    if (dist > 1.0) { discard; }

    let intensity = 1.0 - dist * dist;

    let noise = fract(sin(dot(in.pos.xy, vec2f(12.9898, 78.233))) * 43758.5453);
    let analog_intensity = intensity * (0.9 + noise * 0.1);

    let hdr_color = in.color * analog_intensity;
    let mapped_color = log2(hdr_color * 4.0 + vec3f(1.0)) / 8.0;
    let alpha = clamp(exp(-in.absorption * analog_intensity * 10.0), 0.0, 1.0);
    return vec4f(clamp(mapped_color, vec3f(0.0), vec3f(1.0)), alpha);
}
