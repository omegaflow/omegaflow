<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omegaflow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0908; color: #c4b9a8; font-family: system-ui, monospace; }
body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
h1 { font-size: 2.5rem; font-weight: 200; letter-spacing: 0.15em; color: #f0e8d8; margin-bottom: 2rem; }
a { color: #a89878; text-decoration: none; font-size: 1rem; padding: 0.5rem 1.5rem; border: 1px solid #3a3630; }
a:hover { background: #141210; }
</style>
</head>
<body>
<h1>&phi;(x,y,z,t)</h1>
<a id="link" href="#">Download</a>
<script>
const ua = navigator.userAgent;
const isMobile = ua.includes('Android') || ua.includes('iPhone') || ua.includes('iPad') || ua.includes('Mobi');
const link = document.getElementById('link');

if (isMobile) {
    link.href = '/app.html';
    link.textContent = 'Open';
} else if (ua.includes('Win')) {
    link.href = 'https://github.com/omegaflow/omegaflow/releases/latest/download/omegaflow_windows.exe';
    link.textContent = 'Download for Windows';
} else if (ua.includes('Mac')) {
    link.href = ua.includes('Arm')
        ? 'https://github.com/omegaflow/omegaflow/releases/latest/download/omegaflow_macos_arm64'
        : 'https://github.com/omegaflow/omegaflow/releases/latest/download/omegaflow_macos_intel';
    link.textContent = 'Download for macOS';
} else if (ua.includes('Linux')) {
    link.href = 'https://github.com/omegaflow/omegaflow/releases/latest/download/omegaflow_linux';
    link.textContent = 'Download for Linux';
} else {
    link.href = 'https://github.com/omegaflow/omegaflow/releases';
    link.textContent = 'Releases';
}
</script>
</body>
</html>
