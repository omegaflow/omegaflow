<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omegaflow</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #0a0908; color: #c4b9a8; font-family: system-ui, monospace; overflow: hidden; }

body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, #141210 0%, #0a0908 100%);
}

h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 200; letter-spacing: 0.15em;
  color: #f0e8d8; margin-bottom: 1rem;
  text-shadow: 0 0 40px rgba(130,120,180,0.10), 0 0 80px rgba(130,120,180,0.05);
  animation: titleIn 2s ease;
}

@keyframes titleIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: none; } }

.buttons {
  display: flex; gap: 3rem; margin: 2rem 0 1.5rem;
  animation: buttonsIn 2.5s ease;
}
@keyframes buttonsIn { 0% { opacity: 0; } 60% { opacity: 0; } 100% { opacity: 1; } }

a.glyph {
  display: flex; align-items: center; justify-content: center;
  width: clamp(3.5rem, 8vw, 5rem);
  height: clamp(3.5rem, 8vw, 5rem);
  border-radius: 50%;
  text-decoration: none;
  font-size: clamp(1.8rem, 4vw, 2.5rem);
  font-weight: 200;
  position: relative;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

a.glyph::before {
  content: ''; position: absolute; inset: -6px; border-radius: 50%;
  opacity: 0; transition: opacity 0.3s ease;
}
a.glyph:hover { transform: scale(1.08); }
a.glyph:hover::before { opacity: 1; }

a#btn-φ {
  color: #c4a45a; border: 1.5px solid rgba(196,164,90,0.3);
  box-shadow: 0 0 30px rgba(196,164,90,0.06), 0 0 60px rgba(196,164,90,0.03);
}
a#btn-φ:hover {
  box-shadow: 0 0 40px rgba(196,164,90,0.15), 0 0 80px rgba(196,164,90,0.06);
  border-color: rgba(196,164,90,0.5);
}
a#btn-φ::before { box-shadow: 0 0 50px rgba(196,164,90,0.12); }

a#btn-Φ {
  color: #b8a0d8; border: 1.5px solid rgba(184,160,216,0.3);
  box-shadow: 0 0 40px rgba(184,160,216,0.08), 0 0 80px rgba(184,160,216,0.04);
}
a#btn-Φ:hover {
  box-shadow: 0 0 50px rgba(184,160,216,0.2), 0 0 100px rgba(184,160,216,0.08);
  border-color: rgba(184,160,216,0.5);
}
a#btn-Φ::before { box-shadow: 0 0 60px rgba(184,160,216,0.15); }

.pulse { animation: pulse 4s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: inherit; }
  50% { box-shadow: 0 0 60px rgba(184,160,216,0.12), 0 0 120px rgba(184,160,216,0.04); }
}

.labels { display: flex; gap: 3rem; text-align: center; margin-bottom: 0.3rem; }
.labels span { width: clamp(3.5rem, 8vw, 5rem); font-size: 0.6rem; color: #5a5550; }
.labels span b { display: block; font-weight: 400; color: #8a8270; font-size: 0.7rem; }

.info { font-size: 0.65rem; color: #5a5550; max-width: 22rem; text-align: center; line-height: 1.5; margin-bottom: 0.5rem; }

.platforms { font-size: 0.6rem; color: #3a3630; margin-top: 1.5rem; }
.platforms a { color: #5a5550; text-decoration: none; }
.platforms a:hover { color: #8a8270; }

.note { font-size: 0.55rem; color: #4a453f; margin-top: 0.4rem; }
</style>
</head>
<body>

<h1>&phi;(<span style="color:#c4a45a">x</span>,<span style="color:#b8a0d8">y</span>,<span style="color:#c4a45a">z</span>,<span style="color:#b8a0d8">t</span>)</h1>

<div class="info" id="info"></div>

<div class="buttons">
  <a id="btn-φ" class="glyph" href="#" aria-label="omegaflow standalone">&phi;</a>
  <a id="btn-Φ" class="glyph pulse" href="#" aria-label="omegaflow full">&Phi;</a>
</div>
<div class="labels">
  <span><b>standalone</b>~10 MB</span>
  <span><b>full</b>~1.7 GB</span>
</div>

<div class="platforms" id="platforms"></div>
<div class="note">unsigned — macOS Gatekeeper and Windows SmartScreen will ask before running</div>

<script>
const φ = document.getElementById('btn-φ');
const Φ = document.getElementById('btn-Φ');
const info = document.getElementById('info');
const platforms = document.getElementById('platforms');

const ua = navigator.userAgent;
const isMobile = /Android|iPhone|iPad|iPod|Mobi/i.test(ua);
const isAndroid = /Android/i.test(ua);
const isMac = /Mac/i.test(ua) || /iPhone|iPad|iPod/i.test(ua);
const isWin = /Win/i.test(ua);
const isLinux = /Linux/i.test(ua) && !/Android/i.test(ua);

const base = 'https://github.com/omegaflow/omegaflow/releases/latest/download/';

function pick(arm) {
    if (isMac) return arm ? 'omegaflow_macos_arm64' : 'omegaflow_macos_intel';
    if (isWin) return 'omegaflow_windows.exe';
    if (isLinux) return arm ? 'omegaflow_linux_arm64' : 'omegaflow_linux';
    return 'omegaflow_linux';
}

if (isMobile) {
    φ.href = isAndroid ? base + 'omegaflow_linux_arm64' : 'https://github.com/omegaflow/omegaflow';
    Φ.href = 'https://github.com/omegaflow/omegaflow';
    info.innerHTML = isAndroid
        ? 'Android: install Termux, then run the Linux ARM64 binary'
        : 'Ω needs a Linux host. Desktop or Android/Termux.';
    Φ.classList.remove('pulse');
} else {
    Φ.href = base + 'omegaflow_sources.tar.gz';
    const uaArm = /arm|aarch/i.test(ua);
    if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        navigator.userAgentData.getHighEntropyValues(['architecture']).then(v => {
            φ.href = base + pick(/arm|aarch/i.test(v.architecture || ''));
        }).catch(() => { φ.href = base + pick(uaArm); });
    } else {
        φ.href = base + pick(uaArm);
    }
}

const allLinks = [
    ['Linux (x64)', base + 'omegaflow_linux'],
    ['Linux (ARM64)', base + 'omegaflow_linux_arm64'],
    ['macOS (Apple Silicon)', base + 'omegaflow_macos_arm64'],
    ['macOS (Intel)', base + 'omegaflow_macos_intel'],
    ['Windows (x64)', base + 'omegaflow_windows.exe'],
];
platforms.innerHTML = allLinks.map(l => `<a href="${l[1]}">${l[0]}</a>`).join(' · ');

(function probe() {
    if (isMobile) return;
    const start = performance.now();
    const img = new Image();
    img.onload = () => {
        const kbps = (64 * 8) / ((performance.now() - start) / 1000);
        if (kbps > 500) {
            info.textContent = 'Φ empfohlen — binary + alle Ephemeriden';
            Φ.classList.add('pulse');
        } else {
            info.textContent = 'φ empfohlen — binary only, Quellen bei Bedarf vom CDN';
            Φ.classList.remove('pulse');
        }
    };
    img.onerror = () => {
        info.textContent = 'φ — binary only (~1 MB)';
        Φ.classList.remove('pulse');
    };
    img.src = 'probe_64k.bin?' + Date.now();
})();
</script>
</body>
</html>
