<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omegaflow — membrane</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; background: #000; color: #c4b9a8; font-family: system-ui, monospace; overflow: hidden; }
#surface { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#status {
  position: fixed; left: 12px; bottom: 10px; font-size: 12px; letter-spacing: 0.05em;
  color: #6b6256; pointer-events: none; user-select: none; z-index: 9;
}
#hint {
  position: fixed; right: 12px; bottom: 10px; font-size: 12px; color: #4a453f;
  pointer-events: none; user-select: none; z-index: 9;
}
</style>
</head>
<body>
<canvas id="surface"></canvas>
<div id="status"></div>
<div id="hint">arrows thrust · s halt · -/= or wheel zoom</div>
<script type="module">
// The serverless membrane — the presence rests on the ICRS grid at the SSB origin
// and is freely tunable through the 4D block: every coordinate (x,y,z,t) is
// re-evaluated by the WASM lookup over the static CDN corpus, then rendered by the
// GPU. No server, no relay: the two same-origin assets are the whole source.
//
// Assets staged same-origin by pages-deploy.yml:
//   /dr3_stars.bin  (ssd.jpl.nasa.gov-gaia, catalog_epoch 2000.0)
// The WASM web bundle (pkg/omegaflow.js + pkg/omegaflow_bg.wasm) is built by CI
// with `wasm-pack build --target web --release` and copied next to this page.
// Loaded dynamically so a missing bundle stays an honest black, not a blank page.

const CATALOG_EPOCH_YR = 2000.0;       // Riss: the register declares catalog_epoch 2016.0
                                       // (phi/sources.φ:17466); this page carries 2000.0. The
                                       // value is Mountain's verdict — not silently aligned.
const J2000_UNIX_S = 946728000;        // 2000-01-01T12:00:00 UTC — the catalog epoch on UNIX
const VIEW_SPAN_M = 2.53e17;           // the measured star enclosure at the SSB (≈ 8.2 pc, c·age)
// The body anchors (phi/sources.φ:3450-3469, `at earth|moon|sun`); each staged
// .bin carries the measured props. The anchor's field ttl is the .bin's own
// granule span — never the register's ttl 86400, which is the fetch cadence.
// The array is the load order, and it is visibility order: the sun (the
// brightest, the operator gate) is fetched and rendered first, moon and earth
// follow. The star catalog, the faint layer, streams in last.
const BODIES = ["sun", "earth", "moon"];

const canvas = document.getElementById("surface");
const statusEl = document.getElementById("status");

const state = {
  px: 0, py: 0, pz: 0,
  vx: 0, vy: 0, vz: 0,
  scale: VIEW_SPAN_M / 400.0,
  lvl: 1.0,
  t: 0,
  held: new Set(),
};

let lookup = null;

function status(text) {
  statusEl.textContent = text;
}

// Yield to the event loop so a status line is actually drawn before the next
// heavy step. Without it the synchronous star parse and the 95 MB body download
// leave the operator on a stale line (a black field read as a hang) even though
// the work is progressing.
function paint() {
  return new Promise((resolve) => requestAnimationFrame(() => resolve()));
}

function pct(got, total) {
  if (!total) {
    return "";
  }
  return " " + Math.min(100, Math.round((got / total) * 100)) + "%";
}

// Stream the body and, when a label is given, paint the measured progress each
// chunk. The content-length may name the compressed size, so the share is
// clamped; silence is the honest state when the header is absent.
async function fetchBytes(path, label) {
  const r = await fetch(path);
  if (!r.ok) {
    return null;
  }
  const total = Number(r.headers.get("content-length")) || 0;
  if (!r.body) {
    return new Uint8Array(await r.arrayBuffer());
  }
  const reader = r.body.getReader();
  const chunks = [];
  let got = 0;
  let lastByte = performance.now();
  // A label drives a live line; the silent seconds name a stalled stream so a
  // standing percentage can never be mistaken for progress.
  const draw = () => {
    if (!label) {
      return;
    }
    const age = Math.round((performance.now() - lastByte) / 1000);
    status(label + pct(got, total) + (age >= 20 ? " · no bytes for " + age + " s" : ""));
  };
  const timer = label ? setInterval(draw, 1000) : null;
  for (;;) {
    const { done, value } = await reader.read();
    if (done) {
      break;
    }
    chunks.push(value);
    got += value.length;
    lastByte = performance.now();
    draw();
  }
  if (timer) {
    clearInterval(timer);
  }
  const out = new Uint8Array(got);
  let off = 0;
  for (const c of chunks) {
    out.set(c, off);
    off += c.length;
  }
  return out;
}

// The flat WASM response (26 × f64 per record) into the wire's two GPU planes:
// field = osc × 12 (x,y,z,val,epoch,ttl,force_type,absorption,advection,vx,vy,vz),
// meta  = osc × 16 (extent,tau,kernel_id,pole_x,pole_y,pole_z,j2,j4,r_eq,
//                   color_index,freq,bin_width,phase,presence,pad).
// Mirrors static/constants.js parseRecords; the record order is the data contract.
function parseFlat(flat) {
  const count = Math.floor(flat.length / 26);
  const field = new Float32Array(count * 12);
  const meta = new Float32Array(count * 16);
  for (let j = 0; j < count; j++) {
    const b = j * 26;
    const f = j * 12;
    field[f] = flat[b];
    field[f + 1] = flat[b + 1];
    field[f + 2] = flat[b + 2];
    field[f + 3] = flat[b + 3];
    field[f + 4] = flat[b + 4];
    field[f + 5] = flat[b + 5];
    field[f + 6] = flat[b + 9];
    field[f + 7] = flat[b + 10];
    field[f + 8] = flat[b + 11];
    field[f + 9] = flat[b + 12];
    field[f + 10] = flat[b + 13];
    field[f + 11] = flat[b + 14];

    const m = j * 16;
    meta[m] = flat[b + 7];
    meta[m + 1] = flat[b + 6];
    meta[m + 2] = flat[b + 8];
    meta[m + 3] = flat[b + 9] === 0 ? flat[b + 15] : 0;
    meta[m + 4] = flat[b + 15];
    meta[m + 5] = flat[b + 16];
    meta[m + 6] = flat[b + 17];
    meta[m + 7] = flat[b + 18];
    meta[m + 8] = flat[b + 19];
    meta[m + 9] = flat[b + 20];
    meta[m + 10] = flat[b + 21];
    meta[m + 11] = flat[b + 22];
    meta[m + 12] = flat[b + 23];
    meta[m + 13] = flat[b + 24];
    meta[m + 14] = flat[b + 25];
    meta[m + 15] = 0;
  }
  return { count, field, meta };
}

const fieldShader = `
// vp.expose = (lvl, color_mode, lut_lo, lut_hi): color_mode >= 0.5 selects the
// measured color LUT; lvl is the exposure level in both modes.
struct VP { surface: vec4f, right: vec4f, up: vec4f, expose: vec4f };
@group(0) @binding(0) var<storage, read> field: array<vec4f>;
@group(0) @binding(1) var<storage, read> props: array<vec4f>;
@group(0) @binding(2) var<uniform> vp: VP;
struct VOut { @builtin(position) pos: vec4f, @location(0) local_uv: vec2f, @location(1) color: vec4f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VOut {
    let count = u32(vp.surface.z);
    var out: VOut;
    out.pos = vec4f(0.0, 0.0, 0.0, 1.0);
    out.local_uv = vec2f(0.0);
    out.color = vec4f(0.0);
    if (count == 0u) { return out; }
    let id = i / 6u;
    if (id >= count) { return out; }
    let vid = i % 6u;
    var quad = array<vec2f, 6>(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
        vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0)
    );
    let m = field[id * 3];
    let d = m.xyz;
    let val = m.w;
    let extent = props[id * 4].x;
    let w = vp.surface.x;
    let h = vp.surface.y;
    let scale = vp.surface.w;
    let x = dot(d, vp.right.xyz);
    let y = dot(d, vp.up.xyz);
    var clip = vec2f(x / (w * scale * 0.5), y / (h * scale * 0.5));
    let point_size_px = clamp(extent / scale, 2.0, 128.0);
    clip.x += (quad[vid].x * point_size_px) / w * 2.0;
    clip.y += (quad[vid].y * point_size_px) / h * 2.0;
    out.pos = vec4f(clip, 0.0, 1.0);
    out.local_uv = quad[vid];
    let lvl = vp.expose.x;
    if (lvl <= 0.0) { return out; }
    let aw = abs(val);
    let t2 = clamp((log2(aw / lvl) + 8.0) / 24.0, 0.0, 1.0);
    let t2s = t2 * t2 * (3.0 - 2.0 * t2);
    let c1 = mix(vec3f(0.0, 0.0, 0.0), vec3f(0.0, 0.15, 0.4), clamp(t2s * 4.0, 0.0, 1.0));
    let c2 = mix(c1, vec3f(0.1, 0.5, 0.9), clamp((t2s - 0.25) * 4.0, 0.0, 1.0));
    let c3 = mix(c2, vec3f(0.8, 0.6, 0.2), clamp((t2s - 0.5) * 4.0, 0.0, 1.0));
    let c4 = mix(c3, vec3f(1.0, 0.95, 0.9), clamp((t2s - 0.75) * 4.0, 0.0, 1.0));
    out.color = vec4f(c4, 1.0);
    return out;
}
@fragment fn fs(in: VOut) -> @location(0) vec4f {
    let dist = length(in.local_uv);
    if (dist > 1.0) {
        discard;
    }
    let intensity = exp(-dist * dist * 4.0);
    return vec4f(in.color.rgb * intensity * in.color.a, intensity * in.color.a);
}
`;

let device = null;
let context = null;
let fieldBuf = null;
let propsBuf = null;
let vpBuf = null;
let fieldCap = 0;
let pipeline = null;
let bindGroup = null;
const vpData = new Float32Array(16);

async function initGPU() {
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) {
    return false;
  }
  device = await adapter.requestDevice();
  context = canvas.getContext("webgpu");
  const format = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format, alphaMode: "premultiplied" });

  const module = device.createShaderModule({ code: fieldShader });
  const layout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
    { binding: 1, visibility: GPUShaderStage.VERTEX, buffer: { type: "read-only-storage" } },
    { binding: 2, visibility: GPUShaderStage.VERTEX, buffer: { type: "uniform" } },
  ] });

  ensureBuffers(4096);
  vpBuf = device.createBuffer({ size: 64, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  pipeline = device.createRenderPipeline({
    layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    vertex: { module, entryPoint: "vs" },
    fragment: {
      module, entryPoint: "fs",
      targets: [{
        format,
        blend: {
          color: { srcFactor: "one", dstFactor: "one", operation: "add" },
          alpha: { srcFactor: "one", dstFactor: "one", operation: "add" },
        },
      }],
    },
    primitive: { topology: "triangle-list" },
  });

  bindGroup = device.createBindGroup({
    layout,
    entries: [
      { binding: 0, resource: { buffer: fieldBuf } },
      { binding: 1, resource: { buffer: propsBuf } },
      { binding: 2, resource: { buffer: vpBuf } },
    ],
  });
  return true;
}

function ensureBuffers(count) {
  if (count <= fieldCap) {
    return;
  }
  fieldCap = count * 2;
  const f = device.createBuffer({ size: fieldCap * 12 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const p = device.createBuffer({ size: fieldCap * 16 * 4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  fieldBuf = f;
  propsBuf = p;
  if (bindGroup) {
    bindGroup = device.createBindGroup({
      layout: bindGroup.layout,
      entries: [
        { binding: 0, resource: { buffer: fieldBuf } },
        { binding: 1, resource: { buffer: propsBuf } },
        { binding: 2, resource: { buffer: vpBuf } },
      ],
    });
  }
}

function render(record) {
  if (!device) {
    return;
  }
  ensureBuffers(record.count);
  const field = record.field;
  // Positions relative to the presence: f32 loses ~0.1 AU at 8 pc absolute (the
  // external voices' measured sharpening), so the GPU never sees an absolute ICRS value.
  for (let j = 0; j < record.count; j++) {
    field[j * 12] -= state.px;
    field[j * 12 + 1] -= state.py;
    field[j * 12 + 2] -= state.pz;
  }
  device.queue.writeBuffer(fieldBuf, 0, field, 0, record.count * 12);
  device.queue.writeBuffer(propsBuf, 0, record.meta, 0, record.count * 16);

  const w = canvas.width;
  const h = canvas.height;
  vpData[0] = w;
  vpData[1] = h;
  vpData[2] = record.count;
  vpData[3] = state.scale;
  vpData[4] = 1; vpData[5] = 0; vpData[6] = 0; vpData[7] = 0;
  vpData[8] = 0; vpData[9] = 1; vpData[10] = 0; vpData[11] = 0;
  vpData[12] = state.lvl;
  vpData[13] = 0;
  vpData[14] = 0;
  vpData[15] = 1;
  device.queue.writeBuffer(vpBuf, 0, vpData);

  const pass = device.createCommandEncoder();
  const rp = pass.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      loadOp: "clear",
      storeOp: "store",
      clearValue: { r: 0, g: 0, b: 0, a: 0 },
    }],
  });
  rp.setPipeline(pipeline);
  rp.setBindGroup(0, bindGroup);
  rp.draw(record.count * 6);
  rp.end();
  device.queue.submit([pass.finish()]);
}

function updateLvl(record) {
  let maxAbs = 0;
  for (let j = 0; j < record.count; j++) {
    const a = Math.abs(record.field[j * 12 + 3]);
    if (a > maxAbs) {
      maxAbs = a;
    }
  }
  if (maxAbs > 0) {
    const alpha = 1 - Math.exp(-1 / 8);
    state.lvl = state.lvl + (maxAbs - state.lvl) * alpha;
  }
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
  canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
}
window.addEventListener("resize", resize);

window.addEventListener("keydown", (e) => {
  if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) {
    return;
  }
  if (e.key === "s" || e.key === "S") {
    state.held.clear();
    state.vx = 0; state.vy = 0; state.vz = 0;
    return;
  }
  if (e.key === "=" || e.key === "+") {
    state.scale *= 0.5;
    return;
  }
  if (e.key === "-" || e.key === "_") {
    state.scale *= 2.0;
    return;
  }
  state.held.add(e.key);
});

window.addEventListener("keyup", (e) => {
  state.held.delete(e.key);
});

window.addEventListener("wheel", (e) => {
  state.scale *= Math.pow(2, e.deltaY * 0.001);
});

function integrate(dt) {
  // Thrust = the view scale (index.html's proved form): a key moves the presence a
  // fixed screen fraction per second, so zoom and motion stay coupled.
  const t = state.scale;
  let vx = 0, vy = 0, vz = 0;
  if (state.held.has("ArrowLeft")) { vx -= t; }
  if (state.held.has("ArrowRight")) { vx += t; }
  if (state.held.has("ArrowUp")) { vy += t; }
  if (state.held.has("ArrowDown")) { vy -= t; }
  if (state.held.has(".")) { vz += t; }
  if (state.held.has(",")) { vz -= t; }
  state.vx = vx;
  state.vy = vy;
  state.vz = vz;
  state.px += vx * dt;
  state.py += vy * dt;
  state.pz += vz * dt;
}

// One field evaluation: the presence's time is the wall clock on the TDB≈UTC
// approximation; the ~69 s (37 leap + 32.18 TT−UTC) is far below one frame's
// light-reach (c·69 s = 2.1e10 m ≪ the 8 pc enclosure pad). The exact LSK path
// stays native/WASM. Used during boot for each arriving layer and by the loop.
function frame() {
  state.t = Date.now() / 1000 - J2000_UNIX_S;
  const flat = lookup.query(state.px, state.py, state.pz, state.t, 0.0, 0.0, 0.0);
  const record = parseFlat(flat);
  updateLvl(record);
  render(record);
  return record;
}

let last = performance.now();
function loop(now) {
  if (!lookup) {
    return;
  }
  const dt = (now - last) / 1000;
  last = now;
  integrate(dt);
  const record = frame();
  status("stars " + record.count + " · scale " + state.scale.toExponential(2) + " m/px · t " + Math.round(state.t) + " s TDB");
  requestAnimationFrame(loop);
}

async function boot() {
  resize();
  status("instantiating lookup…");
  await paint();
  let mod;
  try {
    mod = await import("./omegaflow.js");
    await mod.default();
  } catch {
    status("lookup absent (omegaflow.js / omegaflow_bg.wasm) — honest black");
    return;
  }
  // The lookup starts without the catalog: the visible anchors render first and
  // the fainter stars stream in behind them. The field grows by visibility order,
  // each arriving layer measured and shown before the next is fetched.
  lookup = new mod.MembraneLookup(new Uint8Array(0), CATALOG_EPOCH_YR);
  status("starting GPU…");
  await paint();
  const ok = await initGPU();
  if (!ok) {
    status("no WebGPU adapter — honest black");
    return;
  }

  const missing = [];
  for (const body of BODIES) {
    status("anchoring " + body + "…");
    await paint();
    const eph = await fetchBytes("/ephemeris_de440_" + body + ".bin", "anchoring " + body + "…");
    if (eph) {
      lookup.load_ephemeris(body, eph);
      frame();
    } else {
      missing.push(body);
    }
  }

  status("loading stars…");
  await paint();
  const stars = await fetchBytes("/dr3_stars.bin", "loading stars…");
  if (stars) {
    lookup.add_stars(stars, CATALOG_EPOCH_YR);
  } else {
    missing.push("stars");
  }

  if (missing.length) {
    console.warn("absent: " + missing.join(", "));
    status("absent: " + missing.join(", ") + " — honest black");
  } else {
    status("membrane ready");
  }
  await paint();
  last = performance.now();
  loop(last);
}

boot();
</script>
</body>
</html>
