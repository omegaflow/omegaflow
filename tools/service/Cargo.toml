[package]
name = "omegaflow-service"
version = "1.0.0"
edition = "2024"
license-file = "../../LICENSE"
description = "live services and watchdogs"

[dependencies]
omegaflow = { path = "../.." }
bluer = { version = "0.17.4", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
uuid = "1"
nix = { version = "0.29", features = ["term"] }
