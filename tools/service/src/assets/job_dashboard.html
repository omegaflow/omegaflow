<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>ωflow · job-monitor</title>
<style>
  :root{
    --bg:      #0e1520;
    --panel:   #141d2c;
    --panel2:  #1b2536;
    --border:  #303f58;
    --text:    #eaeef4;
    --dim:     #8a94aa;
    --aqua:    #8fa8dc;
    --teal:    #6aa88c;
    --green:   #8fbca0;
    --red:     #d05a48;
    --amber:   #d0905b;
    --blue:    #6f8fd0;
    --barbg:   #222e42;
    --mono: 'JetBrains Mono','Fira Code','Cascadia Code',
            'Ubuntu Mono','DejaVu Sans Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:var(--mono); font-size:13.5px; line-height:1.45;
    display:flex; flex-direction:column; overflow:hidden;
  }
  ::selection{background:var(--aqua); color:#0e1520}

  /* ── Statusbar ─────────────────────────────────── */
  #bar{
    display:flex; align-items:center;
    background:var(--aqua); color:#0e1520;
    font-weight:700; user-select:none; flex:none;
  }
  #bar.warn{background:var(--amber)}
  #bar.err {background:var(--red); color:#0e1520}
  #bar .seg{padding:3px 10px; white-space:nowrap}
  #bar .grow{flex:1; text-align:right}
  #bar .btn{padding:3px 8px; cursor:pointer; background:rgba(0,0,0,.12)}
  #bar .btn:hover{background:rgba(0,0,0,.28)}

  /* ── Panels ────────────────────────────────────── */
  #grid{
    flex:1; overflow:auto; padding:10px; gap:10px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(330px,1fr));
    grid-auto-rows:minmax(180px,auto);
  }
  .panel{
    border:1px solid var(--border); background:var(--panel);
    display:flex; flex-direction:column; min-height:0;
  }
  .panel-title{
    display:flex; gap:10px; padding:5px 10px; flex:none;
    color:var(--dim); font-size:12px; letter-spacing:.08em;
    text-transform:uppercase;
  }
  .panel-title::before,.panel-title::after{
    content:''; border-top:1px solid var(--border);
    flex:1; align-self:center;
  }
  .panel-body{padding:6px 10px 10px; overflow:auto; flex:1}

  /* ── Job-Zeilen ────────────────────────────────── */
  .job{
    display:flex; align-items:baseline; gap:8px;
    padding:2px 0; white-space:nowrap;
  }
  .job .sym{width:1.4em; text-align:center}
  .job .name{flex:1; overflow:hidden; text-overflow:ellipsis}
  .job .meta{color:var(--dim)}
  .s-run {color:var(--amber)}
  .s-ok  {color:var(--green)}
  .s-fail{color:var(--red)}
  .s-pend{color:var(--dim)}
  .s-info{color:var(--aqua)}
  .dot-run{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.30}}

  .empty{color:var(--dim); padding:2px 0}

  /* ── System-Balken ─────────────────────────────── */
  .meter{margin:6px 0}
  .meter .lbl{display:flex; justify-content:space-between; color:var(--dim)}
  .meter .bar{
    background:var(--barbg); height:16px; overflow:hidden;
    display:flex; margin-top:2px;
  }
  .meter .fill{
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:4px; color:#0e1520; font-weight:700; font-size:11px;
    transition:width .8s ease;
  }
  .f-ok  {background:var(--aqua)}
  .f-mid {background:var(--amber)}
  .f-hot {background:var(--red)}

  /* ── Log ───────────────────────────────────────── */
  .logline{display:flex; gap:8px; white-space:nowrap; overflow:hidden}
  .logline .t{color:var(--dim); flex:none}
  .logline .lvl-ok  {color:var(--green)}
  .logline .lvl-err {color:var(--red)}
  .logline .lvl-run {color:var(--aqua)}

  /* ── Footer / Filter ───────────────────────────── */
  #prompt{
    flex:none; display:flex; align-items:center; gap:6px;
    border-top:1px solid var(--border); padding:4px 10px;
    color:var(--dim);
  }
  #filter{
    background:none; border:none; outline:none; color:var(--text);
    font-family:var(--mono); font-size:13.5px; flex:1;
  }
  #prompt .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  #legend{color:var(--dim); white-space:nowrap; padding:4px 10px; flex:none}

  body.crt::after{
    content:''; position:fixed; inset:0; pointer-events:none;
    background:repeating-linear-gradient(
      0deg, rgba(0,0,0,.10) 0 1px, transparent 1px 3px);
  }
</style>
</head>
<body>

  <div id="bar">
    <div class="seg">ωflow · job-monitor</div>
    <div class="seg" id="seg-myzel">MYZEL 0</div>
    <div class="seg" id="seg-blocker">BLOCKER 0</div>
    <div class="grow"></div>
    <div class="btn" id="btn-crt" title="Scanlines an/aus">crt</div>
    <div class="seg" id="seg-clock">--:--:--</div>
    <div class="seg">⟳ <span id="seg-refresh">5s</span></div>
  </div>

  <div id="grid">

    <div class="panel">
      <div class="panel-title">system</div>
      <div class="panel-body">
        <div class="meter">
          <div class="lbl"><span>cpu</span><span id="cpu-pct">–</span></div>
          <div class="bar"><div class="fill f-ok" id="cpu-fill" style="width:0%"></div></div>
        </div>
        <div class="meter">
          <div class="lbl"><span>ram</span><span id="ram-pct">–</span></div>
          <div class="bar"><div class="fill f-ok" id="ram-fill" style="width:0%"></div></div>
        </div>
        <div style="color:var(--dim); margin-top:8px" id="sys-note">–</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">ci-queue · github actions</div>
      <div class="panel-body" id="ci-list"><div class="empty">lädt …</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">lokale läufe · myzel</div>
      <div class="panel-body" id="local-list"><div class="empty">lädt …</div></div>
    </div>

    <div class="panel">
      <div class="panel-title">log</div>
      <div class="panel-body" id="log-list"><div class="empty">lädt …</div></div>
    </div>
  </div>

  <div id="prompt">
    <span>›</span>
    <input id="filter" placeholder="filter: alle" spellcheck="false">
    <span class="cursor">_</span>
  </div>
  <div id="legend">● läuft&nbsp; ✓ ok&nbsp; ✗ fail&nbsp; ◌ pending&nbsp; ○ skip&nbsp;·&nbsp;A = A</div>

<script>
  const SYM = {run:'●', ok:'✓', fail:'✗', pend:'◌'};

  function symCls(status, conclusion){
    if (status === 'in_progress' || status === 'running') return {sym:SYM.run, cls:'s-run'};
    if (conclusion === 'success') return {sym:SYM.ok, cls:'s-ok'};
    if (conclusion === 'failure') return {sym:SYM.fail, cls:'s-fail'};
    if (conclusion === 'cancelled' || conclusion === 'skipped') return {sym:'○', cls:'s-pend'};
    return {sym:SYM.pend, cls:'s-pend'};
  }

  function age(createdSecs, now){
    if (!createdSecs) return '–';
    const d = Math.max(0, now - createdSecs);
    if (d >= 86400) return Math.floor(d/86400)+'d';
    if (d >= 3600) return Math.floor(d/3600)+'h '+Math.floor((d%3600)/60)+'m';
    if (d >= 60) return Math.floor(d/60)+'m';
    return d+'s';
  }

  function fmtBytes(kb){
    if (kb >= 1048576) return (kb/1048576).toFixed(1)+'G';
    if (kb >= 1024) return Math.round(kb/1024)+'M';
    return kb+'K';
  }

  function row(name, meta, s){
    return `<div class="job ${s.cls}" data-name="${name.toLowerCase()}">
      <span class="sym ${s.cls==='s-run'?'dot-run':''}">${s.sym}</span>
      <span class="name">${name}</span>
      <span class="meta">${meta}</span></div>`;
  }

  function setMeter(id, pctId, v){
    document.getElementById(id).style.width = v + '%';
    document.getElementById(pctId).textContent = v + '%';
    document.getElementById(id).className =
      'fill ' + (v>80?'f-hot':v>60?'f-mid':'f-ok');
  }

  async function fetchData(){
    try {
      const res = await fetch('/data', {cache:'no-store'});
      if (!res.ok) return null;
      return await res.json();
    } catch { return null; }
  }

  async function render(){
    try {
      const d = await fetchData();
      const now = Math.floor(Date.now()/1000);

      const sys = (d && d.system) || {};
      const loadAvg = (typeof sys.load === 'number') ? sys.load : 0;
      const ncpu = sys.ncpu || 1;
      const cpuPct = Math.min(100, Math.round(loadAvg/ncpu*100));
      const memUsed = sys.mem_used_gb || 0;
      const memTotal = sys.mem_total_gb || 1;
      const ramPct = Math.min(100, Math.round(memUsed/memTotal*100));
      setMeter('cpu-fill','cpu-pct', cpuPct);
      setMeter('ram-fill','ram-pct', ramPct);
      document.getElementById('sys-note').textContent =
        `${ncpu} cores · load ${loadAvg.toFixed(2)} · mem ${memUsed.toFixed(1)}G/${memTotal.toFixed(1)}G`;

      const runs = (d && d.runs) || [];
      document.getElementById('ci-list').innerHTML = runs.map(r => {
        const s = symCls(r.status, r.conclusion);
        const meta = (r.status === 'in_progress' && r.total_steps)
          ? `${r.done_steps ?? 0}/${r.total_steps} · ${Math.round((r.done_steps ?? 0)/r.total_steps*100)}%`
          : `${r.conclusion || r.status} · ${age(r.created, now)}`;
        return row(r.name, meta, s);
      }).join('') || '<div class="empty">keine runs</div>';

      const units = (d && d.units) || [];
      const procs = (d && d.procs) || [];
      const localRows = [];
      for (const u of units) {
        const meta = (u.cpu != null ? Math.round(u.cpu)+'% · ' : '') +
          (u.etime || '') + (u.rss_kb ? ' · '+fmtBytes(u.rss_kb) : '');
        localRows.push(row(u.name, meta, symCls('running', null)));
      }
      for (const p of procs) {
        const meta = (p.cpu != null ? Math.round(p.cpu)+'% · ' : '') +
          (p.etime || '') + (p.rss_kb ? ' · '+fmtBytes(p.rss_kb) : '');
        localRows.push(row(p.name+' ['+p.pid+']', meta, symCls('running', null)));
      }
      document.getElementById('local-list').innerHTML =
        localRows.join('') || '<div class="empty">no omegaflow jobs running</div>';

      const logLines = [];
      for (const u of units) {
        if (u.progress && u.progress.total) {
          logLines.push({lvl:'run', msg:`${u.name}: progress ${u.progress.done}/${u.progress.total}`});
        } else if (u.log) {
          logLines.push({lvl:'run', msg:`${u.name}: ${u.log}`});
        }
      }
      for (const p of procs) {
        if (p.progress && p.progress.total) {
          logLines.push({lvl:'run', msg:`${p.name}: progress ${p.progress.done}/${p.progress.total}`});
        } else if (p.log) {
          logLines.push({lvl:'run', msg:`${p.name}: ${p.log}`});
        }
      }
      document.getElementById('log-list').innerHTML = logLines.slice(-14).map(l =>
        `<div class="logline"><span class="lvl-${l.lvl}">${l.lvl==='err'?'✗':'●'}</span><span>${l.msg}</span></div>`
      ).join('') || '<div class="empty">—</div>';

      const fails = runs.filter(r => r.conclusion === 'failure').length;
      const running = runs.some(r => r.status === 'in_progress');
      document.getElementById('bar').className = running ? 'warn' : '';
      document.getElementById('seg-myzel').textContent = 'MYZEL ' + localRows.length;
      document.getElementById('seg-blocker').textContent = 'BLOCKER ' + fails;
      applyFilter(document.getElementById('filter').value);
    } catch (e) {
      document.getElementById('sys-note').textContent = 'data: ' + e;
    }
  }

  function applyFilter(q){
    q=(q||'').toLowerCase().replace(/^filter:\s*/,'');
    document.querySelectorAll('.job').forEach(el=>{
      el.style.display = !q || el.dataset.name.includes(q) ? '' : 'none';
    });
  }
  document.getElementById('filter')
    .addEventListener('input', e=>applyFilter(e.target.value));

  setInterval(()=>{document.getElementById('seg-clock').textContent=
    new Date().toLocaleTimeString('de-DE');},1000);
  document.getElementById('btn-crt')
    .addEventListener('click',()=>document.body.classList.toggle('crt'));

  render();
  setInterval(render, 5000);
</script>
</body>
</html>
